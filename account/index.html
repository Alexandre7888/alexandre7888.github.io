<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Conta · kloewa</title>
<link rel="icon" type="image/png" href="https://alexandre7888.github.io/InShot_20250807_112151490.jpg">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-1:#0a0e1a;--bg-2:#05070f;
  --surface:#101626;--surface-2:#151c30;
  --border:#1f2a44;--border-strong:#2d3b5c;
  --text:#e8eef8;--text-2:#8fa0bd;
  --accent:#4f8cff;--accent-2:#7aa8ff;
  --accent-glow:rgba(79,140,255,.35);
  --danger:#ef4444;--success:#22c55e;--warning:#f59e0b;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 30% 20%,var(--bg-1),var(--bg-2));color:var(--text);min-height:100vh;padding:20px}
.wrap{max-width:760px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.4rem;display:flex;align-items:center;gap:10px}
.header h1 svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{padding:11px 18px;border:none;border-radius:10px;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 6px 20px var(--accent-glow)}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--border-strong);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px}
.card h2{font-size:1.05rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card h2 svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ESTILOS DO FORMULÁRIO DE NOVA CHAVE */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.8rem; color: var(--text-2); margin-bottom: 6px; font-weight: 600; }
.form-control { width: 100%; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.2s; }
.form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,0.2); }

/* ESTILOS DO DISPOSITIVO */
.device{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;transition:.2s}
.device:hover{border-color:var(--border-strong)}
.device.current{border-color:var(--accent);background:rgba(79,140,255,.06)}
.device.blocked{border-color:var(--danger);background:rgba(239,68,68,.06);opacity:.8}
.device-icon{width:44px;height:44px;border-radius:12px;background:rgba(79,140,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.device-icon svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.device.blocked .device-icon{background:rgba(239,68,68,.1)}
.device.blocked .device-icon svg{stroke:var(--danger)}
.device-info{flex:1;min-width:0}
.device-info h3{font-size:.95rem;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.device-info p{font-size:.72rem;color:var(--text-2);word-break:break-all}
.device-actions{display:flex;gap:6px}

.badge{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.3px;text-transform:uppercase}
.badge-current{background:rgba(79,140,255,.2);color:var(--accent-2)}
.badge-blocked{background:rgba(239,68,68,.2);color:#ff8a8a}
.badge-active{background:rgba(34,197,94,.15);color:#6ee7a0}

.status{padding:12px 14px;border-radius:12px;font-size:.85rem;margin-bottom:16px;display:none;align-items:flex-start;gap:10px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.status.show{display:flex}
.status.ok{background:rgba(34,197,94,.12);color:var(--success);border:1px solid rgba(34,197,94,.3)}
.status.err{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.status.info{background:rgba(79,140,255,.12);color:var(--accent-2);border:1px solid rgba(79,140,255,.3)}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.15);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.empty{text-align:center;padding:30px;color:var(--text-2);font-size:.9rem}
</style>
</head>
<body>

<div id="loading" style="text-align:center;padding:60px">
  <div class="spinner" style="margin:0 auto 12px;width:24px;height:24px"></div>
  <p style="color:var(--text-2)">Carregando...</p>
</div>

<div id="app" class="wrap hidden">
  <div class="header">
    <h1>
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Minha Conta
    </h1>
    <button class="btn btn-outline" id="btnLogout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </button>
  </div>

  <div class="status" id="status"></div>

  <!-- CARD 1: DISPOSITIVOS -->
  <div class="card">
    <h2>
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      Dispositivos Conectados
    </h2>
    <div id="devicesList">
      <div class="empty"><div class="spinner" style="margin:0 auto 10px"></div>Carregando...</div>
    </div>
  </div>

  <!-- CARD 2: CHAVES DE ACESSO -->
  <div class="card">
    <h2>
      <svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      Criar Nova Chave de Acesso
    </h2>
    <p style="font-size: 0.85rem; color: var(--text-2); margin-bottom: 16px; line-height: 1.5;">
      Crie uma credencial (WebAuthn) para acessar a Kloewa. É necessário confirmar a sua senha para gerar a chave.
    </p>

    <div class="form-group">
      <label>Nome deste dispositivo</label>
      <input type="text" id="deviceNameInput" class="form-control" placeholder="Ex: Celular do Trabalho, Notebook...">
    </div>
    
    <div class="form-group">
      <label>Senha do Firebase</label>
      <input type="password" id="passwordInput" class="form-control" placeholder="Digite a sua senha para confirmar...">
    </div>

    <button class="btn btn-primary" id="btnAddBio" style="width: 100%; justify-content: center; margin-top: 8px;">
      <svg viewBox="0 0 24 24"><path d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/></svg>
      Gerar Chave de Acesso
    </button>
  </div>

</div>

<script>
const WORKER = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
  authDomain: "html-15e80.firebaseapp.com",
  databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
  projectId: "html-15e80",
  storageBucket: "html-15e80.firebasestorage.app",
  messagingSenderId: "1068148640439",
  appId: "1:1068148640439:web:1ac651348e624f6be41b32"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();

function $(id){ return document.getElementById(id); }

function showStatus(msg, tipo) {
  const s = $("status");
  s.className = "status show " + (tipo || "info");
  s.innerHTML = (tipo === "info" ? '<div class="spinner"></div>' : '') + '<span>' + msg + '</span>';
}
function hideStatus(){ $("status").className = "status"; }

// ============================================
// CHAMA O WORKER
// ============================================
async function deviceManage(action, extra = {}) {
  const token = await auth.currentUser.getIdToken(true);
  const r = await fetch(WORKER + "/device/manage", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tokenid: token, action, ...extra })
  });
  return await r.json();
}

// ============================================
// INIT
// ============================================
auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.href = "/auth.html"; return; }
  try {
    await deviceManage("register");
    const listRes = await deviceManage("list");
    $("loading").classList.add("hidden");
    $("app").classList.remove("hidden");
    renderDispositivos(listRes.devices || [], listRes.current_device_key);
  } catch (e) {
    showStatus("Erro ao carregar: " + e.message, "err");
  }
});

// ============================================
// RENDER DISPOSITIVOS
// ============================================
function renderDispositivos(devices, meuDeviceKey) {
  if (!devices || devices.length === 0) {
    $("devicesList").innerHTML = '<div class="empty">Nenhum dispositivo registrado.</div>';
    return;
  }

  const html = devices.map(d => {
    const isCurrent = d.device_key === meuDeviceKey;
    const isBlocked = d.blocked;
    const cls = "device" + (isCurrent ? " current" : "") + (isBlocked ? " blocked" : "");

    let badge = isCurrent ? '<span class="badge badge-current">Este dispositivo</span>' : (isBlocked ? '<span class="badge badge-blocked">Bloqueado</span>' : '<span class="badge badge-active">Ativo</span>');

    const actionBtn = isCurrent ? '' : (isBlocked
        ? `<button class="btn btn-outline" data-action="unblock" data-key="${d.device_key}">Desbloquear</button>`
        : `<button class="btn btn-danger" data-action="block" data-key="${d.device_key}">Bloquear</button>`
      );

    return `
      <div class="${cls}">
        <div class="device-icon"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
        <div class="device-info">
          <h3>${d.device_name || 'Dispositivo'} ${badge}</h3>
          <p>IP: ${d.ip || '—'} • Último acesso: ${d.last_seen ? new Date(d.last_seen).toLocaleString("pt-BR") : "—"}</p>
        </div>
        <div class="device-actions">${actionBtn}</div>
      </div>
    `;
  }).join("");

  $("devicesList").innerHTML = html;
  $("devicesList").querySelectorAll("[data-action]").forEach(btn => {
    btn.onclick = () => executarAcaoDispositivo(btn.dataset.action, btn.dataset.key);
  });
}

// ============================================
// CRIAR CHAVE DE ACESSO (FORMS NA TELA)
// ============================================
$("btnAddBio").onclick = async () => {
  const deviceName = $("deviceNameInput").value.trim();
  const password = $("passwordInput").value;

  if (!deviceName) return showStatus("Dê um nome para o dispositivo.", "err");
  if (!password) return showStatus("A senha é obrigatória.", "err");

  try {
    showStatus("Solicitando biometria...", "info");
    if (!window.PublicKeyCredential) throw new Error("WebAuthn não suportado.");

    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);

    const credential = await navigator.credentials.create({
      publicKey: {
        challenge: challenge,
        rp: { name: "Kloewa" },
        user: { id: new Uint8Array(16), name: auth.currentUser.email, displayName: deviceName },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }],
        authenticatorSelection: { userVerification: "preferred" },
        timeout: 60000,
        attestation: "none"
      }
    });

    if (credential) {
      showStatus("Validando senha no servidor...", "info");
      const token = await auth.currentUser.getIdToken(true);

      const res = await fetch(WORKER + "/api/auth/register-bio", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          tokenid: token,
          webauthnId: credential.id,
          deviceName: deviceName,
          email: auth.currentUser.email,
          password: password
        })
      });

      const data = await res.json();
      if (data.ok) {
        showStatus("Chave de acesso criada com sucesso!", "ok");
        $("deviceNameInput").value = "";
        $("passwordInput").value = "";
        setTimeout(hideStatus, 3000);
      } else {
        throw new Error(data.erro);
      }
    }
  } catch (err) {
    showStatus("Erro: " + err.message, "err");
  }
};

// ============================================
// BLOQUEAR / DESBLOQUEAR (EXIGE BIOMETRIA)
// ============================================
async function executarAcaoDispositivo(action, deviceKey) {
  try {
    showStatus("Solicitando biometria...", "info");
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);

    const credential = await navigator.credentials.get({
      publicKey: {
        challenge: challenge,
        timeout: 60000,
        userVerification: "preferred"
      }
    });

    if (!credential) throw new Error("Biometria não confirmada.");

    showStatus(action === "block" ? "Bloqueando..." : "Desbloqueando...", "info");
    const token = await auth.currentUser.getIdToken(true);

    const r = await fetch(WORKER + "/device/manage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tokenid: token,
        action: action,
        device_key: deviceKey,
        webauthn_id: credential.id 
      })
    });

    const data = await r.json();
    if (data.ok) {
      showStatus(data.mensagem || "Sucesso!", "ok");
      const listRes = await deviceManage("list");
      renderDispositivos(listRes.devices || [], listRes.current_device_key);
      setTimeout(hideStatus, 3000);
    } else {
      throw new Error(data.erro);
    }
  } catch (err) {
    showStatus("Erro: " + err.message, "err");
  }
}

// ============================================
// LOGOUT
// ============================================
$("btnLogout").onclick = async () => {
  if (confirm("Sair da conta?")) {
    await auth.signOut();
    window.location.href = "/auth.html";
  }
};
</script>
</body>
</html>
