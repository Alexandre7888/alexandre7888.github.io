<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CodeHUB · Plataforma</title>
  <link rel="icon" type="image/png" href="https://alexandre7888.github.io/CodeHUB/InShot_20250807_112151490.jpg">
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X4VF1LWB0F"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-X4VF1LWB0F')</script>
  <script src="https://alexandre7888.github.io/protecao.js"></script>
  <script src="https://alexandre7888.github.io/Botao/floating-menu.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg-start:#0b1120;--bg-end:#03060c;--canvas-bg:#11161f;--border:#2a3a4a;--text:#e2e9f0;--text2:#a0b3c9;--gold:#e6b422;--white-bg:#f5f7fc;--white-text:#1e293b;--toggle-bg:#1e2a3a;--toggle-border:#3e5a77;--shadow:rgba(0,0,0,0.5)}
    body.light{--bg-start:#e2e8f0;--bg-end:#cbd5e1;--canvas-bg:#f0f4fa;--border:#9aaebf;--text:#0f172a;--text2:#2c3e4e;--gold:#b45309;--white-bg:#fff;--white-text:#0f172a;--toggle-bg:#dce5f0;--toggle-border:#8ba0bc;--shadow:rgba(0,0,0,0.1)}
    body{background:radial-gradient(circle at 30% 20%,var(--bg-start),var(--bg-end));font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
    .content-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;margin-top:70px}
    .mini-clock{position:fixed;top:18px;right:20px;z-index:1100;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);border-radius:60px;padding:6px;box-shadow:0 6px 16px var(--shadow);border:1px solid var(--border)}
    .mini-clock canvas{display:block;width:70px;height:70px;border-radius:50%;background:var(--canvas-bg)}
    .theme-panel{position:fixed;bottom:24px;right:24px;z-index:1050;background:rgba(10,15,26,0.75);backdrop-filter:blur(12px);border-radius:48px;padding:6px 12px;display:flex;gap:8px;border:1px solid var(--border);box-shadow:0 8px 20px var(--shadow)}
    .theme-btn{background:var(--toggle-bg);border:none;border-radius:40px;padding:8px 16px;font-size:0.8rem;font-weight:600;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:6px;border:1px solid var(--toggle-border);transition:0.2s}
    .theme-btn.active{background:var(--gold);color:#0a0f14;box-shadow:0 0 8px rgba(230,180,34,0.4)}
    .white-area{width:100%;max-width:700px;margin:20px auto;background:var(--white-bg);border-radius:32px;padding:28px 24px;box-shadow:0 20px 35px -10px var(--shadow);text-align:center}
    .white-area h3{color:var(--white-text);font-size:1.4rem;margin-bottom:12px}
    .white-area p{color:var(--white-text);opacity:0.75}
    .white-placeholder{background:rgba(0,0,0,0.03);border-radius:24px;padding:24px;margin-top:16px;color:var(--white-text)}
    .welcome{color:var(--text);font-size:1.2rem;background:rgba(10,15,26,0.75);backdrop-filter:blur(8px);padding:15px 30px;border-radius:60px;border:1px solid var(--border);font-weight:500}
    @media(max-width:550px){.theme-btn{font-size:0.7rem;padding:6px 10px}.mini-clock canvas{width:55px!important;height:55px!important}}
  </style>
</head>
<body class="dark">

  <div id="app-menu-root"></div>
  <div class="mini-clock"><canvas id="miniCanvas" width="200" height="200"></canvas></div>

  <div class="theme-panel">
    <button id="themeDark" class="theme-btn active">🌙 Dark</button>
    <button id="themeLight" class="theme-btn">☀️ Light</button>
    <button id="themeSystem" class="theme-btn">🖥️ Sistema</button>
  </div>

  <div class="content-wrap">
    <div class="welcome" id="welcomeMsg">✨ Bem-vindo ao CodeHUB ✨</div>
    <div class="white-area">
      <h3>🚀 Plataforma CodeHUB</h3>
      <p>Use o menu 4x4 no canto superior esquerdo</p>
      <div class="white-placeholder">📱 Menu 4x4<br>👤 Contas via Firebase<br>☁️ Dados sempre sincronizados</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:7cc5bde34f4c5a5ce41b32"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const MAX_ACCOUNTS = 5;
    const apps = [
      { id:'editor', name:'Editor', icon:'📝', url:'editor.html' },
      { id:'clock', name:'Relógio', icon:'🕐', url:'clock.html' },
      { id:'compass', name:'Bússola', icon:'🧭', url:'compass.html' },
      { id:'notes', name:'Notas', icon:'📋', url:'notes.html' },
      { id:'calc', name:'Calc', icon:'🔢', url:'calc.html' },
      { id:'weather', name:'Clima', icon:'🌤️', url:'weather.html' },
      { id:'tasks', name:'Tarefas', icon:'✅', url:'tasks.html' },
      { id:'chat', name:'Chat', icon:'💬', url:'chat.html' },
      { id:'files', name:'Arquivos', icon:'📁', url:'files.html' },
      { id:'profile', name:'Perfil', icon:'👤', url:'profile.html' },
      { id:'help', name:'Ajuda', icon:'❓', url:'help.html' },
      { id:'settings', name:'Config', icon:'⚙️', url:'settings.html' },
    ];

    // ==================== ESTADO (TUDO DO FIREBASE) ====================
    let state = {
      masterKey: null,
      isAuth: false,
      userData: null,
      userKey: null,
      accounts: [],
      showMenu: false,
      showPanel: false
    };

    function getAvatarColor(name) {
      const colors = ['#4361ee','#f72585','#4cc9f0','#7209b7','#f8961e','#43aa8b','#e63946','#277da1'];
      let hash = 0;
      for (let i = 0; i < (name||'?').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    // ==================== FIREBASE: CARREGAR CONTAS ====================
    async function loadAccountsFromFirebase() {
      if (!state.masterKey) return;
      try {
        const snap = await get(ref(database, `contas/${state.masterKey}`));
        state.accounts = snap.exists() ? Object.values(snap.val()) : [];
      } catch(e) {
        state.accounts = [];
      }
    }

    // ==================== FIREBASE: CARREGAR USUÁRIO ====================
    async function loadUserData(key) {
      try {
        const snap = await get(ref(database, `userKeysData/${key}`));
        if (snap.exists()) {
          const data = snap.val();
          state.userData = data.authTokenDecoded || data;
          state.isAuth = true;
          state.userKey = key;
          
          // Se tem masterKey no userData, usar
          const mk = state.userData.masterKey || data.masterKey;
          if (mk) {
            state.masterKey = mk;
            localStorage.setItem('codehub_masterKey', mk);
            await loadAccountsFromFirebase();
          }
        }
      } catch(e) { console.error(e); }
    }

    // ==================== FIREBASE: REMOVER CONTA ====================
    async function removeAccount(uid) {
      if (!state.masterKey) return;
      if (!confirm('Remover esta conta? (Afeta todos os dispositivos)')) return;
      try {
        const snap = await get(ref(database, `contas/${state.masterKey}`));
        if (snap.exists()) {
          const contas = snap.val();
          delete contas[uid];
          await set(ref(database, `contas/${state.masterKey}`), contas);
          state.accounts = Object.values(contas);
        }
        if (state.userData?.uid === uid) {
          localStorage.removeItem('current_userKey');
          state.isAuth = false;
          state.userData = null;
          state.userKey = null;
        }
        renderAll();
      } catch(e) { console.error(e); }
    }

    function openApp(url) {
      const key = state.userKey;
      const sep = url.includes('?') ? '&' : '?';
      window.location.href = key ? `${url}${sep}userKey=${key}` : url;
    }

    async function switchAccount(acc) {
      if (acc.userKey) {
        localStorage.setItem('current_userKey', acc.userKey);
        state.userKey = acc.userKey;
        await loadUserData(acc.userKey);
        state.showPanel = false;
        renderAll();
      }
    }

    function handleLogout() {
      if (!confirm('Sair?')) return;
      localStorage.removeItem('current_userKey');
      state.isAuth = false;
      state.userData = null;
      state.userKey = null;
      state.showPanel = false;
      renderAll();
    }

    async function handleOpenPanel() {
      if (state.masterKey) await loadAccountsFromFirebase();
      state.showPanel = true;
      renderAll();
    }

    // ==================== RENDER ====================
    function renderAll() {
      const root = document.getElementById('app-menu-root');
      const name = state.userData?.username || state.userData?.email || '?';
      const letter = name.charAt(0).toUpperCase();
      const avatarColor = getAvatarColor(name);

      document.getElementById('welcomeMsg').textContent = state.isAuth ? `✨ Bem-vindo, ${name}! ✨` : '✨ Bem-vindo ao CodeHUB ✨';

      root.innerHTML = `
        <div style="position:fixed;top:20px;left:20px;z-index:10000">
          <div id="menuBtn" style="width:48px;height:48px;background:rgba(20,25,45,0.9);backdrop-filter:blur(10px);border-radius:12px;cursor:pointer;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:3px;padding:8px;border:1px solid rgba(67,97,238,0.3);box-shadow:0 8px 20px rgba(0,0,0,0.4);transition:0.3s" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
            ${[...Array(16)].map(()=>'<div style="width:100%;height:100%;background:rgba(67,97,238,0.8);border-radius:50%"></div>').join('')}
          </div>
        </div>

        <div style="position:fixed;top:20px;right:90px;z-index:10000">
          <div id="avatarBtn" style="width:48px;height:48px;border-radius:50%;background:${state.isAuth?avatarColor:'#6c757d'};cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;border:2px solid rgba(255,255,255,0.3);box-shadow:0 8px 20px rgba(0,0,0,0.4);transition:0.3s;position:relative" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
            ${state.isAuth ? letter : '👤'}
            ${state.isAuth ? '<div style="position:absolute;bottom:2px;right:2px;width:12px;height:12px;background:#4cc9f0;border-radius:50%;border:2px solid rgba(20,25,45,0.9)"></div>' : ''}
          </div>
        </div>

        <div id="appsOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:none;justify-content:center;align-items:center;backdrop-filter:blur(5px)">
          <div style="background:rgba(20,25,45,0.95);border-radius:20px;padding:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px;max-width:500px;width:90%;border:1px solid rgba(67,97,238,0.3);box-shadow:0 20px 40px rgba(0,0,0,0.5)">
            ${apps.map(app=>`
              <div class="app-item" data-url="${app.url}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;background:rgba(255,255,255,0.05);border-radius:12px;cursor:pointer;min-height:80px;transition:0.3s" onmouseover="this.style.background='rgba(67,97,238,0.2)';this.style.transform='translateY(-3px)'" onmouseout="this.style.background='rgba(255,255,255,0.05)';this.style.transform='translateY(0)'">
                <div style="font-size:28px;margin-bottom:8px">${app.icon}</div>
                <div style="color:#fff;font-size:12px;font-weight:500">${app.name}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <div id="accountPanel" style="position:fixed;top:0;right:0;width:340px;height:100%;background:rgba(20,25,45,0.98);backdrop-filter:blur(20px);z-index:10001;box-shadow:-10px 0 30px rgba(0,0,0,0.5);border-left:1px solid rgba(67,97,238,0.3);overflow-y:auto;padding:20px;transform:translateX(${state.showPanel?'0':'100%'});transition:transform 0.3s">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,0.1)">
            <div style="color:#fff;font-size:18px;font-weight:600">👤 Contas ☁️</div>
            <button id="closePanel" style="background:rgba(255,255,255,0.1);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px">✕</button>
          </div>

          <button id="refreshBtn" style="width:100%;padding:8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:15px;display:flex;align-items:center;justify-content:center;gap:6px;color:#4cc9f0;background:rgba(76,201,240,0.1);border:1px solid rgba(76,201,240,0.3)">🔄 Atualizar do Firebase</button>

          ${state.isAuth && state.userData ? `
            <div style="background:rgba(67,97,238,0.2);border-radius:10px;padding:12px;margin-bottom:15px;color:#fff;text-align:center">
              <div style="font-weight:600">✅ ${state.userData.username||state.userData.email}</div>
            </div>
          ` : ''}

          <div style="color:#fff;font-size:13px;font-weight:600;margin-bottom:10px">📋 Contas (${state.accounts.length}/${MAX_ACCOUNTS})</div>

          ${state.accounts.length===0 ? '<div style="color:#a0b3c9;text-align:center;padding:30px"><div style="font-size:40px;margin-bottom:10px">☁️</div><div>Nenhuma conta</div></div>' : state.accounts.map(acc=>`
            <div class="account-card" data-uid="${acc.uid}" style="background:${state.userData?.uid===acc.uid?'rgba(67,97,238,0.3)':'rgba(255,255,255,0.05)'};border-radius:12px;padding:15px;margin-bottom:10px;cursor:pointer;border:${state.userData?.uid===acc.uid?'1px solid rgba(67,97,238,0.6)':'1px solid transparent'};display:flex;align-items:center;gap:12px;transition:0.3s">
              <div style="width:42px;height:42px;border-radius:50%;background:${getAvatarColor(acc.username||acc.email||'?')};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;flex-shrink:0">${(acc.username||acc.email||'?').charAt(0).toUpperCase()}</div>
              <div style="flex:1;min-width:0">
                <div style="color:#fff;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${acc.username||acc.email} ${state.userData?.uid===acc.uid?'✓':''}</div>
                <div style="color:#a0b3c9;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${acc.email}</div>
              </div>
              <div style="font-size:18px;flex-shrink:0">${acc.userType==='entrepreneur'?'🏢':'👤'}</div>
              <button class="remove-account" data-uid="${acc.uid}" style="background:rgba(247,37,133,0.2);color:#f72585;border:1px solid rgba(247,37,133,0.3);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;flex-shrink:0">✕</button>
            </div>
          `).join('')}

          ${state.accounts.length<MAX_ACCOUNTS ? `<button id="addAccountBtn" style="width:100%;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;color:#4cc9f0;background:rgba(76,201,240,0.2);border:1px solid rgba(76,201,240,0.4)">➕ Adicionar Conta</button>` : ''}
          ${state.isAuth ? `<button id="logoutBtn" style="width:100%;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;color:#f72585;background:rgba(247,37,133,0.2);border:1px solid rgba(247,37,133,0.4)">🚪 Sair</button>` : ''}

          <div style="color:#a0b3c9;font-size:11px;text-align:center;margin-top:15px;background:rgba(0,0,0,0.2);padding:10px;border-radius:8px">
            ☁️ Firebase: ${state.accounts.length}/${MAX_ACCOUNTS}
            ${state.masterKey ? `<br>🔑 ${state.masterKey.substring(0,20)}...` : '<br>❌ Sem MasterKey'}
          </div>
        </div>
      `;

      // Eventos
      document.getElementById('menuBtn')?.addEventListener('click', ()=>{
        document.getElementById('appsOverlay').style.display = 'flex';
      });
      document.getElementById('appsOverlay')?.addEventListener('click', function(e){
        if(e.target===this) this.style.display = 'none';
      });
      document.querySelectorAll('.app-item').forEach(item=>{
        item.addEventListener('click', function(){
          document.getElementById('appsOverlay').style.display = 'none';
          openApp(this.getAttribute('data-url'));
        });
      });
      document.getElementById('avatarBtn')?.addEventListener('click', handleOpenPanel);
      document.getElementById('closePanel')?.addEventListener('click', ()=>{
        state.showPanel = false;
        renderAll();
      });
      document.getElementById('refreshBtn')?.addEventListener('click', async ()=>{
        if(state.masterKey) {
          await loadAccountsFromFirebase();
          renderAll();
        }
      });
      document.querySelectorAll('.account-card').forEach(card=>{
        card.addEventListener('click', function(e){
          if(e.target.classList.contains('remove-account')) return;
          const acc = state.accounts.find(a=>a.uid===this.getAttribute('data-uid'));
          if(acc) switchAccount(acc);
        });
      });
      document.querySelectorAll('.remove-account').forEach(btn=>{
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          removeAccount(this.getAttribute('data-uid'));
        });
      });
      document.getElementById('addAccountBtn')?.addEventListener('click', ()=>window.location.href='auth.html');
      document.getElementById('logoutBtn')?.addEventListener('click', handleLogout);
    }

    // ==================== INICIAR ====================
    async function init() {
      // SÓ pega masterKey do localStorage
      state.masterKey = localStorage.getItem('codehub_masterKey');
      
      const urlKey = new URLSearchParams(window.location.search).get('userKey');
      const localKey = localStorage.getItem('current_userKey');
      const key = urlKey || localKey;
      
      if (state.masterKey) {
        await loadAccountsFromFirebase();
      }
      
      if (key) {
        state.userKey = key;
        await loadUserData(key);
      }
      
      renderAll();
    }

    init();
  </script>

  <script>
    const body=document.body;
    function setTheme(t){
      if(t==='dark'){body.classList.add('dark');body.classList.remove('light')}
      else if(t==='light'){body.classList.add('light');body.classList.remove('dark')}
      else{const d=window.matchMedia('(prefers-color-scheme:dark)').matches;body.classList.toggle('dark',d);body.classList.toggle('light',!d)}
      if(t!=='system')localStorage.setItem('codehub-theme',t);else localStorage.setItem('codehub-theme','system');
      document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('theme'+t.charAt(0).toUpperCase()+t.slice(1))?.classList.add('active');
    }
    const st=localStorage.getItem('codehub-theme')||'dark';setTheme(st);
    document.getElementById('themeDark').onclick=()=>setTheme('dark');
    document.getElementById('themeLight').onclick=()=>setTheme('light');
    document.getElementById('themeSystem').onclick=()=>setTheme('system');

    const c=document.getElementById('miniCanvas'),ctx=c.getContext('2d');
    function draw(){
      c.width=200;c.height=200;
      const cx=100,cy=100,r=88;
      ctx.fillStyle=getComputedStyle(body).getPropertyValue('--canvas-bg').trim()||'#11161f';
      ctx.beginPath();ctx.arc(cx,cy,r+3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx,cy,r+1,0,Math.PI*2);ctx.strokeStyle='#5a7a9a';ctx.lineWidth=1.5;ctx.stroke();
      for(let i=0;i<12;i++){
        let a=i*Math.PI*2/12-Math.PI/2;
        ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(r-10),cy+Math.sin(a)*(r-10));ctx.lineTo(cx+Math.cos(a)*(r-2),cy+Math.sin(a)*(r-2));
        ctx.lineWidth=i%3===0?2.2:1.2;ctx.strokeStyle=i%3===0?'#f0c674':'#8a9bb0';ctx.stroke();
      }
      const n=new Date();
      const ha=(n.getHours()%12*30+n.getMinutes()*0.5)*Math.PI/180-Math.PI/2;
      const ma=(n.getMinutes()*6+n.getSeconds()*0.1)*Math.PI/180-Math.PI/2;
      const sa=(n.getSeconds()*6)*Math.PI/180-Math.PI/2;
      [[ha,r*0.48,3,'#d9e2f0'],[ma,r*0.68,2.2,'#bdd4ff'],[sa,r*0.78,1.5,'#ffaa66']].forEach(([a,l,w,s])=>{
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*l,cy+Math.sin(a)*l);
        ctx.lineWidth=w;ctx.lineCap='round';ctx.strokeStyle=s;ctx.stroke();
      });
      ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fillStyle='#332211';ctx.fill();
      ctx.beginPath();ctx.arc(cx,cy,2,0,Math.PI*2);ctx.fillStyle='#f5c17a';ctx.fill();
    }
    setInterval(draw,1000);draw();
  </script>
</body>
</html>
