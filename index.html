<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CodeHUB · Plataforma</title>
  <link rel="icon" type="image/png" href="/InShot_20250807_112151490.jpg">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X4VF1LWB0F"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-X4VF1LWB0F')</script>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({ appId: "5475922c-e999-4b42-b743-c7cde90db378", allowLocalhostAsSecureOrigin: true });
      window.__OneSignal = OneSignal;
    });
  </script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root, html[data-theme="dark"]{--bg-1:#0a0e1a;--bg-2:#05070f;--surface:#101626;--surface-2:#151c30;--border:#1f2a44;--text:#e8eef8;--text-2:#8fa0bd;--accent:#4f8cff;--accent-2:#7aa8ff;--shadow:rgba(0,0,0,0.55);--menu-bg:rgba(10,15,28,0.9);}
    html[data-theme="light"]{--bg-1:#f7f9fc;--bg-2:#eef2f8;--surface:#ffffff;--surface-2:#f5f8fd;--border:#e2e8f2;--text:#0f172a;--text-2:#5b6b85;--accent:#2563eb;--accent-2:#3b82f6;--shadow:rgba(15,23,42,0.08);--menu-bg:rgba(255,255,255,0.92);}
    body{background:radial-gradient(circle at 30% 20%,var(--bg-1),var(--bg-2));font-family:'Segoe UI',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
    
    .profile-btn{position:fixed;top:14px;right:16px;z-index:1100;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;cursor:pointer;overflow:hidden;box-shadow:0 8px 22px var(--shadow);}
    .profile-btn img{width:100%;height:100%;object-fit:cover;}
    .content-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;margin-top:90px;}
    
    .feed-container{width:100%;max-width:600px;display:flex;flex-direction:column;gap:16px;}
    .create-post{background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 8px 24px var(--shadow);border:1px solid var(--border);}
    .create-post textarea{width:100%;border:none;resize:none;outline:none;font-size:15px;background:transparent;color:var(--text);min-height:60px;font-family:inherit;}
    .create-post .actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
    .btn-post{background:var(--accent);color:white;border:none;padding:8px 24px;border-radius:20px;font-weight:600;cursor:pointer;}
    .btn-post:disabled{background:var(--surface-2);color:var(--text-2);cursor:not-allowed;}

    .post{background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 8px 24px var(--shadow);border:1px solid var(--border);}
    .post-header{display:flex;align-items:center;margin-bottom:12px;}
    .post-avatar{width:42px;height:42px;border-radius:50%;background:var(--surface-2);margin-right:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;}
    .post-content{font-size:15px;line-height:1.5;white-space:pre-wrap;}
    .post-image{width:100%;border-radius:12px;margin-top:12px;max-height:500px;object-fit:cover;}
    
    .post-actions{display:flex;gap:16px;margin-top:16px;color:var(--text-2);font-size:14px;align-items:center;}
    .action-btn{display:flex;align-items:center;gap:6px;cursor:pointer;transition:color 0.2s;background:none;border:none;color:inherit;font-family:inherit;font-size:14px;padding:0;}
    .action-btn:hover{color:var(--accent);}
    .action-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .action-btn.liked svg{fill:#ff4b4b;stroke:#ff4b4b;}

    .comments-section{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;display:none;}
    .comment-item{font-size:13px;margin-bottom:8px;background:var(--surface-2);padding:8px 12px;border-radius:8px;}
    .input-comment{width:100%;background:var(--bg-1);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;margin-top:8px;}
  </style>
</head>
<body>

  <div class="profile-btn" id="profileBtn">U</div>

  <div class="content-wrap">
    <div class="feed-container">
      <div class="create-post" id="createPostBox" style="display:none;">
        <textarea id="postText" placeholder="O que está acontecendo?"></textarea>
        <input type="file" id="postFile" accept="image/*" style="margin-top: 10px; font-size: 12px;">
        <div class="actions">
          <span id="statusPost" style="font-size: 12px; color: var(--text-2);"></span>
          <button class="btn-post" id="btnPost" disabled>Publicar</button>
        </div>
      </div>
      <div id="feed"></div>
    </div>
  </div>

  <script>
    window.WORKER_URL = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, query, limitToLast, onChildAdded } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    const cfg = { apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo", authDomain: "html-15e80.firebaseapp.com", databaseURL: "https://html-15e80-default-rtdb.firebaseio.com", projectId: "html-15e80", storageBucket: "html-15e80.firebasestorage.app", messagingSenderId: "1068148640439", appId: "1:1068148640439:web:1ac651348e624f6be41b32" };
    const app = initializeApp(cfg);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentToken = null;
    let userUid = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        userUid = user.uid;
        currentToken = await user.getIdToken();
        document.getElementById('createPostBox').style.display = 'block';
        document.getElementById('profileBtn').innerText = user.displayName ? user.displayName.charAt(0).toUpperCase() : 'U';
        carregarFeed();
      } else {
        document.getElementById('createPostBox').style.display = 'none';
      }
    });

    function carregarFeed() {
      const feedQuery = query(ref(db, 'posts'), limitToLast(20));
      onChildAdded(feedQuery, (snapshot) => {
        renderPost(snapshot.val());
      });
    }

    function renderPost(post) {
      if (document.getElementById(`post-${post.id}`)) return;
      
      const postEl = document.createElement('div');
      postEl.className = 'post';
      postEl.id = `post-${post.id}`;

      const imgSrc = post.mediaUrl && currentToken ? `${post.mediaUrl}?tokenid=${encodeURIComponent(currentToken)}` : null;

      // SVGs
      const svgHeart = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
      const svgComment = `<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>`;

      postEl.innerHTML = `
        <div class="post-header">
          <div class="post-avatar">${post.uid.charAt(0).toUpperCase()}</div>
          <div style="font-weight: bold;">${post.uid}</div>
        </div>
        <div class="post-content">${post.text}</div>
        ${imgSrc ? `<img src="${imgSrc}" class="post-image">` : ''}
        
        <div class="post-actions">
          <button class="action-btn" id="btn-like-${post.id}" onclick="curtir('${post.id}')">
            ${svgHeart} <span id="likes-${post.id}">${post.likesCount || 0}</span>
          </button>
          <button class="action-btn" onclick="toggleComments('${post.id}')">
            ${svgComment} <span id="comments-count-${post.id}">0</span>
          </button>
        </div>

        <div class="comments-section" id="comments-${post.id}">
          <div id="comments-list-${post.id}"></div>
          <div style="display: flex; gap: 8px; margin-top: 8px;">
            <input type="text" class="input-comment" id="input-comment-${post.id}" placeholder="Escreva um comentário..." onkeypress="if(event.key === 'Enter') comentar('${post.id}')">
            <button class="btn-post" id="btn-comment-${post.id}" onclick="comentar('${post.id}')">Enviar</button>
          </div>
          <p id="error-comment-${post.id}" style="color:#ff4b4b; font-size:12px; margin-top:4px; display:none;"></p>
        </div>
      `;
      document.getElementById('feed').prepend(postEl);
    }

    window.curtir = async function(postId) {
      if (!currentToken) return;
      const btn = document.getElementById(`btn-like-${postId}`);
      btn.disabled = true;
      
      try {
        const res = await fetch(WORKER_URL + '/api/social/like', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, postId: postId })
        });
        const data = await res.json();
        if (data.ok) {
          document.getElementById(`likes-${postId}`).textContent = data.total;
          if (data.curtido) btn.classList.add('liked');
          else btn.classList.remove('liked');
        }
      } catch (e) {}
      btn.disabled = false;
    };

    window.toggleComments = function(postId) {
      const el = document.getElementById(`comments-${postId}`);
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    };

    window.comentar = async function(postId) {
      const input = document.getElementById(`input-comment-${postId}`);
      const btn = document.getElementById(`btn-comment-${postId}`);
      const errorEl = document.getElementById(`error-comment-${postId}`);
      const text = input.value.trim();
      
      if (!text || !currentToken) return;

      btn.disabled = true;
      btn.textContent = '...';
      errorEl.style.display = 'none';

      try {
        const res = await fetch(WORKER_URL + '/api/social/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, postId: postId, text: text })
        });
        const data = await res.json();
        
        if (data.ok) {
          input.value = '';
          document.getElementById(`comments-count-${postId}`).textContent = data.total;
          const list = document.getElementById(`comments-list-${postId}`);
          const div = document.createElement('div');
          div.className = 'comment-item';
          div.textContent = text;
          list.appendChild(div);
        } else {
          errorEl.textContent = data.erro || "Erro ao comentar.";
          errorEl.style.display = 'block';
        }
      } catch (e) {
        errorEl.textContent = "Erro de conexão.";
        errorEl.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Enviar';
    };
  </script>
</body>
</html>
