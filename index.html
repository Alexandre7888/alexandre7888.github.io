      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",

      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:7cc5bde34f4c5a5ce41b32",
      measurementId: "G-V57KRZ02HJ"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // ==================== VARIÁVEIS ====================
    const MAX_ACCOUNTS = 5;
    let currentUserKey = null;
    let currentUserData = null;
    let isAuthenticated = false;
    let accounts = [];

    // Apps do menu
    const apps = [
      { id: 'editor', name: 'Editor', icon: '📝', url: 'editor.html' },
      { id: 'clock', name: 'Relógio', icon: '🕐', url: 'clock.html' },
      { id: 'compass', name: 'Bússola', icon: '🧭', url: 'compass.html' },
      { id: 'notes', name: 'Notas', icon: '📋', url: 'notes.html' },
      { id: 'calc', name: 'Calc', icon: '🔢', url: 'calc.html' },
      { id: 'weather', name: 'Clima', icon: '🌤️', url: 'weather.html' },
      { id: 'tasks', name: 'Tarefas', icon: '✅', url: 'tasks.html' },
      { id: 'chat', name: 'Chat', icon: '💬', url: 'chat.html' },
      { id: 'files', name: 'Arquivos', icon: '📁', url: 'files.html' },
      { id: 'settings', name: 'Config', icon: '⚙️', url: 'settings.html' },
      { id: 'profile', name: 'Perfil', icon: '👤', url: 'profile.html' },
      { id: 'help', name: 'Ajuda', icon: '❓', url: 'help.html' },
    ];

    // ==================== INICIALIZAÇÃO ====================
    async function init() {
      // Pegar userKey da URL
      const urlParams = new URLSearchParams(window.location.search);
      const urlUserKey = urlParams.get('userKey');
      
      // Pegar do localStorage
      const localUserKey = localStorage.getItem('current_userKey');
      
      currentUserKey = urlUserKey || localUserKey;
      
      if (currentUserKey) {
        await loadUserData(currentUserKey);
      }
      
      loadAccounts();
      buildAppsGrid();
      updateUI();
    }

    async function loadUserData(key) {
      try {
        const snapshot = await get(ref(database, `userKeysData/${key}`));
        
        if (snapshot.exists()) {
          const data = snapshot.val();
          currentUserData = data.authTokenDecoded || data;
          isAuthenticated = true;
          
          localStorage.setItem('current_userKey', key);
          if (data.authToken) {
            localStorage.setItem('auth_token', data.authToken);
          }
          if (currentUserData.uid) {
            localStorage.setItem('token_user_id', currentUserData.uid);
          }
          
          console.log('✅ Autenticado:', currentUserData.username || currentUserData.email);
        } else {
          console.log('⚠️ UserKey não encontrada');
          isAuthenticated = false;
        }
      } catch (error) {
        console.error('Erro ao carregar:', error);
        isAuthenticated = false;
      }
    }

    function loadAccounts() {
      accounts = JSON.parse(localStorage.getItem('codehub_deviceAccounts') || '[]');
      document.getElementById('accountCountText').textContent = `${accounts.length}/${MAX_ACCOUNTS} contas neste dispositivo`;
    }

    function buildAppsGrid() {
      const grid = document.getElementById('appsGrid');
      grid.innerHTML = '';
      
      apps.forEach(app => {
        const item = document.createElement('div');
        item.className = 'app-item';
        item.innerHTML = `
          <div class="app-icon">${app.icon}</div>
          <div class="app-name">${app.name}</div>
        `;
        item.onclick = () => {
          closeAppsMenu();
          openApp(app.url);
        };
        grid.appendChild(item);
      });
    }

    function openApp(url) {
      const key = currentUserKey || localStorage.getItem('current_userKey');
      if (key) {
        const separator = url.includes('?') ? '&' : '?';
        window.location.href = `${url}${separator}userKey=${key}`;
      } else {
        window.location.href = url;
      }
    }

    function updateUI() {
      const avatar = document.getElementById('userAvatar');
      const avatarLetter = document.getElementById('avatarLetter');
      const btnLogin = document.getElementById('btnLoginHeader');
      const welcomeMsg = document.getElementById('welcomeMessage');
      const statusText = document.getElementById('statusText');
      const addBtn = document.getElementById('btnAddAccount');
      
      if (isAuthenticated && currentUserData) {
        // Mostrar avatar, esconder botão de login
        avatar.style.display = 'flex';
        btnLogin.style.display = 'none';
        
        // Cor do avatar
        const name = currentUserData.username || currentUserData.email || 'User';
        const colors = ['#4361ee', '#f72585', '#4cc9f0', '#7209b7', '#f8961e', '#43aa8b', '#e63946', '#277da1'];
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
          hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        avatar.style.background = colors[Math.abs(hash) % colors.length];
        avatarLetter.textContent = name.charAt(0).toUpperCase();
        
        welcomeMsg.innerHTML = `✨ Bem-vindo, ${name}! ✨`;
        statusText.textContent = '✅ Autenticado';
        
        // Mostrar/ocultar botão adicionar
        if (accounts.length >= MAX_ACCOUNTS) {
          addBtn.style.display = 'none';
        } else {
          addBtn.style.display = 'flex';
        }
      } else {
        // Mostrar botão de login, esconder avatar
        avatar.style.display = 'none';
        btnLogin.style.display = 'block';
        welcomeMsg.innerHTML = '✨ Bem-vindo ao CodeHUB ✨';
        statusText.textContent = '🔐 Faça login para acessar todos os recursos';
        addBtn.style.display = 'none';
      }
      
      // Atualizar lista de contas no painel
      buildAccountsList();
      loadAccounts();
    }

    function buildAccountsList() {
      const list = document.getElementById('accountsList');
      list.innerHTML = '';
      
      if (accounts.length === 0) {
        list.innerHTML = '<div style="color: #a0b3c9; text-align: center; padding: 20px;">Nenhuma conta salva</div>';
        return;
      }
      
      accounts.forEach(account => {
        const colors = ['#4361ee', '#f72585', '#4cc9f0', '#7209b7', '#f8961e', '#43aa8b', '#e63946', '#277da1'];
        const name = account.username || account.email || '?';
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
          hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const color = colors[Math.abs(hash) % colors.length];
        
        const card = document.createElement('div');
        card.className = `account-card ${currentUserData?.uid === account.uid ? 'active' : ''}`;
        card.innerHTML = `
          <div class="account-avatar-small" style="background: ${color};">${name.charAt(0).toUpperCase()}</div>
          <div class="account-info-details">
            <div class="account-name-small">${account.username || account.email}</div>
            <div class="account-email-small">${account.email}</div>
          </div>
          <button class="btn-remove-account" data-uid="${account.uid}">✕</button>
        `;
        
        card.onclick = (e) => {
          if (!e.target.classList.contains('btn-remove-account')) {
            switchAccount(account);
          }
        };
        
        list.appendChild(card);
      });
      
      // Eventos dos botões de remover
      document.querySelectorAll('.btn-remove-account').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const uid = btn.getAttribute('data-uid');
          removeAccount(uid);
        });
      });
    }

    async function switchAccount(account) {
      if (account.userKey) {
        localStorage.setItem('current_userKey', account.userKey);
        localStorage.setItem('auth_token', account.authToken || '');
        localStorage.setItem('token_user_id', account.uid);
        
        currentUserKey = account.userKey;
        await loadUserData(account.userKey);
        updateUI();
        closeAccountPanel();
      }
    }

    function removeAccount(uid) {
      if (confirm('Remover esta conta do dispositivo?')) {
        accounts = accounts.filter(acc => acc.uid !== uid);
        localStorage.setItem('codehub_deviceAccounts', JSON.stringify(accounts));
        
        if (currentUserData?.uid === uid) {
          // Logout se removeu a conta atual
          localStorage.removeItem('auth_token');
          localStorage.removeItem('token_user_id');
          localStorage.removeItem('current_userKey');
          isAuthenticated = false;
          currentUserData = null;
          currentUserKey = null;
        }
        
        loadAccounts();
        updateUI();
      }
    }

    function handleLogout() {
      if (confirm('Tem certeza que deseja sair?')) {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('token_user_id');
        localStorage.removeItem('current_userKey');
        isAuthenticated = false;
        currentUserData = null;
        currentUserKey = null;
        updateUI();
        closeAccountPanel();
      }
    }

    // ==================== EVENTOS ====================
    // Menu de apps
    document.getElementById('menuGridButton').addEventListener('click', () => {
      document.getElementById('appsOverlay').classList.add('active');
    });

    document.getElementById('appsOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        closeAppsMenu();
      }
    });

    function closeAppsMenu() {
      document.getElementById('appsOverlay').classList.remove('active');
    }

    // Avatar - abrir painel de contas
    document.getElementById('userAvatar').addEventListener('click', () => {
      document.getElementById('accountPanel').classList.add('active');
    });

    // Fechar painel
    document.getElementById('panelClose').addEventListener('click', closeAccountPanel);

    function closeAccountPanel() {
      document.getElementById('accountPanel').classList.remove('active');
    }

    // Logout
    document.getElementById('btnLogout').addEventListener('click', handleLogout);

    // ==================== TEMA ====================
    const body = document.body;
    
    function setTheme(theme) {
      if (theme === 'dark') {
        body.classList.add('dark');
        body.classList.remove('light');
        localStorage.setItem('codehub-theme', 'dark');
        updateThemeButtons('dark');
      } else if (theme === 'light') {
        body.classList.add('light');
        body.classList.remove('dark');
        localStorage.setItem('codehub-theme', 'light');
        updateThemeButtons('light');
      } else if (theme === 'system') {
        localStorage.setItem('codehub-theme', 'system');
        applySystemTheme();
        updateThemeButtons('system');
      }
    }

    function applySystemTheme() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      body.classList.toggle('dark', isDark);
      body.classList.toggle('light', !isDark);
    }

    function updateThemeButtons(active) {
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`theme${active.charAt(0).toUpperCase() + active.slice(1)}`)?.classList.add('active');
    }

    const savedTheme = localStorage.getItem('codehub-theme');
    if (savedTheme === 'dark') setTheme('dark');
    else if (savedTheme === 'light') setTheme('light');
    else if (savedTheme === 'system') setTheme('system');
    else setTheme('dark');

    document.getElementById('themeDark')?.addEventListener('click', () => setTheme('dark'));
    document.getElementById('themeLight')?.addEventListener('click', () => setTheme('light'));
    document.getElementById('themeSystem')?.addEventListener('click', () => setTheme('system'));

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (localStorage.getItem('codehub-theme') === 'system') applySystemTheme();
    });

    // ==================== RELÓGIO ====================
    const miniCanvas = document.getElementById('miniCanvas');
    const miniCtx = miniCanvas.getContext('2d');
    
    function drawMiniClock() {
      miniCanvas.width = 200;
      miniCanvas.height = 200;
      
      const cX = 100, cY = 100, r = 88;
      miniCtx.clearRect(0, 0, 200, 200);
      
      const style = getComputedStyle(body);
      const bg = style.getPropertyValue('--canvas-bg').trim() || '#11161f';
      
      miniCtx.fillStyle = bg;
      miniCtx.beginPath();
      miniCtx.arc(cX, cY, r+3, 0, Math.PI*2);
      miniCtx.fill();

      miniCtx.beginPath();
      miniCtx.arc(cX, cY, r+1, 0, Math.PI*2);
      miniCtx.strokeStyle = style.getPropertyValue('--canvas-border-dark').trim() || '#5a7a9a';
      miniCtx.lineWidth = 1.5;
      miniCtx.stroke();

      for (let i = 0; i < 12; i++) {
        let angle = i * Math.PI * 2 / 12 - Math.PI/2;
        miniCtx.beginPath();
        miniCtx.moveTo(cX + Math.cos(angle)*(r-10), cY + Math.sin(angle)*(r-10));
        miniCtx.lineTo(cX + Math.cos(angle)*(r-2), cY + Math.sin(angle)*(r-2));
        miniCtx.lineWidth = i % 3 === 0 ? 2.2 : 1.2;
        miniCtx.strokeStyle = i % 3 === 0 ? '#f0c674' : '#8a9bb0';
        miniCtx.stroke();
      }

      const now = new Date();
      const hours = now.getHours() % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      const hourAngle = (hours * 30 + minutes * 0.5) * Math.PI/180 - Math.PI/2;
      const minuteAngle = (minutes * 6 + seconds * 0.1) * Math.PI/180 - Math.PI/2;
      const secondAngle = (seconds * 6) * Math.PI/180 - Math.PI/2;

      miniCtx.beginPath();
      miniCtx.moveTo(cX, cY);
      miniCtx.lineTo(cX + Math.cos(hourAngle)*(r*0.48), cY + Math.sin(hourAngle)*(r*0.48));
      miniCtx.lineWidth = 3;
      miniCtx.lineCap = 'round';
      miniCtx.strokeStyle = '#d9e2f0';
      miniCtx.stroke();

      miniCtx.beginPath();
      miniCtx.moveTo(cX, cY);
      miniCtx.lineTo(cX + Math.cos(minuteAngle)*(r*0.68), cY + Math.sin(minuteAngle)*(r*0.68));
      miniCtx.lineWidth = 2.2;
      miniCtx.strokeStyle = '#bdd4ff';
      miniCtx.stroke();

      miniCtx.beginPath();
      miniCtx.moveTo(cX, cY);
      miniCtx.lineTo(cX + Math.cos(secondAngle)*(r*0.78), cY + Math.sin(secondAngle)*(r*0.78));
      miniCtx.lineWidth = 1.5;
      miniCtx.strokeStyle = '#ffaa66';
      miniCtx.stroke();

      miniCtx.beginPath();
      miniCtx.arc(cX, cY, 4, 0, Math.PI*2);
      miniCtx.fillStyle = '#332211';
      miniCtx.fill();
      miniCtx.beginPath();
      miniCtx.arc(cX, cY, 2, 0, Math.PI*2);
      miniCtx.fillStyle = '#f5c17a';
      miniCtx.fill();
    }

    setInterval(drawMiniClock, 1000);
    drawMiniClock();

    // ==================== INICIAR ====================
    init();
    console.log('🚀 CodeHUB inicializado!');
  </script>
</body>
</html>
