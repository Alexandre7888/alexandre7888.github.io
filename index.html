  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg-start:#0b1120;--bg-end:#03060c;--canvas-bg:#11161f;--border:#2a3a4a;--text:#e2e9f0;--text2:#a0b3c9;--gold:#e6b422;--white-bg:#f5f7fc;--white-text:#1e293b;--toggle-bg:#1e2a3a;--toggle-border:#3e5a77;--shadow:rgba(0,0,0,0.5);--menu-bg:rgba(10,15,26,0.95);--menu-hover:rgba(230,180,34,0.1)}
    body.light{--bg-start:#e2e8f0;--bg-end:#cbd5e1;--canvas-bg:#f0f4fa;--border:#9aaebf;--text:#0f172a;--text2:#2c3e4e;--gold:#b45309;--white-bg:#fff;--white-text:#0f172a;--toggle-bg:#dce5f0;--toggle-border:#8ba0bc;--shadow:rgba(0,0,0,0.1);--menu-bg:rgba(255,255,255,0.95);--menu-hover:rgba(180,83,9,0.08)}
    body{background:radial-gradient(circle at 30% 20%,var(--bg-start),var(--bg-end));font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:background 0.4s}

    /* ===== HAMBURGER ===== */
    .hamburger{position:fixed;top:14px;left:16px;z-index:1200;width:52px;height:52px;border-radius:16px;background:var(--menu-bg);backdrop-filter:blur(14px);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;box-shadow:0 8px 22px var(--shadow);transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1)}
    .hamburger:hover{transform:scale(1.06);border-color:var(--gold)}
    .hamburger:active{transform:scale(0.95)}
    .hamburger span{display:block;width:22px;height:2.5px;border-radius:3px;background:var(--text);transition:all 0.35s cubic-bezier(0.68,-0.55,0.27,1.55)}
    .hamburger.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg);background:var(--gold)}
    .hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
    .hamburger.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);background:var(--gold)}

    /* ===== OVERLAY ===== */
    .menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 0.35s ease;z-index:1150}
    .menu-overlay.active{opacity:1;pointer-events:auto}

    /* ===== SIDE MENU ===== */
    .side-menu{position:fixed;top:0;left:0;height:100vh;width:300px;max-width:85vw;background:var(--menu-bg);backdrop-filter:blur(20px);border-right:1px solid var(--border);z-index:1190;transform:translateX(-105%);transition:transform 0.42s cubic-bezier(0.34,1.2,0.64,1);display:flex;flex-direction:column;box-shadow:8px 0 40px var(--shadow)}
    .side-menu.active{transform:translateX(0)}
    .menu-header{padding:28px 24px 20px;border-bottom:1px solid var(--border)}
    .menu-header h2{color:var(--text);font-size:1.35rem;font-weight:700;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px}
    .menu-header h2::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
    .menu-header p{color:var(--text2);font-size:0.78rem;margin-top:6px;letter-spacing:0.4px}
    .menu-nav{padding:16px 12px;flex:1;overflow-y:auto}
    .menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:14px;background:transparent;border:none;color:var(--text);font-size:0.95rem;font-weight:500;cursor:pointer;text-align:left;transition:all 0.2s ease;font-family:inherit;margin-bottom:4px}
    .menu-item:hover{background:var(--menu-hover);transform:translateX(4px)}
    .menu-item:active{transform:translateX(2px) scale(0.98)}
    .menu-item .icon{width:38px;height:38px;border-radius:11px;background:rgba(230,180,34,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.25s}
    .menu-item .icon svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .menu-item:hover .icon{background:var(--gold);transform:rotate(-6deg) scale(1.05)}
    .menu-item:hover .icon svg{stroke:#0a0f14}
    .menu-item .label{display:flex;flex-direction:column;gap:2px}
    .menu-item .label small{color:var(--text2);font-size:0.72rem;font-weight:400}
    .menu-footer{padding:18px 22px;border-top:1px solid var(--border);color:var(--text2);font-size:0.72rem;text-align:center;letter-spacing:0.3px}

    .content-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;margin-top:90px}
    .mini-clock{position:fixed;top:14px;right:16px;z-index:1100;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);border-radius:60px;padding:4px;box-shadow:0 6px 16px var(--shadow);border:1px solid var(--border)}
    .mini-clock canvas{display:block;width:42px;height:42px;border-radius:50%;background:var(--canvas-bg)}
    .theme-panel{position:fixed;bottom:24px;right:24px;z-index:1050;background:rgba(10,15,26,0.75);backdrop-filter:blur(12px);border-radius:48px;padding:6px 12px;display:flex;gap:8px;border:1px solid var(--border);box-shadow:0 8px 20px var(--shadow)}
    .theme-btn{background:var(--toggle-bg);border:none;border-radius:40px;padding:8px 16px;font-size:0.8rem;font-weight:600;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:6px;border:1px solid var(--toggle-border);transition:0.2s}
    .theme-btn.active{background:var(--gold);color:#0a0f14;box-shadow:0 0 8px rgba(230,180,34,0.4)}
    .white-area{width:100%;max-width:700px;margin:20px auto;background:var(--white-bg);border-radius:32px;padding:28px 24px;box-shadow:0 20px 35px -10px var(--shadow);text-align:center}
    .white-area h3{color:var(--white-text);font-size:1.4rem;margin-bottom:12px}
    .white-area p{color:var(--white-text);opacity:0.75}
    .white-placeholder{background:rgba(0,0,0,0.03);border-radius:24px;padding:24px;margin-top:16px;color:var(--white-text)}
    .welcome{color:var(--text);font-size:1.2rem;background:rgba(10,15,26,0.75);backdrop-filter:blur(8px);padding:15px 30px;border-radius:60px;border:1px solid var(--border);font-weight:500}

    .social-footer{margin-top:30px;display:flex;gap:24px;justify-content:center;align-items:center;flex-wrap:wrap}
    .social-footer a{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--white-bg);box-shadow:0 4px 12px var(--shadow);transition:transform 0.2s,box-shadow 0.2s;border:1px solid var(--border);padding:8px}
    .social-footer a:hover{transform:scale(1.12);box-shadow:0 8px 20px rgba(0,0,0,0.3)}
    .social-footer svg{width:28px;height:28px;fill:var(--white-text);transition:fill 0.2s}
    .social-footer a:hover svg{fill:var(--gold)}

    @media(max-width:550px){.theme-btn{font-size:0.7rem;padding:6px 10px}.mini-clock canvas{width:36px!important;height:36px!important}.side-menu{width:280px}}
  </style>
</head>

  <script>
    /* ===== MENU HAMBURGER ===== */
    const hamburger = document.getElementById('hamburger');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('menuOverlay');

    function toggleMenu(force) {
      const open = force !== undefined ? force : !sideMenu.classList.contains('active');
      hamburger.classList.toggle('open', open);
      sideMenu.classList.toggle('active', open);
      overlay.classList.toggle('active', open);
      document.body.style.overflow = open ? 'hidden' : '';
    }

    hamburger.addEventListener('click', () => toggleMenu());
    overlay.addEventListener('click', () => toggleMenu(false));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') toggleMenu(false);
    });

    /* ===== BOTÃO DESENVOLVEDOR ===== */
    document.getElementById('menuDeveloper').addEventListener('click', () => {
      window.location.href = '/developer';
    });

    /* ===== TEMA ===== */
    const body = document.body;
    function setTheme(t){
      if(t==='dark'){body.classList.add('dark');body.classList.remove('light')}
      else if(t==='light'){body.classList.add('light');body.classList.remove('dark')}
      else{const d=window.matchMedia('(prefers-color-scheme:dark)').matches;body.classList.toggle('dark',d);body.classList.toggle('light',!d)}
      if(t!=='system')localStorage.setItem('codehub-theme',t);else localStorage.setItem('codehub-theme','system');
      document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('theme'+t.charAt(0).toUpperCase()+t.slice(1))?.classList.add('active');
    }
    const st = localStorage.getItem('codehub-theme') || 'dark';
    setTheme(st);
    document.getElementById('themeDark').onclick = () => setTheme('dark');
    document.getElementById('themeLight').onclick = () => setTheme('light');
    document.getElementById('themeSystem').onclick = () => setTheme('system');

    /* ===== RELÓGIO ===== */
    const c = document.getElementById('miniCanvas'), ctx = c.getContext('2d');
    function draw(){
      c.width = 200; c.height = 200;
      const cx = 100, cy = 100, r = 88;
      ctx.fillStyle = getComputedStyle(body).getPropertyValue('--canvas-bg').trim() || '#11161f';
      ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, r + 1, 0, Math.PI * 2); ctx.strokeStyle = '#5a7a9a'; ctx.lineWidth = 1.5; ctx.stroke();
      for (let i = 0; i < 12; i++){
        let a = i * Math.PI * 2 / 12 - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * (r - 10), cy + Math.sin(a) * (r - 10));
        ctx.lineTo(cx + Math.cos(a) * (r - 2), cy + Math.sin(a) * (r - 2));
        ctx.lineWidth = i % 3 === 0 ? 2.2 : 1.2;
        ctx.strokeStyle = i % 3 === 0 ? '#f0c674' : '#8a9bb0';
        ctx.stroke();
      }
      const n = new Date();
      const ha = (n.getHours() % 12 * 30 + n.getMinutes() * 0.5) * Math.PI / 180 - Math.PI / 2;
      const ma = (n.getMinutes() * 6 + n.getSeconds() * 0.1) * Math.PI / 180 - Math.PI / 2;
      const sa = (n.getSeconds() * 6) * Math.PI / 180 - Math.PI / 2;
      [[ha, r * 0.48, 3, '#d9e2f0'], [ma, r * 0.68, 2.2, '#bdd4ff'], [sa, r * 0.78, 1.5, '#ffaa66']].forEach(([a, l, w, s]) => {
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * l, cy + Math.sin(a) * l);
        ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.strokeStyle = s; ctx.stroke();
      });
      ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fillStyle = '#332211'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fillStyle = '#f5c17a'; ctx.fill();
    }
    setInterval(draw, 1000); draw();

    /* ===== RENOVAÇÃO DE TOKEN FIREBASE ===== */
    async function initSilentTokenRefresh() {
      try {
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        const { getAuth, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');

        const firebaseConfig = {
          apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
          authDomain: "html-15e80.firebaseapp.com",
          databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
          projectId: "html-15e80",
          storageBucket: "html-15e80.firebasestorage.app",
          messagingSenderId: "1068148640439",
          appId: "1:1068148640439:web:1ac651348e624f6be41b32"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        console.log("🔄 Iniciando renovação silenciosa de token...");

        async function refreshCookie(user) {
          if (user) {
            try {
              const token = await user.getIdToken(true);
              document.cookie = "firebaseToken=" + token + "; Domain=.codehub.site.je; Path=/; SameSite=Lax; Secure";
              console.log("✅ Token renovado silenciosamente.");
            } catch (e) {
              console.error("❌ Erro ao renovar:", e.message);
            }
          } else {
            console.log("ℹ️ Nenhum usuário logado. Aguardando.");
          }
        }

        onAuthStateChanged(auth, async (user) => {
          if (user) {
            console.log("👤 Usuário detectado. Gerando token inicial...");
            await refreshCookie(user);
          } else {
            console.log("🚫 Usuário deslogado. Removendo cookie...");
            document.cookie = "firebaseToken=; Domain=.codehub.site.je; Path=/; Max-Age=0";
          }
        });

        setInterval(async () => {
          const currentUser = auth.currentUser;
          if (currentUser) {
            console.log("🔄 Ciclo de renovação (60s)...");
            await refreshCookie(currentUser);
          } else {
            console.log("⏳ Aguardando login...");
          }
        }, 60000);

      } catch (e) {
        console.error("❌ Erro ao iniciar renovação:", e.message);
      }
    }

    initSilentTokenRefresh();
  </script>
