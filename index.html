    body.light {

      --accent-glow: #e67e22;
      --white-area-bg: #ffffff;

      --shadow-color: rgba(0,0,0,0.1);

    body {
      background: radial-gradient(circle at 30% 20%, var(--bg-gradient-start), var(--bg-gradient-end));
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .main-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 24px 24px;
    }

    .content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin-top: 20px;
      margin-bottom: 30px;
    }

    /* Mini relógio */
    .mini-clock-corner {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 1100;
      background: rgba(0, 0, 0, 0.5);

      border-radius: 60px;
      padding: 6px;
      box-shadow: 0 6px 16px var(--shadow-color);
      border: 1px solid var(--canvas-border-dark);
      cursor: pointer;
      transition: all 0.2s;

    .mini-clock-corner:hover {
      transform: scale(1.02);

    }
    
    canvas.mini-canvas {

    .app-menu-button {

      cursor: pointer;
      display: grid;
      grid-template-columns: repeat(4, 1fr);

    .menu-overlay {
      position: fixed;
      top: 0;

      width: 100%;
      height: 100%;

      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    }

    .menu-overlay.active {
      display: flex;
    }

    .menu-grid {
      background: rgba(20, 25, 45, 0.95);
      border-radius: 20px;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 500px;

      padding: 15px;

    .white-area h3 {
      color: var(--white-area-text);

    }
    
    .white-area p {
      color: var(--white-area-text);

    .white-placeholder {
      background: rgba(0,0,0,0.03);

    .welcome-message {

      backdrop-filter: blur(8px);

      border-radius: 60px;
      border: 1px solid var(--canvas-border-dark);
      display: inline-block;

    /* Botão de login */
    .login-prompt {
      position: fixed;
      top: 20px;
      left: 80px;
      z-index: 10000;
      background: rgba(67, 97, 238, 0.9);
      color: white;
      padding: 10px 20px;

      cursor: pointer;

      font-weight: 600;
      border: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      display: none;
    }

    .login-prompt:hover {
      background: rgba(67, 97, 238, 1);

    }

    .login-prompt.show {
      display: block;
    }

    @media (max-width: 550px) {
      .theme-btn span:first-child { display: none; }

      .mini-canvas { width: 55px !important; height: 55px !important; }
      .app-menu-button { width: 40px; height: 40px; top: 10px; left: 10px; }
      .login-prompt { left: 60px; top: 10px; font-size: 12px; padding: 8px 14px; }
    }
  </style>
</head>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:7cc5bde34f4c5a5ce41b32",
      measurementId: "G-V57KRZ02HJ"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // ==================== VARIÁVEIS ====================
    let currentUserKey = null;
    let currentUserData = null;
    let isAuthenticated = false;

    // ==================== APPS DO MENU ====================
    const apps = [
      { id: 'editor', name: 'Editor', icon: '📝', url: 'editor.html' },
      { id: 'clock', name: 'Relógio', icon: '🕐', url: 'clock.html' },
      { id: 'compass', name: 'Bússola', icon: '🧭', url: 'compass.html' },
      { id: 'notes', name: 'Notas', icon: '📋', url: 'notes.html' },
      { id: 'calc', name: 'Calc', icon: '🔢', url: 'calc.html' },
      { id: 'weather', name: 'Clima', icon: '🌤️', url: 'weather.html' },
      { id: 'tasks', name: 'Tarefas', icon: '✅', url: 'tasks.html' },
      { id: 'chat', name: 'Chat', icon: '💬', url: 'chat.html' },
      { id: 'files', name: 'Arquivos', icon: '📁', url: 'files.html' },
      { id: 'settings', name: 'Config', icon: '⚙️', url: 'settings.html' },
      { id: 'profile', name: 'Perfil', icon: '👤', url: 'profile.html' },
      { id: 'help', name: 'Ajuda', icon: '❓', url: 'help.html' },
      { id: 'about', name: 'Sobre', icon: 'ℹ️', url: 'about.html' },
      { id: 'auth', name: 'Contas', icon: '🔐', url: 'auth.html' },
      { id: 'logout', name: 'Sair', icon: '🚪', url: '#logout' },
    ];

    // ==================== INICIALIZAÇÃO ====================
    async function init() {
      // Pegar userKey da URL
      const urlParams = new URLSearchParams(window.location.search);
      const urlUserKey = urlParams.get('userKey');
      
      // Pegar userKey do localStorage
      const localUserKey = localStorage.getItem('current_userKey');
      
      currentUserKey = urlUserKey || localUserKey;
      
      if (currentUserKey) {
        await loadUserData();
      } else {
        checkLocalAuth();
      }
      
      buildMenuGrid();
      updateUI();
    }

    async function loadUserData() {
      try {
        const snapshot = await get(ref(database, `userKeysData/${currentUserKey}`));
        
        if (snapshot.exists()) {
          const keyData = snapshot.val();
          currentUserData = keyData.authTokenDecoded || keyData;
          isAuthenticated = true;
          
          // Salvar no localStorage
          localStorage.setItem('current_userKey', currentUserKey);
          localStorage.setItem('auth_token', keyData.authToken);
          localStorage.setItem('token_user_id', currentUserData.uid);
          
          console.log('✅ Usuário autenticado:', currentUserData.username || currentUserData.email);
        } else {
          console.log('⚠️ UserKey não encontrada no Firebase');
          isAuthenticated = false;
        }
      } catch (error) {
        console.error('Erro ao carregar dados do usuário:', error);
        isAuthenticated = false;
      }
    }

    function checkLocalAuth() {
      const token = localStorage.getItem('auth_token');
      const userId = localStorage.getItem('token_user_id');
      
      if (token && userId) {
        isAuthenticated = true;
        console.log('✅ Autenticação local encontrada');
      } else {
        isAuthenticated = false;
        console.log('⚠️ Usuário não autenticado');
      }
    }

    function updateUI() {
      const loginPrompt = document.getElementById('loginPrompt');
      const welcomeMessage = document.getElementById('welcomeMessage');
      const statusMessage = document.getElementById('statusMessage');
      const placeholderContent = document.getElementById('placeholderContent');
      
      if (isAuthenticated && currentUserData) {
        loginPrompt.classList.remove('show');
        welcomeMessage.innerHTML = `✨ Bem-vindo, ${currentUserData.username || currentUserData.email || 'Usuário'}! ✨`;
        statusMessage.textContent = '✅ Autenticado - Acesse os aplicativos pelo menu';
        placeholderContent.innerHTML = `
          👤 ${currentUserData.username || 'Usuário'}<br />
          📧 ${currentUserData.email || ''}<br />
          🏷️ ${currentUserData.userType === 'entrepreneur' ? 'Empreendedor' : 'Usuário Normal'}<br />
          🔑 UserKey: ${currentUserKey ? currentUserKey.substring(0, 20) + '...' : 'N/A'}
        `;
      } else {
        loginPrompt.classList.add('show');
        welcomeMessage.innerHTML = '✨ Bem-vindo ao CodeHUB ✨';
        statusMessage.textContent = '🔐 Faça login para acessar todos os recursos';
        placeholderContent.innerHTML = `
          📱 Use o menu de pontos (4x4) no canto superior esquerdo<br />
          🔐 Faça login para acessar todos os aplicativos<br />
          👥 Até 5 contas por dispositivo
        `;
      }
    }

    // ==================== MENU DE APPS ====================
    function buildMenuGrid() {
      const menuGrid = document.getElementById('menuGrid');
      menuGrid.innerHTML = '';
      
      // Info do usuário (se autenticado)
      if (isAuthenticated && currentUserData) {
        const userInfo = document.createElement('div');
        userInfo.className = 'menu-user-info';
        userInfo.innerHTML = `
          <div style="font-weight: 600;">👋 ${currentUserData.username || 'Usuário'}</div>
          <div style="font-size: 12px; opacity: 0.7;">${currentUserData.email || ''}</div>
        `;
        menuGrid.appendChild(userInfo);
      }
      
      // Apps
      apps.forEach(app => {
        const item = document.createElement('div');
        item.className = 'menu-item';
        item.innerHTML = `
          <div class="menu-item-icon">${app.icon}</div>
          <div class="menu-item-name">${app.name}</div>
        `;
        
        item.onclick = () => {
          if (app.id === 'logout') {
            handleLogout();
          } else {
            openApp(app.url);
          }
        };
        
        menuGrid.appendChild(item);
      });
    }

    function openApp(url) {
      if (currentUserKey) {
        const separator = url.includes('?') ? '&' : '?';
        window.location.href = `${url}${separator}userKey=${currentUserKey}`;
      } else {
        window.location.href = url;
      }
    }

    function handleLogout() {
      if (confirm('Tem certeza que deseja sair?')) {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('token_user_id');
        localStorage.removeItem('current_userKey');
        window.location.reload();
      }
    }

    // ==================== EVENTOS DO MENU ====================
    document.getElementById('appMenuButton').addEventListener('click', () => {
      document.getElementById('menuOverlay').classList.add('active');
      
      // Animação dos pontos
      const dots = document.querySelectorAll('.app-menu-dot');
      dots.forEach((dot, index) => {
        setTimeout(() => {
          dot.style.background = '#4cc9f0';
          setTimeout(() => {
            dot.style.background = 'rgba(67, 97, 238, 0.8)';
          }, 200);
        }, index * 30);
      });
    });

    document.getElementById('menuOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('menuOverlay')) {
        document.getElementById('menuOverlay').classList.remove('active');
      }
    });

    // ==================== TEMA ====================
    const body = document.body;
    
    function setTheme(theme) {
      if (theme === 'dark') {
        body.classList.add('dark');
        body.classList.remove('light');
        localStorage.setItem('codehub-theme', 'dark');
        updateThemeButtons('dark');
      } else if (theme === 'light') {
        body.classList.add('light');
        body.classList.remove('dark');
        localStorage.setItem('codehub-theme', 'light');
        updateThemeButtons('light');
      } else if (theme === 'system') {
        localStorage.setItem('codehub-theme', 'system');
        applySystemTheme();
        updateThemeButtons('system');
      }
    }

    function applySystemTheme() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDark) {
        body.classList.add('dark');
        body.classList.remove('light');
      } else {
        body.classList.add('light');
        body.classList.remove('dark');
      }
    }

    function updateThemeButtons(active) {
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`theme${active.charAt(0).toUpperCase() + active.slice(1)}`).classList.add('active');
    }

    const savedTheme = localStorage.getItem('codehub-theme');
    if (savedTheme === 'dark') setTheme('dark');
    else if (savedTheme === 'light') setTheme('light');
    else if (savedTheme === 'system') setTheme('system');
    else setTheme('dark');

    document.getElementById('themeDark').addEventListener('click', () => setTheme('dark'));
    document.getElementById('themeLight').addEventListener('click', () => setTheme('light'));
    document.getElementById('themeSystem').addEventListener('click', () => setTheme('system'));

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (localStorage.getItem('codehub-theme') === 'system') {
        applySystemTheme();
      }
    });

    // ==================== RELÓGIO MINI ====================
    const miniCanvas = document.getElementById('miniCanvas');
    const miniCtx = miniCanvas.getContext('2d');
    let miniCenter = 100;
    let miniRadius = 88;

    function drawMiniClock() {
      miniCanvas.width = 200;
      miniCanvas.height = 200;
      
      const cX = miniCenter, cY = miniCenter, r = miniRadius;
      miniCtx.clearRect(0, 0, 200, 200);
      
      const computedStyle = getComputedStyle(body);
      const canvasBg = computedStyle.getPropertyValue('--canvas-bg').trim() || '#11161f';
      
      miniCtx.fillStyle = canvasBg;
      miniCtx.beginPath();
      miniCtx.arc(cX, cY, r+3, 0, Math.PI*2);
      miniCtx.fill();

      miniCtx.beginPath();
      miniCtx.arc(cX, cY, r+1, 0, Math.PI*2);
      miniCtx.strokeStyle = computedStyle.getPropertyValue('--canvas-border-dark').trim() || '#5a7a9a';
      miniCtx.lineWidth = 1.5;
      miniCtx.stroke();

      for (let i = 0; i < 12; i++) {
        let angle = i * Math.PI * 2 / 12 - Math.PI/2;
        let inner = r - 10;
        let outer = r - 2;
        miniCtx.beginPath();
        miniCtx.moveTo(cX + Math.cos(angle)*inner, cY + Math.sin(angle)*inner);
        miniCtx.lineTo(cX + Math.cos(angle)*outer, cY + Math.sin(angle)*outer);
        miniCtx.lineWidth = i % 3 === 0 ? 2.2 : 1.2;
        miniCtx.strokeStyle = i % 3 === 0 ? '#f0c674' : '#8a9bb0';
        miniCtx.stroke();
      }

      const now = new Date();
      let hours = now.getHours() % 12;
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

      let hourAngle = (hours * 30 + minutes * 0.5) * Math.PI/180 - Math.PI/2;
      let minuteAngle = (minutes * 6 + seconds * 0.1) * Math.PI/180 - Math.PI/2;
      let secondAngle = (seconds * 6) * Math.PI/180 - Math.PI/2;

      miniCtx.beginPath();
      miniCtx.moveTo(cX, cY);
      miniCtx.lineTo(cX + Math.cos(hourAngle) * (r * 0.48), cY + Math.sin(hourAngle) * (r * 0.48));
      miniCtx.lineWidth = 3;
      miniCtx.lineCap = 'round';
      miniCtx.strokeStyle = '#d9e2f0';
      miniCtx.stroke();

      miniCtx.beginPath();
      miniCtx.moveTo(cX, cY);
      miniCtx.lineTo(cX + Math.cos(minuteAngle) * (r * 0.68), cY + Math.sin(minuteAngle) * (r * 0.68));
      miniCtx.lineWidth = 2.2;
      miniCtx.strokeStyle = '#bdd4ff';
      miniCtx.stroke();

      miniCtx.beginPath();
      miniCtx.moveTo(cX, cY);
      miniCtx.lineTo(cX + Math.cos(secondAngle) * (r * 0.78), cY + Math.sin(secondAngle) * (r * 0.78));
      miniCtx.lineWidth = 1.5;
      miniCtx.strokeStyle = '#ffaa66';
      miniCtx.stroke();

      miniCtx.beginPath();
      miniCtx.arc(cX, cY, 4, 0, Math.PI*2);
      miniCtx.fillStyle = '#332211';
      miniCtx.fill();
      miniCtx.beginPath();
      miniCtx.arc(cX, cY, 2, 0, Math.PI*2);
      miniCtx.fillStyle = '#f5c17a';
      miniCtx.fill();
    }

    setInterval(drawMiniClock, 1000);
    drawMiniClock();

    // ==================== INICIAR ====================
    init();
    console.log('🚀 CodeHUB inicializado!');
    console.log('🔑 UserKey:', currentUserKey || 'Nenhuma');
    console.log('🔐 Autenticado:', isAuthenticated);
  </script>
