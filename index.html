<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CodeHUB · Plataforma</title>
  <link rel="icon" type="image/png" href="https://alexandre7888.github.io/InShot_20250807_112151490.jpg">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X4VF1LWB0F"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-X4VF1LWB0F')</script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root, html[data-theme="dark"]{
      --bg-1:#0a0e1a;--bg-2:#05070f;--canvas-bg:#0f1424;
      --surface:#101626;--surface-2:#151c30;
      --border:#1f2a44;--border-strong:#2d3b5c;
      --text:#e8eef8;--text-2:#8fa0bd;
      --accent:#4f8cff;--accent-2:#7aa8ff;
      --accent-glow:rgba(79,140,255,0.35);
      --accent-soft:rgba(79,140,255,0.1);
      --shadow:rgba(0,0,0,0.55);
      --menu-bg:rgba(10,15,28,0.9);
    }
    html[data-theme="light"]{
      --bg-1:#f7f9fc;--bg-2:#eef2f8;--canvas-bg:#ffffff;
      --surface:#ffffff;--surface-2:#f5f8fd;
      --border:#e2e8f2;--border-strong:#c8d3e5;
      --text:#0f172a;--text-2:#5b6b85;
      --accent:#2563eb;--accent-2:#3b82f6;
      --accent-glow:rgba(37,99,235,0.25);
      --accent-soft:rgba(37,99,235,0.07);
      --shadow:rgba(15,23,42,0.08);
      --menu-bg:rgba(255,255,255,0.92);
    }

    body{
      background:radial-gradient(circle at 30% 20%,var(--bg-1),var(--bg-2));
      font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
      color:var(--text);min-height:100vh;display:flex;flex-direction:column;
      transition:background .4s ease,color .3s ease;
    }

    /* ===== PERFIL NO CANTO (controlado pelo HTML) ===== */
    .profile-btn{
      position:fixed;top:14px;right:16px;z-index:1100;
      width:52px;height:52px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:700;font-size:20px;
      cursor:pointer;overflow:hidden;
      border:2px solid rgba(255,255,255,.1);
      box-shadow:0 8px 22px var(--shadow);
      transition:transform .2s;
      user-select:none;
    }
    .profile-btn:hover{transform:scale(1.08)}
    .profile-btn img{width:100%;height:100%;object-fit:cover}

    .profile-dropdown{
      position:fixed;top:76px;right:16px;z-index:1120;
      min-width:220px;
      background:var(--menu-bg);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid var(--border);border-radius:16px;
      padding:8px;
      box-shadow:0 20px 50px var(--shadow);
      display:none;
      animation:appShellFade .2s ease;
    }
    .profile-dropdown.active{display:block}
    @keyframes appShellFade{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

    .profile-dropdown-header{padding:12px 14px;border-bottom:1px solid var(--border);margin-bottom:6px}
    .profile-dropdown-header .name{color:var(--text);font-weight:600;font-size:.9rem}
    .profile-dropdown-header .email{color:var(--text-2);font-size:.75rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .profile-dropdown-item{
      display:flex;align-items:center;gap:10px;
      width:100%;padding:10px 12px;border-radius:10px;
      background:transparent;border:none;color:var(--text);
      font-size:.85rem;cursor:pointer;font-family:inherit;
      text-align:left;transition:background .15s;
    }
    .profile-dropdown-item:hover{background:var(--accent-soft)}
    .profile-dropdown-item svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .profile-dropdown-item.danger{color:#ef4444}
    .profile-dropdown-item.danger svg{stroke:#ef4444}

    .content-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;margin-top:90px}

    .theme-panel{position:fixed;bottom:24px;right:24px;z-index:1050;background:var(--menu-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:48px;padding:6px;display:flex;gap:6px;border:1px solid var(--border);box-shadow:0 8px 20px var(--shadow)}
    .theme-btn{background:transparent;border:none;border-radius:40px;padding:8px 14px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text-2);display:flex;align-items:center;gap:6px;transition:.2s;font-family:inherit}
    .theme-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
    .theme-btn:hover{color:var(--text);background:var(--accent-soft)}
    .theme-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent-glow)}
    .theme-btn.active svg{stroke:#fff}

    .white-area{width:100%;max-width:700px;margin:20px auto;background:var(--surface);border-radius:32px;padding:32px 28px;box-shadow:0 20px 45px -10px var(--shadow),0 0 0 1px var(--border) inset;text-align:center;position:relative;overflow:hidden}
    .white-area::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
    .white-area h3{color:var(--text);font-size:1.5rem;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}
    .white-area h3 svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .white-area p{color:var(--text-2);font-size:.95rem}
    .white-placeholder{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:24px;padding:24px;margin-top:20px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500}
    .white-placeholder svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .welcome{color:var(--text);font-size:1.15rem;background:var(--menu-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 28px;border-radius:60px;border:1px solid var(--border);font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 8px 20px var(--shadow)}
    .welcome svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    @media(max-width:550px){.theme-btn{font-size:.7rem;padding:6px 10px}.theme-btn svg{width:14px;height:14px}}
  </style>
</head>
<body>

  <div id="app-menu-root"></div>

  <!-- ===== PERFIL (controlado pelo HTML) ===== -->
  <div class="profile-btn" id="profileBtn" style="display:none;">
    <span id="profileInitial">?</span>
  </div>

  <div class="profile-dropdown" id="profileDropdown">
    <div class="profile-dropdown-header">
      <div class="name" id="pdName">Usuário</div>
      <div class="email" id="pdEmail">—</div>
    </div>
    <button class="profile-dropdown-item" data-action="profile">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Meu perfil</span>
    </button>
    <button class="profile-dropdown-item" data-action="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>Configurações</span>
    </button>
    <button class="profile-dropdown-item danger" data-action="logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Sair</span>
    </button>
  </div>

  <div class="content-wrap">
    <div class="welcome">
      <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/></svg>
      Bem-vindo ao CodeHUB
      <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/></svg>
    </div>

    <div class="white-area">
      <h3>Plataforma CodeHUB</h3>
      <p>Use o menu lateral para navegar entre as opções</p>
      <div class="white-placeholder">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Barra de tarefas inteligente
      </div>
    </div>
  </div>

  <div class="theme-panel">
    <button id="themeDark" class="theme-btn active" data-set-theme="dark">
      <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      Dark
    </button>
    <button id="themeLight" class="theme-btn" data-set-theme="light">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      Light
    </button>
    <button id="themeSystem" class="theme-btn" data-set-theme="system">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      Sistema
    </button>
  </div>

  <!-- ===== APP-MENU.JS (React) ===== -->
  <script src="https://alexandre7888.github.io/app-menu.js"></script>

  <!-- ===== APP-SHELL.JS (menu + foto) ===== -->
  <script src="https://alexandre7888.github.io/app-shell.js"></script>
  <script>
    const shell = new AppShell().mount();

    // ===== TEMA =====
    const html = document.documentElement;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');

    function applyTheme(mode){
      let effective = mode;
      if (mode === 'system') effective = mq.matches ? 'dark' : 'light';
      html.setAttribute('data-theme', effective);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      const btn = document.querySelector('[data-set-theme="' + mode + '"]');
      if (btn) btn.classList.add('active');
    }

    function setTheme(mode){
      localStorage.setItem('codehub-theme', mode);
      applyTheme(mode);
    }

    document.querySelectorAll('[data-set-theme]').forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.setTheme));
    });

    mq.addEventListener('change', () => {
      if (localStorage.getItem('codehub-theme') === 'system') applyTheme('system');
    });

    setTheme(localStorage.getItem('codehub-theme') || 'dark');

    // ===== PERFIL (controlado pelo HTML) =====
    const profileBtn      = document.getElementById('profileBtn');
    const profileInitial  = document.getElementById('profileInitial');
    const profileDropdown = document.getElementById('profileDropdown');
    const pdName          = document.getElementById('pdName');
    const pdEmail         = document.getElementById('pdEmail');

    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#profileDropdown') && !e.target.closest('#profileBtn')) {
        profileDropdown.classList.remove('active');
      }
    });

    profileDropdown.querySelectorAll('.profile-dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        const action = item.dataset.action;
        profileDropdown.classList.remove('active');

        if (action === 'logout') {
          if (confirm('Sair da conta?')) {
            document.cookie = "firebaseToken=; Domain=.codehub.site.je; Path=/; Max-Age=0";
            location.reload();
          }
        } else if (action === 'profile') {
          console.log('perfil');
        } else if (action === 'settings') {
          console.log('config');
        }
      });
    });

    function atualizarPerfil(user) {
      if (user) {
        profileBtn.style.display = 'flex';
        pdName.textContent = user.displayName || user.email || 'Usuário';
        pdEmail.textContent = user.email || '';

        if (user.photoURL) {
          profileInitial.outerHTML = `<img id="profileInitial" src="${user.photoURL}" alt="">`;
        } else {
          profileInitial.textContent = (user.displayName || user.email || '?').charAt(0).toUpperCase();
        }
      } else {
        profileBtn.style.display = 'none';
      }
    }

    // ===== FIREBASE AUTH =====
    (async function(){
      try {
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        const { getAuth, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');

        const cfg = {
          apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
          authDomain: "html-15e80.firebaseapp.com",
          databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
          projectId: "html-15e80",
          storageBucket: "html-15e80.firebasestorage.app",
          messagingSenderId: "1068148640439",
          appId: "1:1068148640439:web:1ac651348e624f6be41b32"
        };

        const app = initializeApp(cfg);
        const auth = getAuth(app);

        async function refresh(user) {
          if (!user) return;
          try {
            const t = await user.getIdToken(true);
            document.cookie = "firebaseToken=" + t + "; Domain=.codehub.site.je; Path=/; SameSite=Lax; Secure";
          } catch (e) { console.error("[CodeHUB] token:", e.message); }
        }

        onAuthStateChanged(auth, async (user) => {
          atualizarPerfil(user);
          if (user) await refresh(user);
          else document.cookie = "firebaseToken=; Domain=.codehub.site.je; Path=/; Max-Age=0";
        });

        setInterval(() => { if (auth.currentUser) refresh(auth.currentUser); }, 60000);
      } catch (e) { console.error("[CodeHUB] init:", e.message); }
    })();
  </script>
</body>
</html>
