  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X4VF1LWB0F"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    /* ===== DARK (padrão) — azul-noite elegante ===== */
    :root, html[data-theme="dark"]{
      --bg-1:#0a0e1a;
      --bg-2:#05070f;
      --canvas-bg:#0f1424;
      --surface:#101626;
      --surface-2:#151c30;
      --border:#1f2a44;
      --border-strong:#2d3b5c;
      --text:#e8eef8;
      --text-2:#8fa0bd;
      --accent:#4f8cff;
      --accent-2:#7aa8ff;
      --accent-glow:rgba(79,140,255,0.35);
      --accent-soft:rgba(79,140,255,0.1);
      --shadow:rgba(0,0,0,0.55);
      --menu-bg:rgba(10,15,28,0.9);
      --menu-hover:rgba(79,140,255,0.1);
      --toggle-bg:#151c30;
      --toggle-border:#2d3b5c;
    }

    /* ===== LIGHT — branco premium clean ===== */
    html[data-theme="light"]{
      --bg-1:#f7f9fc;
      --bg-2:#eef2f8;
      --canvas-bg:#ffffff;
      --surface:#ffffff;
      --surface-2:#f5f8fd;
      --border:#e2e8f2;
      --border-strong:#c8d3e5;
      --text:#0f172a;
      --text-2:#5b6b85;
      --accent:#2563eb;
      --accent-2:#3b82f6;
      --accent-glow:rgba(37,99,235,0.25);
      --accent-soft:rgba(37,99,235,0.07);
      --shadow:rgba(15,23,42,0.08);
      --menu-bg:rgba(255,255,255,0.92);
      --menu-hover:rgba(37,99,235,0.08);
      --toggle-bg:#f1f5fb;
      --toggle-border:#d6e0ee;
    }

    body{
      background:radial-gradient(circle at 30% 20%,var(--bg-1),var(--bg-2));
      font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      transition:background 0.4s ease,color 0.3s ease;
    }

    /* ===== HAMBURGER ===== */
    .hamburger{position:fixed;top:14px;left:16px;z-index:1200;width:52px;height:52px;border-radius:16px;background:var(--menu-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;box-shadow:0 8px 22px var(--shadow);transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1)}
    .hamburger:hover{transform:scale(1.06);border-color:var(--accent);box-shadow:0 8px 25px var(--accent-glow)}
    .hamburger:active{transform:scale(0.95)}
    .hamburger span{display:block;width:22px;height:2.5px;border-radius:3px;background:var(--text);transition:all 0.35s cubic-bezier(0.68,-0.55,0.27,1.55)}
    .hamburger.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg);background:var(--accent)}
    .hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
    .hamburger.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);background:var(--accent)}

    /* ===== OVERLAY ===== */
    .menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 0.35s ease;z-index:1150}
    .menu-overlay.active{opacity:1;pointer-events:auto}

    /* ===== SIDE MENU ===== */
    .side-menu{position:fixed;top:0;left:0;height:100vh;width:300px;max-width:85vw;background:var(--menu-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);z-index:1190;transform:translateX(-105%);transition:transform 0.42s cubic-bezier(0.34,1.2,0.64,1);display:flex;flex-direction:column;box-shadow:8px 0 40px var(--shadow)}
    .side-menu.active{transform:translateX(0)}
    .menu-header{padding:28px 24px 20px;border-bottom:1px solid var(--border)}
    .menu-header h2{color:var(--text);font-size:1.35rem;font-weight:700;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px}
    .menu-header h2::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
    .menu-header p{color:var(--text-2);font-size:0.78rem;margin-top:6px;letter-spacing:0.4px}
    .menu-nav{padding:16px 12px;flex:1;overflow-y:auto}
    .menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:14px;background:transparent;border:none;color:var(--text);font-size:0.95rem;font-weight:500;cursor:pointer;text-align:left;transition:all 0.2s ease;font-family:inherit;margin-bottom:4px}
    .menu-item:hover{background:var(--menu-hover);transform:translateX(4px)}
    .menu-item:active{transform:translateX(2px) scale(0.98)}
    .menu-item .icon{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.25s}
    .menu-item .icon svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .menu-item:hover .icon{background:var(--accent);transform:rotate(-6deg) scale(1.05);box-shadow:0 0 15px var(--accent-glow)}
    .menu-item:hover .icon svg{stroke:#fff}
    .menu-item .label{display:flex;flex-direction:column;gap:2px}
    .menu-item .label small{color:var(--text-2);font-size:0.72rem;font-weight:400}
    .menu-footer{padding:18px 22px;border-top:1px solid var(--border);color:var(--text-2);font-size:0.72rem;text-align:center;letter-spacing:0.3px}

    .content-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;margin-top:90px}

    /* ===== CLOCK ===== */
    .mini-clock{position:fixed;top:14px;right:16px;z-index:1100;background:var(--menu-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:60px;padding:4px;box-shadow:0 6px 16px var(--shadow);border:1px solid var(--border)}
    .mini-clock canvas{display:block;width:42px;height:42px;border-radius:50%;background:var(--canvas-bg)}

    /* ===== THEME PANEL ===== */
    .theme-panel{position:fixed;bottom:24px;right:24px;z-index:1050;background:var(--menu-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:48px;padding:6px;display:flex;gap:6px;border:1px solid var(--border);box-shadow:0 8px 20px var(--shadow)}
    .theme-btn{background:transparent;border:none;border-radius:40px;padding:8px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;color:var(--text-2);display:flex;align-items:center;gap:6px;transition:0.2s;font-family:inherit}
    .theme-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:0.2s}
    .theme-btn:hover{color:var(--text);background:var(--accent-soft)}
    .theme-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent-glow)}
    .theme-btn.active svg{stroke:#fff}

    /* ===== CARD ===== */
    .white-area{width:100%;max-width:700px;margin:20px auto;background:var(--surface);border-radius:32px;padding:32px 28px;box-shadow:0 20px 45px -10px var(--shadow),0 0 0 1px var(--border) inset;text-align:center;position:relative;overflow:hidden}
    .white-area::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
    .white-area h3{color:var(--text);font-size:1.5rem;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}
    .white-area h3 svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .white-area p{color:var(--text-2);font-size:0.95rem}
    .white-placeholder{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:24px;padding:24px;margin-top:20px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;transition:0.2s}
    .white-placeholder svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* ===== WELCOME ===== */
    .welcome{color:var(--text);font-size:1.15rem;background:var(--menu-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 28px;border-radius:60px;border:1px solid var(--border);font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 8px 20px var(--shadow)}
    .welcome svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--accent-glow))}

    /* ===== SOCIAL ===== */
    .social-footer{margin-top:28px;display:flex;gap:24px;justify-content:center;align-items:center;flex-wrap:wrap}
    .social-footer a{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--toggle-bg);box-shadow:0 4px 12px var(--shadow);transition:transform 0.2s,box-shadow 0.2s,background 0.2s;border:1px solid var(--border);padding:8px}
    .social-footer a:hover{transform:scale(1.12);background:var(--accent);box-shadow:0 8px 20px var(--accent-glow);border-color:var(--accent)}
    .social-footer svg{width:26px;height:26px;fill:var(--text);transition:fill 0.2s}
    .social-footer a:hover svg{fill:#fff}

    @media(max-width:550px){.theme-btn{font-size:0.7rem;padding:6px 10px}.theme-btn svg{width:14px;height:14px}.mini-clock canvas{width:36px!important;height:36px!important}.side-menu{width:280px}}
  </style>
</head>

  <script>
    if (window.AppMenu) {
      const root = ReactDOM.createRoot(document.getElementById('app-menu-root'));
      root.render(React.createElement(window.AppMenu));
    }

  <script>
    /* ===== MENU HAMBURGER ===== */
    const hamburger = document.getElementById('hamburger');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('menuOverlay');

    function toggleMenu(force) {
      const open = force !== undefined ? force : !sideMenu.classList.contains('active');
      hamburger.classList.toggle('open', open);
      sideMenu.classList.toggle('active', open);
      overlay.classList.toggle('active', open);
      document.body.style.overflow = open ? 'hidden' : '';
    }

    hamburger.addEventListener('click', () => toggleMenu());
    overlay.addEventListener('click', () => toggleMenu(false));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggleMenu(false); });

    document.getElementById('menuDeveloper').addEventListener('click', () => {
      window.location.href = '/developer';
    });

    /* ===== TEMA (CORRIGIDO) ===== */
    const html = document.documentElement;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');

    function applyTheme(mode){
      let effective = mode;
      if (mode === 'system') effective = mq.matches ? 'dark' : 'light';
      html.setAttribute('data-theme', effective);

      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      const btn = document.querySelector(`[data-set-theme="${mode}"]`);
      if (btn) btn.classList.add('active');
    }

    function setTheme(mode){
      localStorage.setItem('codehub-theme', mode);
      applyTheme(mode);
    }

    // Botões
    document.querySelectorAll('[data-set-theme]').forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.setTheme));
    });

    // Reage a mudança do sistema quando estiver em "system"
    mq.addEventListener('change', () => {
      if (localStorage.getItem('codehub-theme') === 'system') applyTheme('system');
    });

    // Inicializa
    setTheme(localStorage.getItem('codehub-theme') || 'dark');

    /* ===== RELÓGIO ===== */
    const c = document.getElementById('miniCanvas'), ctx = c.getContext('2d');
    function draw(){
      c.width = 200; c.height = 200;
      const cx = 100, cy = 100, r = 88;
      const isLight = html.getAttribute('data-theme') === 'light';

      ctx.fillStyle = isLight ? '#ffffff' : '#0f1424';
      ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, r + 1, 0, Math.PI * 2);
      ctx.strokeStyle = isLight ? '#c8d3e5' : '#2d3b5c';
      ctx.lineWidth = 1.5; ctx.stroke();

      for (let i = 0; i < 12; i++){
        const a = i * Math.PI * 2 / 12 - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * (r - 10), cy + Math.sin(a) * (r - 10));
        ctx.lineTo(cx + Math.cos(a) * (r - 2), cy + Math.sin(a) * (r - 2));
        ctx.lineWidth = i % 3 === 0 ? 2.2 : 1.2;
        ctx.strokeStyle = i % 3 === 0
          ? (isLight ? '#2563eb' : '#4f8cff')
          : (isLight ? '#8fa0bd' : '#5b6b85');
        ctx.stroke();
      }

      const n = new Date();
      const ha = (n.getHours() % 12 * 30 + n.getMinutes() * 0.5) * Math.PI / 180 - Math.PI / 2;
      const ma = (n.getMinutes() * 6 + n.getSeconds() * 0.1) * Math.PI / 180 - Math.PI / 2;
      const sa = (n.getSeconds() * 6) * Math.PI / 180 - Math.PI / 2;

      const handColor = isLight ? '#0f172a' : '#e8eef8';
      const secColor  = isLight ? '#2563eb' : '#4f8cff';
      const minColor  = isLight ? '#3b82f6' : '#7aa8ff';

      [[ha, r * 0.48, 3, handColor], [ma, r * 0.68, 2.2, minColor], [sa, r * 0.78, 1.5, secColor]].forEach(([a, l, w, s]) => {
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * l, cy + Math.sin(a) * l);
        ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.strokeStyle = s; ctx.stroke();
      });

      ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fillStyle = isLight ? '#0f172a' : '#e8eef8'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2);
      ctx.fillStyle = isLight ? '#2563eb' : '#4f8cff'; ctx.fill();
    }
    setInterval(draw, 1000); draw();

        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        const { getAuth, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');

        const firebaseConfig = {

          authDomain: "html-15e80.firebaseapp.com",
          databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
          projectId: "html-15e80",
          storageBucket: "html-15e80.firebasestorage.app",
          messagingSenderId: "1068148640439",
          appId: "1:1068148640439:web:1ac651348e624f6be41b32"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        async function refreshCookie(user) {
          if (!user) return;
          try {
            const token = await user.getIdToken(true);
            document.cookie = "firebaseToken=" + token + "; Domain=.codehub.site.je; Path=/; SameSite=Lax; Secure";
            console.log("✅ Token renovado.");
          } catch (e) {
            console.error("❌ Erro:", e.message);
          }
        }

        onAuthStateChanged(auth, async (user) => {
          if (user) await refreshCookie(user);
          else document.cookie = "firebaseToken=; Domain=.codehub.site.je; Path=/; Max-Age=0";
        });

        setInterval(() => { if (auth.currentUser) refreshCookie(auth.currentUser); }, 60000);
      } catch (e) {
        console.error("❌ Firebase:", e.message);
      }
    }
    initSilentTokenRefresh();
  </script>
