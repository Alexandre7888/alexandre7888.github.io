<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CodeHUB · Plataforma</title>
  <link rel="icon" type="image/png" href="/InShot_20250807_112151490.jpg">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X4VF1LWB0F"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-X4VF1LWB0F')</script>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "5475922c-e999-4b42-b743-c7cde90db378",
        safari_web_id: "web.onesignal.auto.3a869b75-1942-4792-8237-9de8041a4c17",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true
      });
      window.__OneSignal = OneSignal;
      window.dispatchEvent(new Event("onesignal-ready"));
    });
  </script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root, html[data-theme="dark"]{
      --bg-1:#0a0e1a;--bg-2:#05070f;--canvas-bg:#0f1424;
      --surface:#101626;--surface-2:#151c30;
      --border:#1f2a44;--border-strong:#2d3b5c;
      --text:#e8eef8;--text-2:#8fa0bd;
      --accent:#4f8cff;--accent-2:#7aa8ff;
      --accent-glow:rgba(79,140,255,0.35);
      --accent-soft:rgba(79,140,255,0.1);
      --shadow:rgba(0,0,0,0.55);
      --menu-bg:rgba(10,15,28,0.9);
      --toggle-bg:#151c30;--toggle-border:#2d3b5c;
    }

    html[data-theme="light"]{
      --bg-1:#f7f9fc;--bg-2:#eef2f8;--canvas-bg:#ffffff;
      --surface:#ffffff;--surface-2:#f5f8fd;
      --border:#e2e8f2;--border-strong:#c8d3e5;
      --text:#0f172a;--text-2:#5b6b85;
      --accent:#2563eb;--accent-2:#3b82f6;
      --accent-glow:rgba(37,99,235,0.25);
      --accent-soft:rgba(37,99,235,0.07);
      --shadow:rgba(15,23,42,0.08);
      --menu-bg:rgba(255,255,255,0.92);
      --toggle-bg:#f1f5fb;--toggle-border:#d6e0ee;
    }

    body{
      background:radial-gradient(circle at 30% 20%,var(--bg-1),var(--bg-2));
      font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
      color:var(--text);min-height:100vh;display:flex;flex-direction:column;
      transition:background .4s ease,color .3s ease;
    }

    /* ===== ÁREA CENTRAL (FEED) ===== */
    .content-wrap{
      flex:1;display:flex;flex-direction:column;align-items:center;
      padding:20px;margin-top:20px;
    }

    .feed-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }

    .create-post {
      background: var(--surface); border-radius: 16px; padding: 16px;
      box-shadow: 0 8px 24px var(--shadow); border: 1px solid var(--border);
    }
    .create-post textarea {
      width: 100%; border: none; resize: none; outline: none; font-size: 15px;
      background: transparent; color: var(--text); min-height: 60px; font-family: inherit;
    }
    .create-post textarea::placeholder { color: var(--text-2); }
    .create-post .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
    
    .btn-post {
      background: var(--accent); color: white; border: none; padding: 8px 24px;
      border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit;
    }
    .btn-post:disabled { background: var(--surface-2); color: var(--text-2); cursor: not-allowed; }
    .btn-post:not(:disabled):hover { background: var(--accent-2); }

    .post {
      background: var(--surface); border-radius: 16px; padding: 16px;
      box-shadow: 0 8px 24px var(--shadow); border: 1px solid var(--border);
    }
    .post-header { display: flex; align-items: center; margin-bottom: 12px; }
    .post-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--surface-2); margin-right: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--text-2); }
    .post-user-info { display: flex; flex-direction: column; }
    .post-user-name { font-weight: 600; font-size: 15px; color: var(--text); }
    .post-time { color: var(--text-2); font-size: 12px; }
    .post-content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; color: var(--text); }
    .post-image { width: 100%; border-radius: 12px; margin-top: 12px; object-fit: cover; max-height: 500px; }
    
    .post-actions { display: flex; gap: 16px; margin-top: 16px; color: var(--text-2); font-size: 14px; align-items: center; }
    .action-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; transition: color 0.2s; background: none; border: none; color: inherit; font-family: inherit; font-size: 14px; padding: 0; }
    .action-btn:hover { color: var(--accent); }
    .action-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .action-btn.liked svg { fill: #ff4b4b; stroke: #ff4b4b; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .comments-section { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; display: none; }
    .comment-item { font-size: 13px; margin-bottom: 8px; background: var(--surface-2); padding: 8px 12px; border-radius: 8px; }
    .input-comment { width: 100%; background: var(--bg-1); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px; margin-top: 8px; outline: none; }

  </style>
</head>
<body>

  <!-- Área central onde vai o Feed -->
  <div class="content-wrap">
    <div class="feed-container">
      
      <!-- Caixa de postagem -->
      <div class="create-post" id="createPostBox" style="display:none;">
        <textarea id="postText" placeholder="O que está acontecendo?"></textarea>
        <input type="file" id="postFile" accept="image/*" style="margin-top: 10px; font-size: 12px; color: var(--text-2);">
        <div class="actions">
          <span id="statusPost" style="font-size: 12px; color: var(--text-2);"></span>
          <button class="btn-post" id="btnPost" disabled>Publicar</button>
        </div>
      </div>

      <!-- Feed de posts -->
      <div id="feed"></div>

    </div>
  </div>

  <script>
    window.WORKER_URL = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";
  </script>

  <!-- Carrega o AppShell -->
  <script src="/app-shell.js"></script>

  <script type="module">
    // --- Inicializa o AppShell ---
    if (typeof AppShell !== "undefined") {
      try { new AppShell().mount(); } catch (e) { console.error("[CodeHUB] AppShell.mount():", e.message); }
    }

    // --- Firebase Auth e Feed ---
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, query, limitToLast, onChildAdded, onValue, set, remove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    const cfg = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:1ac651348e624f6be41b32"
    };

    const app = initializeApp(cfg);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const createPostBox = document.getElementById('createPostBox');
    const postText = document.getElementById('postText');
    const postFile = document.getElementById('postFile');
    const btnPost = document.getElementById('btnPost');
    const statusPost = document.getElementById('statusPost');
    const feedDiv = document.getElementById('feed');

    let currentToken = null;
    let userUid = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        userUid = user.uid;
        currentToken = await user.getIdToken();
        createPostBox.style.display = 'block';
        carregarFeed();
      } else {
        createPostBox.style.display = 'none';
        feedDiv.innerHTML = '<p style="text-align:center;color:var(--text-2);">Faça login para ver o feed.</p>';
      }
    });

    function checkFields() {
      btnPost.disabled = postText.value.trim() === "" && postFile.files.length === 0;
    }
    postText.addEventListener('input', checkFields);
    postFile.addEventListener('change', checkFields);

    // Criar Post (Ainda passa pelo Worker, pois as regras bloqueiam a criação direta)
    btnPost.addEventListener('click', async () => {
      if (!currentToken) return;
      btnPost.disabled = true;
      btnPost.textContent = 'Enviando...';
      statusPost.textContent = "Fazendo upload...";

      const formData = new FormData();
      formData.append("tokenid", currentToken);
      formData.append("text", postText.value);
      if (postFile.files.length > 0) formData.append("file", postFile.files[0]);

      try {
        const res = await fetch(window.WORKER_URL + '/api/social/post', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.ok) {
          statusPost.textContent = "✅ Post criado!";
          postText.value = '';
          postFile.value = '';
          renderPost(data.post);
        } else {
          throw new Error(data.erro);
        }
      } catch (e) {
        statusPost.textContent = "❌ Erro: " + e.message;
      }

      btnPost.textContent = 'Publicar';
      btnPost.disabled = false;
    });

    function carregarFeed() {
      const feedQuery = query(ref(db, 'posts'), limitToLast(20));
      onChildAdded(feedQuery, (snapshot) => {
        renderPost(snapshot.val());
      });
    }

    function renderPost(post) {
      if (document.getElementById(`post-${post.id}`)) return;

      const postEl = document.createElement('div');
      postEl.className = 'post';
      postEl.id = `post-${post.id}`;

      const date = new Date(post.createdAt).toLocaleString('pt-BR');
      const imgSrc = post.mediaUrl && currentToken 
        ? `${post.mediaUrl}?tokenid=${encodeURIComponent(currentToken)}` 
        : null;

      const svgHeart = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
      const svgComment = `<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>`;

      postEl.innerHTML = `
        <div class="post-header">
          <div class="post-avatar">${post.uid.charAt(0).toUpperCase()}</div>
          <div class="post-user-info">
            <span class="post-user-name">${post.uid}</span>
            <span class="post-time">${date}</span>
          </div>
        </div>
        <div class="post-content">${post.text}</div>
        ${imgSrc ? `<img src="${imgSrc}" class="post-image" alt="Mídia do post">` : ''}
        
        <div class="post-actions">
          <button class="action-btn" id="btn-like-${post.id}" onclick="curtir('${post.id}')">
            ${svgHeart} <span id="likes-${post.id}">${post.likesCount || 0}</span>
          </button>
          <button class="action-btn" onclick="toggleComments('${post.id}')">
            ${svgComment} <span id="comments-count-${post.id}">${post.commentsCount || 0}</span>
          </button>
        </div>

        <div class="comments-section" id="comments-${post.id}">
          <div id="comments-list-${post.id}"></div>
          <div style="display: flex; gap: 8px; margin-top: 8px;">
            <input type="text" class="input-comment" id="input-comment-${post.id}" placeholder="Escreva um comentário..." onkeypress="if(event.key === 'Enter') comentar('${post.id}')">
            <button class="btn-post" id="btn-comment-${post.id}" onclick="comentar('${post.id}')">Enviar</button>
          </div>
          <p id="error-comment-${post.id}" style="color:#ff4b4b; font-size:12px; margin-top:4px; display:none;"></p>
        </div>
      `;
      feedDiv.prepend(postEl);

      // ⚡ A MÁGICA DA CURTIDA DIRETO DO FIREBASE
      if (userUid) {
        onValue(ref(db, `posts/${post.id}/likes`), (snapshot) => {
          const likes = snapshot.val() || {};
          const btn = document.getElementById(`btn-like-${post.id}`);
          const countSpan = document.getElementById(`likes-${post.id}`);
          
          if (!btn || !countSpan) return;

          const total = Object.keys(likes).length;
          const jaCurtiu = !!likes[userUid];

          countSpan.textContent = total;
          if (jaCurtiu) btn.classList.add('liked');
          else btn.classList.remove('liked');
        });
      }
    }

    // =========================================
    // CURTIR DIRETO NO FIREBASE
    // =========================================
    window.curtir = async function(postId) {
      if (!userUid) return;
      const btn = document.getElementById(`btn-like-${postId}`);
      btn.disabled = true; // Evita cliques duplos

      try {
        const likeRef = ref(db, `posts/${postId}/likes/${userUid}`);
        
        // Verifica se já curtiu
        const snapshot = await new Promise(res => onValue(likeRef, res, { onlyOnce: true }));

        if (snapshot.exists()) {
          // Se já curtiu, remove (Unlike)
          await remove(likeRef);
        } else {
          // Se não curtiu, adiciona
          await set(likeRef, true);
        }
      } catch (e) {
        alert("Erro ao curtir: " + e.message);
      }
      
      btn.disabled = false;
    };

    window.toggleComments = function(postId) {
      const el = document.getElementById(`comments-${postId}`);
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    };

    // =========================================
    // COMENTAR (Ainda via Worker para o Anti-Spam)
    // =========================================
    window.comentar = async function(postId) {
      const input = document.getElementById(`input-comment-${postId}`);
      const btn = document.getElementById(`btn-comment-${postId}`);
      const errorEl = document.getElementById(`error-comment-${postId}`);
      const text = input.value.trim();
      
      if (!text || !currentToken) return;

      btn.disabled = true;
      btn.textContent = '...';
      errorEl.style.display = 'none';

      try {
        const res = await fetch(window.WORKER_URL + '/api/social/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, postId: postId, text: text })
        });
        const data = await res.json();
        
        if (data.ok) {
          input.value = '';
          document.getElementById(`comments-count-${postId}`).textContent = data.total;
          const list = document.getElementById(`comments-list-${postId}`);
          const div = document.createElement('div');
          div.className = 'comment-item';
          div.textContent = text;
          list.appendChild(div);
        } else {
          errorEl.textContent = data.erro || "Erro ao comentar.";
          errorEl.style.display = 'block';
        }
      } catch (e) {
        errorEl.textContent = "Erro de conexão.";
        errorEl.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Enviar';
    };
  </script>
</body>
</html>
