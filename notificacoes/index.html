<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações · CodeHUB</title>
  <link rel="icon" type="image/png" href="https://alexandre7888.github.io/InShot_20250807_112151490.jpg">

  <!-- ===== ONESIGNAL ===== -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "5475922c-e999-4b42-b743-c7cde90db378",
        safari_web_id: "web.onesignal.auto.3a869b75-1942-4792-8237-9de8041a4c17",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true
      });
      window.__OneSignal = OneSignal;
      window.dispatchEvent(new Event("onesignal-ready"));
    });
  </script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root{
      --bg-1:#0a0e1a;--bg-2:#05070f;
      --surface:#101626;--surface-2:#151c30;
      --border:#1f2a44;--border-strong:#2d3b5c;
      --text:#e8eef8;--text-2:#8fa0bd;
      --accent:#4f8cff;--accent-2:#7aa8ff;
      --accent-glow:rgba(79,140,255,0.35);
      --shadow:rgba(0,0,0,0.55);
      --success:#22c55e;
      --danger:#ef4444;
    }

    html, body{
      height:100%;
      font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
      background:radial-gradient(circle at 30% 20%,var(--bg-1),var(--bg-2));
      color:var(--text);
      overflow:hidden;
    }

    .wrap{
      height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
      gap:28px;
      text-align:center;
    }

    .icon-top{
      width:110px;height:110px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 60px var(--accent-glow);
      animation:pulse 2.2s ease-in-out infinite;
    }
    .icon-top svg{
      width:56px;height:56px;
      stroke:#fff;fill:none;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;
    }
    @keyframes pulse{
      0%,100%{transform:scale(1);box-shadow:0 0 60px var(--accent-glow)}
      50%{transform:scale(1.06);box-shadow:0 0 90px var(--accent-glow)}
    }

    h1{
      font-size:1.9rem;
      font-weight:700;
      letter-spacing:-.5px;
      line-height:1.2;
      max-width:600px;
    }
    h1 span{color:var(--accent-2)}

    p.sub{
      color:var(--text-2);
      font-size:1rem;
      max-width:520px;
      line-height:1.6;
    }

    /* ===== BOTÃO PRINCIPAL ===== */
    .big-btn{
      position:relative;
      width:min(320px, 80vw);
      height:min(320px, 80vw);
      border-radius:50%;
      border:none;
      cursor:pointer;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff;
      font-family:inherit;
      font-size:1.4rem;
      font-weight:700;
      letter-spacing:.5px;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:12px;
      box-shadow:
        0 20px 60px var(--accent-glow),
        0 0 0 0 rgba(79,140,255,.6);
      transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
      animation:ring 2.5s infinite;
      overflow:hidden;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .big-btn::before{
      content:'';
      position:absolute;inset:-2px;
      border-radius:50%;
      background:conic-gradient(from 0deg, transparent, rgba(255,255,255,.35), transparent 30%);
      animation:spin 4s linear infinite;
      z-index:0;
    }
    .big-btn > *{position:relative;z-index:1}
    .big-btn:hover{transform:scale(1.05)}
    .big-btn:active{transform:scale(.96)}
    .big-btn:disabled{
      cursor:default;
      background:linear-gradient(135deg,#334155,#475569);
      animation:none;
      box-shadow:0 20px 60px rgba(0,0,0,.4);
    }
    .big-btn:disabled::before{display:none}

    .big-btn svg{
      width:64px;height:64px;
      stroke:#fff;fill:none;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;
      filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));
    }

    @keyframes ring{
      0%{box-shadow:0 20px 60px var(--accent-glow),0 0 0 0 rgba(79,140,255,.55)}
      70%{box-shadow:0 20px 60px var(--accent-glow),0 0 0 30px rgba(79,140,255,0)}
      100%{box-shadow:0 20px 60px var(--accent-glow),0 0 0 0 rgba(79,140,255,0)}
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ===== STATUS ===== */
    .status{
      min-height:24px;
      font-size:.9rem;
      font-weight:500;
      color:var(--text-2);
      transition:color .3s;
    }
    .status.ok{color:var(--success)}
    .status.err{color:var(--danger)}
    .status.loading{color:var(--accent-2)}

    /* ===== BOTÃO VOLTAR ===== */
    .back{
      position:fixed;top:18px;left:18px;
      display:flex;align-items:center;gap:8px;
      padding:10px 16px;
      background:rgba(10,15,28,.9);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border:1px solid var(--border);
      border-radius:14px;
      color:var(--text);
      font-family:inherit;font-size:.85rem;font-weight:500;
      cursor:pointer;text-decoration:none;
      transition:.2s;
      z-index:10;
    }
    .back:hover{border-color:var(--accent);color:var(--accent-2);transform:translateX(-3px)}
    .back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

    /* ===== AVISO NÃO LOGADO ===== */
    .not-logged{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:24px;
      padding:28px 32px;
      max-width:480px;
      box-shadow:0 20px 45px -10px var(--shadow);
    }
    .not-logged h2{color:var(--danger);font-size:1.2rem;margin-bottom:10px}
    .not-logged p{color:var(--text-2);font-size:.9rem;line-height:1.5}
    .not-logged a{
      display:inline-block;margin-top:16px;
      padding:10px 22px;border-radius:12px;
      background:var(--accent);color:#fff;
      text-decoration:none;font-weight:600;font-size:.9rem;
      transition:.2s;
    }
    .not-logged a:hover{background:var(--accent-2);transform:translateY(-2px)}

    .hidden{display:none !important}

    @media(max-width:550px){
      h1{font-size:1.5rem}
      p.sub{font-size:.9rem}
      .icon-top{width:88px;height:88px}
      .icon-top svg{width:44px;height:44px}
      .big-btn{font-size:1.2rem}
      .big-btn svg{width:52px;height:52px}
    }
  </style>
</head>
<body>

  <a href="/" class="back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Voltar
  </a>

  <div class="wrap">

    <!-- Estado 1: NÃO LOGADO -->
    <div id="notLogged" class="not-logged hidden">
      <h2>Você não está logado</h2>
      <p>Faça login para poder ativar as notificações push neste dispositivo.</p>
      <a href="/">Ir para o login</a>
    </div>

    <!-- Estado 2: LOGADO -->
    <div id="content" class="hidden" style="display:contents">

      <div class="icon-top">
        <svg viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
      </div>

      <h1>Ativar <span>notificações</span> push</h1>

      <p class="sub">
        Receba avisos em tempo real sobre novidades, atualizações e mensagens
        importantes do <strong>CodeHUB</strong> diretamente neste dispositivo.
      </p>

      <button class="big-btn" id="acceptBtn">
        <svg viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        ATIVAR NOTIFICAÇÕES
      </button>

      <div class="status" id="status"></div>

    </div>

  </div>

  <!-- ===== FIREBASE ===== -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, set, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:1ac651348e624f6be41b32"
    };

    const app  = getApps().length ? getApps()[0] : initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getDatabase(app);

    const elNotLogged = document.getElementById("notLogged");
    const elContent   = document.getElementById("content");
    const elBtn       = document.getElementById("acceptBtn");
    const elStatus    = document.getElementById("status");

    let currentUser = null;

    function setStatus(msg, type = ""){
      elStatus.textContent = msg;
      elStatus.className = "status" + (type ? " " + type : "");
    }

    // ===== OBSERVA LOGIN =====
    onAuthStateChanged(auth, (user) => {
      currentUser = user;

      if (!user) {
        elNotLogged.classList.remove("hidden");
        elContent.classList.add("hidden");
        return;
      }

      elNotLogged.classList.add("hidden");
      elContent.classList.remove("hidden");

      // Se já tem permissão concedida, mostra status
      if (window.Notification && Notification.permission === "granted") {
        setStatus("✅ Notificações já estão ativadas neste dispositivo.", "ok");
        elBtn.disabled = true;
        elBtn.innerHTML = `
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          ATIVADO
        `;
        // mesmo já ativado, garante que o ID tá salvo no Firebase
        saveSubscriptionId();
      } else if (window.Notification && Notification.permission === "denied") {
        setStatus("❌ Permissão bloqueada. Libere nas configurações do navegador.", "err");
      }
    });

    // ===== SALVA O SUBSCRIPTION ID NO FIREBASE =====
    async function saveSubscriptionId(){
      if (!currentUser) return null;

      const os = window.__OneSignal;
      if (!os) {
        setStatus("⏳ Aguardando OneSignal...", "loading");
        return null;
      }

      try {
        // Pega o ID de inscrição (Player ID)
        const subId = os.User?.PushSubscription?.id
                   || (await os.getUserId?.())
                   || os.User?.onesignalId;

        if (!subId) {
          setStatus("⚠️ Não foi possível obter o ID de inscrição.", "err");
          return null;
        }

        // Salva em users/{uid}/notification_ids/{subscriptionId}
        const idRef = ref(db, `users/${currentUser.uid}/notification_ids/${subId}`);
        await set(idRef, {
          subscription_id: subId,
          user_agent: navigator.userAgent,
          platform: navigator.platform || "unknown",
          language: navigator.language || "unknown",
          created_at: serverTimestamp(),
          last_seen: serverTimestamp()
        });

        // Também guarda o uid no OneSignal para identificar o usuário
        try {
          await os.login(currentUser.uid);
        } catch(e){ /* login já feito ou falhou, ignora */ }

        console.log("[Notificações] ID salvo:", subId);
        return subId;

      } catch (e) {
        console.error("[Notificações] Erro ao salvar:", e);
        setStatus("❌ Erro ao salvar ID: " + e.message, "err");
        return null;
      }
    }

    // ===== BOTÃO PRINCIPAL =====
    elBtn.addEventListener("click", async () => {
      if (!currentUser){
        setStatus("Você precisa estar logado.", "err");
        return;
      }

      elBtn.disabled = true;
      setStatus("⏳ Solicitando permissão...", "loading");

      try {
        const os = window.__OneSignal;
        if (!os) throw new Error("OneSignal ainda não carregou. Tente novamente.");

        // 1) Pede permissão nativa do navegador
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          setStatus("❌ Permissão negada pelo usuário.", "err");
          elBtn.disabled = false;
          return;
        }

        // 2) Ativa o push no OneSignal (dispara o registro do dispositivo)
        await os.User.PushSubscription.optIn();

        // 3) Espera o subscription id aparecer (pode demorar alguns ms)
        let subId = os.User?.PushSubscription?.id;
        let tries = 0;
        while (!subId && tries < 30){
          await new Promise(r => setTimeout(r, 300));
          subId = os.User?.PushSubscription?.id;
          tries++;
        }

        // 4) Salva no Firebase
        const saved = await saveSubscriptionId();

        if (saved){
          setStatus("🎉 Notificações ativadas com sucesso!", "ok");
          elBtn.innerHTML = `
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            ATIVADO
          `;
        } else {
          setStatus("⚠️ Permissão concedida, mas não conseguimos salvar o ID.", "err");
          elBtn.disabled = false;
        }

      } catch (e){
        console.error(e);
        setStatus("❌ Erro: " + e.message, "err");
        elBtn.disabled = false;
      }
    });

    // ===== SE O ONESIGNAL JÁ ESTIVER PRONTO, SALVA AUTOMÁTICO =====
    window.addEventListener("onesignal-ready", () => {
      if (currentUser && window.Notification?.permission === "granted"){
        saveSubscriptionId();
      }
    });
  </script>

  <!-- ===== APP-SHELL (menu lateral + perfil) ===== -->
  <script src="https://alexandre7888.github.io/app-shell.js"></script>
  <script>
    new AppShell().mount();
  </script>

</body>
</html>
