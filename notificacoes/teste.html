<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações · CodeHUB</title>
  <link rel="icon" href="/InShot_20250807_112151490.jpg">
  <style>
    :root { --bg:#0a0e1a; --surface:#101626; --border:#1f2a44; --text:#e8eef8; --text2:#8fa0bd; --accent:#4f8cff; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:radial-gradient(circle at 30% 20%, #0a0e1a, #05070f); font-family:'Segoe UI',sans-serif; color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:32px; max-width:420px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
    .icon { width:64px; height:64px; border-radius:16px; background:rgba(79,140,255,0.1); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; color:var(--accent); }
    .icon svg { width:32px; height:32px; stroke:currentColor; fill:none; stroke-width:2; }
    h1 { font-size:1.3rem; margin-bottom:8px; }
    p { color:var(--text2); font-size:0.9rem; line-height:1.5; margin-bottom:24px; }
    .btn { background:var(--accent); color:#fff; border:none; border-radius:12px; padding:14px 24px; font-size:1rem; font-weight:600; cursor:pointer; width:100%; transition:0.2s; display:flex; align-items:center; justify-content:center; gap:10px; }
    .btn:hover:not(:disabled) { filter:brightness(1.1); }
    .btn:disabled { opacity:0.6; cursor:not-allowed; }
    .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .status { font-size:0.8rem; margin-top:16px; min-height:20px; }
    .status.ok { color:#4caf50; }
    .status.err { color:#f44336; }
    .status.info { color:var(--text2); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>
    <h1>Notificações push</h1>
    <p>Ative para receber alertas de compartilhamento, novos arquivos e novidades do CodeHUB.</p>
    <button class="btn" id="btnSubscribe">
      <span id="btnText">Ativar notificações</span>
    </button>
    <div class="status" id="status"></div>
  </div>

  <script>
    window.WORKER_URL = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";
  </script>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "5475922c-e999-4b42-b743-c7cde90db378",
        safari_web_id: "web.onesignal.auto.3a869b75-1942-4792-8237-9de8041a4c17",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true
      });
      window.__OneSignal = OneSignal;
      window.dispatchEvent(new Event("onesignal-ready"));
    });
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const cfg = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      projectId: "html-15e80",
      appId: "1:1068148640439:web:1ac651348e624f6be41b32"
    };
    const app = initializeApp(cfg);
    const auth = getAuth(app);

    const btn = document.getElementById("btnSubscribe");
    const btnText = document.getElementById("btnText");
    const status = document.getElementById("status");
    let currentToken = null;

    function setLoading(on) {
      btn.disabled = on;
      btnText.innerHTML = on ? '<span class="spinner"></span> Verificando...' : 'Ativar notificações';
    }
    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = "status " + (type || "");
    }

    // Espera o Firebase Auth e o OneSignal
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        setStatus("Faça login para ativar notificações.", "err");
        btn.disabled = true;
        return;
      }
      currentToken = await user.getIdToken();
      btn.disabled = false;

      // Se já tem subscription salva, verifica status
      verificarStatusExistente();
    });

    async function verificarStatusExistente() {
      if (!window.__OneSignal || !currentToken) return;
      try {
        const subId = window.__OneSignal.User.PushSubscription.id;
        if (!subId) return;
        const r = await fetch(`${window.WORKER_URL}/api/notification/status?tokenid=${encodeURIComponent(currentToken)}&subid=${encodeURIComponent(subId)}`);
        const d = await r.json();
        if (d.ok && d.subscribed) {
          setStatus("Notificações já ativadas neste dispositivo.", "ok");
          btnText.textContent = "Notificações ativas";
          btn.disabled = true;
        }
      } catch (e) {}
    }

    btn.addEventListener("click", async () => {
      if (!window.__OneSignal) return setStatus("OneSignal ainda carregando...", "err");

      setLoading(true);
      setStatus("Solicitando permissão...", "info");

      try {
        // 1) Pede permissão nativa do navegador
        const permission = await window.__OneSignal.Notifications.requestPermission();
        if (!permission) {
          setLoading(false);
          return setStatus("Permissão negada. Ative nas configurações do navegador.", "err");
        }

        setStatus("Obtendo ID de inscrição...", "info");

        // 2) Pega o Subscription ID (pode demorar um pouco após permissão)
        let subId = null;
        for (let i = 0; i < 10; i++) {
          subId = window.__OneSignal.User.PushSubscription.id;
          if (subId) break;
          await new Promise(r => setTimeout(r, 300));
        }

        if (!subId) {
          setLoading(false);
          return setStatus("Não foi possível obter o ID. Tente novamente.", "err");
        }

        setStatus("Verificando no servidor...", "info");

        // 3) Envia pro worker validar e salvar no Firebase
        const r = await fetch(`${window.WORKER_URL}/api/notification/subscribe`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            tokenid: currentToken,
            subscriptionId: subId
          })
        });
        const d = await r.json();

        setLoading(false);

        if (!d.ok) {
          return setStatus(d.error || "Falha ao validar inscrição.", "err");
        }

        setStatus("Notificações ativadas com sucesso!", "ok");
        btnText.textContent = "Notificações ativas";
        btn.disabled = true;

      } catch (e) {
        setLoading(false);
        setStatus("Erro: " + e.message, "err");
      }
    });
  </script>
</body>
</html>
