<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Notificação · CodeHUB</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;
      font-family:'Segoe UI',system-ui,sans-serif;
      background:radial-gradient(circle at 30% 20%,#0a0e1a,#05070f);
      color:#e8eef8;
      display:flex;align-items:center;justify-content:center;
      padding:20px;
    }
    .box{
      width:100%;max-width:420px;
      background:#101626;
      border:1px solid #1f2a44;
      border-radius:20px;
      padding:24px;
      box-shadow:0 20px 50px rgba(0,0,0,.5);
    }
    h1{
      font-size:1.1rem;
      margin-bottom:20px;
      display:flex;align-items:center;gap:8px;
    }
    h1 svg{width:20px;height:20px;stroke:#4f8cff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    label{display:block;font-size:.75rem;color:#8fa0bd;margin-bottom:6px;font-weight:600}
    input,textarea{
      width:100%;padding:10px 12px;
      background:#151c30;border:1.5px solid #1f2a44;border-radius:10px;
      color:#e8eef8;font-family:inherit;font-size:.85rem;
      margin-bottom:14px;outline:none;transition:.2s;
      word-break:break-all;
    }
    input:focus,textarea:focus{border-color:#4f8cff;box-shadow:0 0 0 3px rgba(79,140,255,.15)}
    textarea{resize:vertical;min-height:60px;line-height:1.4}
    .btn{
      width:100%;padding:13px;border:none;border-radius:12px;
      color:#fff;font-family:inherit;font-size:.9rem;font-weight:700;
      cursor:pointer;transition:.2s;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn:active:not(:disabled){transform:scale(.98)}
    .btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .btn-primary{background:linear-gradient(135deg,#4f8cff,#7aa8ff);box-shadow:0 8px 24px rgba(79,140,255,.35);margin-bottom:12px}
    .btn-primary:hover:not(:disabled){transform:translateY(-2px)}
    .btn-success{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 8px 24px rgba(34,197,94,.35)}
    .btn-success:hover:not(:disabled){transform:translateY(-2px)}
    .status{
      margin-top:6px;padding:11px 14px;border-radius:10px;
      font-size:.78rem;display:none;line-height:1.5;word-break:break-word;
    }
    .status.show{display:block}
    .status.ok{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
    .status.err{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
    .status.load{background:rgba(79,140,255,.12);color:#7aa8ff;border:1px solid rgba(79,140,255,.3)}
    .loader{
      width:16px;height:16px;
      border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;
      border-radius:50%;animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="box">
  <h1>
    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    Teste de Notificação
  </h1>

  <label>URL do Worker</label>
  <input type="url" id="workerUrl" placeholder="https://seu-worker.workers.dev">

  <label>UID do Usuário</label>
  <input type="text" id="uid" placeholder="Ex: abc123xyz (uid do Firebase)">

  <button class="btn btn-primary" id="btnGen">
    <svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
    GERAR TOKEN
  </button>

  <label>Token</label>
  <input type="text" id="tokenid" readonly placeholder="Clique em GERAR TOKEN">

  <label>Título</label>
  <input type="text" id="title" value="Teste CodeHUB">

  <label>Mensagem</label>
  <textarea id="message">Olá! Isso é um teste 🎉</textarea>

  <button class="btn btn-success" id="btnSend">
    <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    ENVIAR NOTIFICAÇÃO
  </button>

  <div class="status" id="status"></div>
</div>

<script>
  const elWorkerUrl = document.getElementById("workerUrl");
  const elUid       = document.getElementById("uid");
  const elTokenId   = document.getElementById("tokenid");
  const elTitle     = document.getElementById("title");
  const elMessage   = document.getElementById("message");
  const elBtnGen    = document.getElementById("btnGen");
  const elBtnSend   = document.getElementById("btnSend");
  const elStatus    = document.getElementById("status");

  // Persistência
  elWorkerUrl.value = localStorage.getItem("ch_worker") || "";
  elUid.value       = localStorage.getItem("ch_uid") || "";
  elWorkerUrl.addEventListener("input", () => localStorage.setItem("ch_worker", elWorkerUrl.value.trim()));
  elUid.addEventListener("input",       () => localStorage.setItem("ch_uid",    elUid.value.trim()));

  function base(){
    const v = elWorkerUrl.value.trim().replace(/\/+$/, "");
    if (!v) throw new Error("Preencha a URL do Worker");
    return v;
  }
  function setStatus(msg, type){
    elStatus.className = "status show " + type;
    elStatus.innerHTML = msg;
  }

  // ============== GERAR TOKEN ==============
  elBtnGen.addEventListener("click", async () => {
    const uid = elUid.value.trim();
    if (!uid){ setStatus("Preencha o UID.", "err"); return; }

    elBtnGen.disabled = true;
    elBtnGen.innerHTML = `<div class="loader"></div> Gerando...`;
    setStatus("Gerando token...", "load");

    try {
      const r = await fetch(`${base()}/GenerateUserToken`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid })
      });
      const data = await r.json();

      if (!r.ok || !data.ok) throw new Error(data.erro || "Erro");

      elTokenId.value = data.token;
      setStatus(`✅ Token gerado para UID <code>${data.uid}</code>`, "ok");

    } catch (e){
      setStatus(`❌ ${e.message}`, "err");
    } finally {
      elBtnGen.disabled = false;
      elBtnGen.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> GERAR TOKEN`;
    }
  });

  // ============== ENVIAR ==============
  elBtnSend.addEventListener("click", async () => {
    const tokenid = elTokenId.value.trim();
    const title   = elTitle.value.trim();
    const message = elMessage.value.trim();

    if (!tokenid){ setStatus("Gere o token primeiro.", "err"); return; }
    if (!title || !message){ setStatus("Preencha título e mensagem.", "err"); return; }

    elBtnSend.disabled = true;
    elBtnSend.innerHTML = `<div class="loader"></div> Enviando...`;
    setStatus("Enviando...", "load");

    try {
      const r = await fetch(`${base()}/SendNotification?tokenid=${encodeURIComponent(tokenid)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, message })
      });
      const data = await r.json();

      if (!r.ok || !data.ok) throw new Error(data.erro || "Erro");

      setStatus(
        `🎉 Enviada!<br>` +
        `• Dispositivos: <strong>${data.total_dispositivos}</strong><br>` +
        `• Entregues: <strong>${data.recipients || 0}</strong>`,
        "ok"
      );

    } catch (e){
      setStatus(`❌ ${e.message}`, "err");
    } finally {
      elBtnSend.disabled = false;
      elBtnSend.innerHTML = `<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> ENVIAR NOTIFICAÇÃO`;
    }
  });
</script>

</body>
</html>
