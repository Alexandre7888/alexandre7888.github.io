<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste de Upload Social</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .box { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; }
    textarea, input { width: 100%; margin-bottom: 10px; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #4f8cff; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #333; color: #888; }
    #status { margin-top: 15px; font-size: 14px; text-align: center; }
    #preview { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
    .user-info { font-size: 12px; color: #888; text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="box">
  <h3>Testar Post</h3>
  
  <!-- Aviso de login -->
  <div class="user-info" id="userInfo">Verificando login...</div>
  
  <label>Texto do Post:</label>
  <textarea id="text" placeholder="Escreva algo..."></textarea>
  
  <label>Foto:</label>
  <input type="file" id="file" accept="image/*">
  
  <button id="btnPost" disabled>Publicar Post</button>
  
  <div id="status"></div>
  <img id="preview">
</div>

<!-- SDK do Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
  const WORKER_URL = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";
  
  const firebaseConfig = {
    apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
    authDomain: "html-15e80.firebaseapp.com",
    databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
    projectId: "html-15e80",
    storageBucket: "html-15e80.firebasestorage.app",
    messagingSenderId: "1068148640439",
    appId: "1:1068148640439:web:1ac651348e624f6be41b32"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  let currentUser = null;

  const btnPost = document.getElementById('btnPost');
  const textInput = document.getElementById('text');
  const fileInput = document.getElementById('file');
  const status = document.getElementById('status');
  const preview = document.getElementById('preview');
  const userInfo = document.getElementById('userInfo');

  // Habilita o botão se tiver texto ou foto
  function checkFields() {
    btnPost.disabled = textInput.value.trim() === "" && fileInput.files.length === 0;
  }
  textInput.addEventListener('input', checkFields);
  fileInput.addEventListener('change', checkFields);

  // Verifica se o usuário está logado
  auth.onAuthStateChanged((user) => {
    if (user) {
      currentUser = user;
      userInfo.innerHTML = `Logado como: <strong>${user.email || user.uid}</strong>`;
      checkFields();
    } else {
      currentUser = null;
      userInfo.innerHTML = `<span style="color: #ff4444;">Você não está logado. Faça login no app principal primeiro.</span>`;
      btnPost.disabled = true;
    }
  });

  btnPost.addEventListener('click', async () => {
    if (!currentUser) return;

    btnPost.disabled = true;
    status.textContent = "Gerando token e enviando...";

    try {
      // Pega o token automaticamente do Firebase
      const tokenid = await currentUser.getIdToken();

      const formData = new FormData();
      formData.append("tokenid", tokenid);
      formData.append("text", textInput.value);
      if (fileInput.files.length > 0) {
        formData.append("file", fileInput.files[0]);
      }

      const res = await fetch(WORKER_URL + '/api/social/post', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();

      if (data.ok) {
        status.textContent = "✅ Post criado com sucesso!";
        status.style.color = "#1db954";
        if (data.post.mediaUrl) {
          preview.src = data.post.mediaUrl;
          preview.style.display = 'block';
        }
        console.log("Post gerado:", data.post);
        
        // Limpa o formulário após o sucesso
        textInput.value = "";
        fileInput.value = "";
      } else {
        throw new Error(data.erro);
      }
    } catch (e) {
      status.textContent = "❌ Erro: " + e.message;
      status.style.color = "#ff4444";
    }

    btnPost.disabled = false;
  });
</script>

</body>
</html>
