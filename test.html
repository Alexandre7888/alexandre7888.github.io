<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desbloqueio Biométrico - Kloewa</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a0e1a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .box { background: #101626; padding: 30px; border-radius: 16px; border: 1px solid #1f2a44; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    h2 { margin-top: 0; color: #4f8cff; }
    p { color: #8fa0bd; font-size: 14px; margin-bottom: 20px; }
    button { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 16px; }
    .btn-primary { background: #4f8cff; color: #fff; }
    .btn-secondary { background: #1f2a44; color: #8fa0bd; }
    .btn-success { background: #22c55e; color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: 14px; margin-top: 20px; padding: 10px; border-radius: 8px; display: none; }
    .sucesso { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
    .erro { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
  </style>
</head>
<body>

  <div class="box">
    <h2>Segurança Biométrica</h2>
    <p>Use sua digital ou rosto para desbloquear ações sensíveis.</p>

    <div id="loginSection">
      <button class="btn-primary" id="btnLogin">Fazer Login com Google</button>
    </div>

    <div id="formSection" style="display: none;">
      <button class="btn-secondary" id="btnRegistrar">1. Cadastrar Biometria</button>
      <button class="btn-success" id="btnDesbloquear" disabled>2. Desbloquear com Biometria</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      projectId: "html-15e80",
      appId: "1:1068148640439:web:1ac651348e624f6be41b32"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const URL_REGISTRAR = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev/api/auth/register-bio";
    const URL_VERIFICAR = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev/api/auth/verify-bio";

    const btnLogin = document.getElementById('btnLogin');
    const btnRegistrar = document.getElementById('btnRegistrar');
    const btnDesbloquear = document.getElementById('btnDesbloquear');
    const loginSection = document.getElementById('loginSection');
    const formSection = document.getElementById('formSection');
    const statusEl = document.getElementById('status');

    let currentUser = null;

    function mostrarStatus(msg, tipo) {
      statusEl.style.display = "block";
      statusEl.textContent = msg;
      statusEl.className = "status " + tipo;
    }

    btnLogin.onclick = async () => {
      try { await signInWithPopup(auth, provider); } catch (err) { alert(err.message); }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loginSection.style.display = "none";
        formSection.style.display = "block";
      } else {
        currentUser = null;
        loginSection.style.display = "block";
        formSection.style.display = "none";
      }
    });

    // ==========================================
    // 1. CADASTRAR BIOMETRIA
    // ==========================================
    btnRegistrar.onclick = async () => {
      try {
        if (!window.PublicKeyCredential) throw new Error("WebAuthn não suportado.");

        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);

        // Cria a credencial biométrica
        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: challenge,
            rp: { name: "Kloewa" },
            user: { id: new Uint8Array(16), name: currentUser.email, displayName: currentUser.displayName },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }],
            authenticatorSelection: { userVerification: "preferred" },
            timeout: 60000,
            attestation: "none"
          }
        });

        if (credential) {
          mostrarStatus("Salvando no servidor...", "sucesso");
          const idToken = await currentUser.getIdToken();

          // Envia o ID da biometria para o Worker salvar
          const res = await fetch(URL_REGISTRAR, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tokenid: idToken, webauthnId: credential.id })
          });

          const data = await res.json();
          if (data.ok) {
            mostrarStatus("Biometria cadastrada com sucesso!", "sucesso");
            btnDesbloquear.disabled = false;
          } else {
            throw new Error(data.erro);
          }
        }
      } catch (err) {
        mostrarStatus("Erro: " + err.message, "erro");
      }
    };

    // ==========================================
    // 2. DESBLOQUEAR (VALIDAR BIOMETRIA)
    // ==========================================
    btnDesbloquear.onclick = async () => {
      try {
        mostrarStatus("Aguardando biometria...", "");
        
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);

        // Pede para o usuário autenticar
        const credential = await navigator.credentials.get({
          publicKey: {
            challenge: challenge,
            timeout: 60000,
            userVerification: "preferred"
          }
        });

        if (credential) {
          mostrarStatus("Validando no servidor...", "");
          const idToken = await currentUser.getIdToken();

          // Envia o ID de volta pro Worker conferir se é o mesmo
          const res = await fetch(URL_VERIFICAR, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tokenid: idToken, webauthnId: credential.id })
          });

          const data = await res.json();
          if (data.ok) {
            mostrarStatus("✅ Desbloqueado com sucesso!", "sucesso");
            // Aqui você pode liberar a ação (ex: redirecionar, mostrar dados, etc)
          } else {
            throw new Error(data.erro);
          }
        }
      } catch (err) {
        mostrarStatus("Acesso Negado: " + err.message, "erro");
      }
    };
  </script>
</body>
</html>
