<!DOCTYPE html>
<html>
<body>

<h2>Firebase Token → Cookie</h2>

<button onclick="salvarToken()">Enviar token para cookie</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
  authDomain: "html-15e80.firebaseapp.com",
  databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
  projectId: "html-15e80",
  storageBucket: "html-15e80.firebasestorage.app",
  messagingSenderId: "1068148640439",
  appId: "1:1068148640439:web:1ac651348e624f6be41b32",
  measurementId: "G-7E1VWN07GM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.salvarToken = async function() {

  await signInAnonymously(auth);

  const user = auth.currentUser;

  const token = await user.getIdToken();

  document.cookie =
    "firebaseToken=" + token +
    "; Domain=.codehub.site.je; Path=/; Secure; SameSite=Lax";

  alert("Token salvo no cookie compartilhado!");
};

</script>

</body>
</html>
