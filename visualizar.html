<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador</title>
  <style>
    :root { --bg: #0a0e1a; --text: #e8eef8; --accent: #4f8cff; }
    *{margin:0;padding:0;box-sizing:border-box}
    body { background: var(--bg); color: var(--text); font-family: sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    
    .player-container { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .player-header { padding: 15px 20px; background: rgba(10, 15, 28, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; position: absolute; top: 0; width: 100%; z-index: 10; }
    .player-header h2 { font-size: 1.1rem; }
    
    .media-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 60px 20px 20px 20px; }
    .media-wrapper img, .media-wrapper video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .media-wrapper iframe { width: 100%; height: 100%; border: none; }
    
    .error-screen { text-align: center; }
    .error-screen h2 { color: #ef4444; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="player-header" id="playerHeader" style="display:none;">
    <h2 id="fileName">Carregando...</h2>
    <span id="sharedBy" style="font-size: 0.8rem; color: #8fa0bd;"></span>
  </div>

  <div class="media-wrapper" id="mediaWrapper">
    <div class="error-screen" id="errorScreen">
      <h2>Autenticando...</h2>
    </div>
  </div>

  <script>
    window.WORKER_URL = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    const cfg = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:1ac651348e624f6be41b32"
    };

    const app = initializeApp(cfg);
    const auth = getAuth(app);

    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('id');
    const tokenUrl = urlParams.get('token');
    const ownerId = urlParams.get('owner'); // Se for arquivo de outra pessoa

    const mediaWrapper = document.getElementById('mediaWrapper');
    const fileName = document.getElementById('fileName');
    const playerHeader = document.getElementById('playerHeader');
    const sharedBy = document.getElementById('sharedBy');

    function mostrarErro(msg) {
      mediaWrapper.innerHTML = `<div class="error-screen"><h2>Acesso Negado</h2><p>${msg}</p></div>`;
    }

    onAuthStateChanged(auth, async (user) => {
      // Para segurança, usamos o token do Firebase logado, não o da URL se não for válido
      if (!user) {
        return mostrarErro("Você precisa estar logado para visualizar este arquivo.");
      }

      if (!fileId) {
        return mostrarErro("ID do arquivo não fornecido.");
      }

      const token = await user.getIdToken();

      try {
        // Faz uma chamada para o Worker para pegar os detalhes do arquivo (Tipo, Nome)
        // Usamos a rota de view para checar se tem permissão. Se der 200, a imagem carrega.
        let url = `${WORKER_URL}/api/workspace/view/${fileId}?tokenid=${encodeURIComponent(token)}`;
        if (ownerId) url += `&owner=${ownerId}`;

        // Tenta carregar os metadados fazendo um HEAD request primeiro (ou apenas carregando a mídia)
        // Como o Worker retorna o arquivo puro, não temos o nome/tipo em JSON aqui. 
        // Para simplificar, vamos carregar direto.
        
        playerHeader.style.display = 'flex';
        fileName.textContent = "Visualizando arquivo";
        
        // Descobre o tipo de arquivo pela extensão do nome ou tentamos renderizar
        // Como o Worker entrega o Content-Type correto, o navegador decide o que fazer.
        
        // Renderiza um player genérico
        mediaWrapper.innerHTML = `
          <video src="${url}" controls autoplay style="display:none;" id="vidPlayer"></video>
          <img src="${url}" alt="Arquivo" id="imgPlayer" style="display:none;">
          <iframe src="${url}" id="iframePlayer" style="display:none;"></iframe>
        `;

        // Tenta carregar como imagem, se falhar, tenta como vídeo, se falhar mostra link
        const img = document.getElementById('imgPlayer');
        const vid = document.getElementById('vidPlayer');
        const iframe = document.getElementById('iframePlayer');

        img.onload = () => { img.style.display = 'block'; vid.remove(); iframe.remove(); };
        img.onerror = () => {
          img.remove();
          vid.onloadedmetadata = () => { vid.style.display = 'block'; iframe.remove(); };
          vid.onerror = () => {
            vid.remove();
            iframe.style.display = 'block'; // Se for PDF, o iframe nativo do navegador resolve
          };
        };

      } catch (e) {
        mostrarErro("Erro ao carregar o arquivo. Ele pode estar restrito ou você não tem permissão.");
      }
    });
  </script>
</body>
</html>
