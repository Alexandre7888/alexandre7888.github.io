<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursor personalizado</title>

<style>
    html, body {
        cursor: url("images.png") 3 2, auto;
    }

    body {
        margin: 0;
        height: 100vh;
        background: #111;
        color: white;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .caixa {
        padding: 40px;
        background: #222;
        border-radius: 20px;
    }
</style>
</head>

<body>

<div class="caixa">
    <h1>🖱️ Cursor personalizado</h1>
    <p>Mova o mouse aqui.</p>
</div>

</body>
</html>
