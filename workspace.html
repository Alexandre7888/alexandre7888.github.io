<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeHUB · Workspace</title>
  <script src="/app-shell.js" defer></script>

  <style>
    :root { --bg-1:#0a0e1a;--bg-2:#05070f;--surface:#101626;--surface-2:#151c30;--border:#1f2a44;--text:#e8eef8;--text-2:#8fa0bd;--accent:#4f8cff;--shadow:rgba(0,0,0,0.55); }
    *{margin:0;padding:0;box-sizing:border-box}
    body{ background:radial-gradient(circle at 30% 20%,var(--bg-1),var(--bg-2)); font-family:'Segoe UI',sans-serif; color:var(--text); min-height:100vh; display:flex; flex-direction:column; padding:20px; align-items:center; }
    
    /* Correção rigorosa dos ícones */
    .btn-upload svg, .btn-folder svg { width: 18px !important; height: 18px !important; flex-shrink: 0; }
    .btn-delete-file { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; padding: 0; display: none; align-items: center; justify-content: center; background: rgba(239, 68, 68, 0.9); border: none; border-radius: 50%; cursor: pointer; z-index: 10;}
    .btn-delete-file svg { width: 14px !important; height: 14px !important; stroke: white; }
    .file-card:hover .btn-delete-file { display: flex; }

    /* Drop Zone */
    .drop-zone-overlay { position: fixed; inset: 0; background: rgba(10, 15, 28, 0.85); backdrop-filter: blur(8px); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; border: 4px dashed var(--accent); pointer-events: none; }
    .drop-zone-overlay.active { display: flex; }
    .drop-zone-overlay svg { width: 80px; height: 80px; stroke: var(--accent); fill: none; stroke-width: 1.5; margin-bottom: 20px; animation: bounce 1s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

    /* Layout Principal */
    .ws-header { display: flex; flex-direction: column; gap: 15px; background: var(--surface); padding: 20px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 900px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .search-bar { position: relative; width: 100%; }
    .search-bar input { width: 100%; padding: 12px 16px 12px 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-1); color: var(--text); outline: none; }
    .search-bar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--text-2); fill: none; stroke-width: 2; }

    .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; width: 100%; max-width: 900px; margin-top: 20px; }
    .file-card, .folder-card { background: var(--surface); border-radius: 12px; padding: 16px; border: 1px solid var(--border); text-align: center; position: relative; box-shadow: 0 4px 12px var(--shadow); transition: 0.2s; overflow: hidden; }
    .file-card:hover, .folder-card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .folder-card { cursor: pointer; }
    .file-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .icon-placeholder { width: 100%; height: 100px; background: var(--surface-2); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .icon-placeholder svg { width: 40px; height: 40px; stroke: var(--text-2); fill: none; stroke-width: 1.5; }

    /* Menus e Modais */
    .context-menu { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 1000; display: none; min-width: 190px; }
    .context-menu.active { display: block; }
    .context-menu-item { padding: 10px 16px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
    .context-menu-item:hover { background: var(--accent); color: white; }
    .context-menu-item.danger { color: #ef4444; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--surface); padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid var(--border); }
    .modal-box input, .modal-box select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-1); color: var(--text); margin-bottom: 12px; }
    .modal-box button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="drop-zone-overlay" id="dropZone">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <h2>Solte os arquivos para fazer upload</h2>
  </div>

  <div class="ws-header">
    <div class="header-top">
      <div>
        <h1 id="folderTitle">Meus Arquivos</h1>
        <p id="folderPath" style="color: var(--text-2); font-size: 0.9rem;">/</p>
      </div>
      <div style="display: flex; gap: 10px;">
        <button onclick="criarPasta()" style="background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;" class="btn-folder">
          <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
          Nova Pasta
        </button>
        <button onclick="document.getElementById('wsFileInput').click()" style="background: var(--accent); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;" class="btn-upload">
          <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload
        </button>
      </div>
    </div>
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Pesquisar..." oninput="filtrarItens()">
    </div>
    <input type="file" id="wsFileInput" multiple onchange="fazerUpload(this)" style="display: none;">
  </div>

  <div id="filesGrid" class="files-grid"></div>

  <div class="context-menu" id="contextMenu">
    <div class="context-menu-item" id="ctxMove" onclick="abrirModalMover()">Mover para...</div>
    <div class="context-menu-item" id="ctxRename" onclick="renomearItem()">Renomear</div>
    <div class="context-menu-item" id="ctxShare" onclick="gerarLinkPublico()">Copiar Link Público</div>
    <div class="context-menu-item" id="ctxPrivacy" onclick="mudarPrivacidade()">Privacidade</div>
    <div class="context-menu-item danger" id="ctxDelete" onclick="deletarItem()">Excluir</div>
  </div>

  <div class="modal-overlay" id="moveModal">
    <div class="modal-box">
      <h3>Mover Item</h3>
      <p style="font-size:0.85rem; color:var(--text-2); margin-bottom:10px;">Pasta de destino:</p>
      <select id="targetFolderSelect"></select>
      <button onclick="confirmarMover()">Mover</button>
      <button style="background: transparent; color: var(--text-2);" onclick="fecharModal('moveModal')">Cancelar</button>
    </div>
  </div>

  <script>
    window.WORKER_URL = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";
    window.VERCEL_URL = "https://api.codehub.giize.com";
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    const cfg = { apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo", authDomain: "html-15e80.firebaseapp.com", projectId: "html-15e80", appId: "1:1068148640439:web:1ac651348e624f6be41b32" };
    const app = initializeApp(cfg);
    const auth = getAuth(app);

    let currentToken = null;
    let itemSelecionado = null;
    let pastasGlobais = [];
    const filesGrid = document.getElementById('filesGrid');

    if (typeof AppShell !== "undefined") { try { new AppShell().mount(); } catch (e) {} }

    function getPastaAtual() { return window.location.hash.replace('#', '').replace('/', '') || "root"; }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentToken = await user.getIdToken();
        carregarArquivosAPI();
        window.addEventListener('hashchange', carregarArquivosAPI);
      }
    });

    async function carregarArquivosAPI() {
      const pasta = getPastaAtual();
      document.getElementById('folderTitle').textContent = pasta === "root" ? "Meus Arquivos" : pasta;
      
      try {
        const res = await fetch(`${window.WORKER_URL}/api/workspace/list?tokenid=${currentToken}&folder=${pasta}`);
        const data = await res.json();
        filesGrid.innerHTML = '';
        pastasGlobais = data.folders || [];
        
        if (data.files.length === 0 && data.folders.length === 0) {
          filesGrid.innerHTML = '<p style="color: var(--text-2); text-align: center; grid-column: 1/-1;">Pasta vazia.</p>';
          return;
        }
        data.folders.forEach(f => renderizarPasta(f));
        data.files.forEach(f => renderizarArquivo(f));
      } catch (e) { console.error(e); }
    }

    // --- DRAG & DROP BLINDADO ---
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => e.preventDefault());

    const dropZone = document.getElementById('dropZone');
    window.addEventListener('dragenter', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      if (e.relatedTarget === null) dropZone.classList.remove('active');
    });
    dropZone.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropZone.classList.remove('active');
      if (e.dataTransfer.files.length > 0) await uploadMultiplosArquivos(e.dataTransfer.files);
    });

    async function uploadMultiplosArquivos(files) {
      for (const file of files) {
        const formData = new FormData();
        formData.append('tokenid', currentToken);
        formData.append('file', file);
        formData.append('filename', file.name);
        formData.append('filetype', file.type);
        formData.append('folder', getPastaAtual());
        try {
          await fetch(window.WORKER_URL + '/api/workspace/upload', { method: 'POST', body: formData });
        } catch (e) {}
      }
      carregarArquivosAPI();
    }

    // --- RENDERIZAÇÃO ---
    function configurarCliqueDireito(el, item) {
      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        itemSelecionado = item;
        const menu = document.getElementById('contextMenu');
        menu.style.top = `${e.pageY}px`; menu.style.left = `${e.pageX}px`;
        menu.classList.add('active');
      });
    }
    document.addEventListener('click', () => document.getElementById('contextMenu').classList.remove('active'));

    function renderizarPasta(folder) {
      const el = document.createElement('div');
      el.className = 'folder-card';
      el.ondblclick = () => { window.location.hash = `${folder.name}/`; };
      configurarCliqueDireito(el, { ...folder, isFolder: true });
      el.innerHTML = `<div class="icon-placeholder"><svg viewBox="0 0 24 24" stroke="var(--accent)" fill="none" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div><div class="file-name">${folder.name}</div>`;
      filesGrid.prepend(el);
    }

    function renderizarArquivo(file) {
      const el = document.createElement('div');
      el.className = 'file-card';
      configurarCliqueDireito(el, { ...file, isFolder: false });
      
      const isImg = file.type && file.type.startsWith('image/');
      let visual = isImg ? `<img src="${file.url}">` : `<div class="icon-placeholder">📄</div>`;

      el.innerHTML = `
        <div style="position:relative;">${visual}</div>
        <div class="file-name">${file.name}</div>
        <button class="btn-delete-file" onclick="event.stopPropagation(); deletarItemDireto('${file.id}', '${file.ikFileId}')">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
      `;
      filesGrid.prepend(el);
    }

    // --- AÇÕES ---
    window.filtrarItens = function() {
      const termo = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.file-card, .folder-card').forEach(card => {
        card.style.display = card.querySelector('.file-name').textContent.toLowerCase().includes(termo) ? 'block' : 'none';
      });
    };

    window.abrirModalMover = function() {
      const select = document.getElementById('targetFolderSelect');
      select.innerHTML = '<option value="root">/ (Raiz)</option>';
      pastasGlobais.forEach(p => { if (p.id !== itemSelecionado.id) select.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
      document.getElementById('moveModal').classList.add('active');
    };

    window.confirmarMover = async function() {
      const target = document.getElementById('targetFolderSelect').value;
      await fetch(window.WORKER_URL + '/api/workspace/move', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tokenid: currentToken, itemId: itemSelecionado.id, itemType: itemSelecionado.isFolder ? 'folder' : 'file', targetFolderId: target })
      });
      fecharModal('moveModal'); carregarArquivosAPI();
    };

    window.gerarLinkPublico = async function() {
      try {
        const res = await fetch(window.WORKER_URL + '/api/workspace/public-share', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, itemId: itemSelecionado.id, type: itemSelecionado.isFolder ? 'folder' : 'file' })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        
        navigator.clipboard.writeText(data.shareUrl);
        alert("Link Público Copiado:\n" + data.shareUrl);
      } catch (e) { alert(e.message); }
    };

    window.mudarPrivacidade = async function() {
      const nova = prompt("Privacidade (private, restricted, public):", itemSelecionado.privacy || "private");
      if (!nova) return;
      await fetch(window.WORKER_URL + '/api/workspace/privacy', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tokenid: currentToken, itemId: itemSelecionado.id, type: itemSelecionado.isFolder ? 'folder' : 'file', privacy: nova })
      });
      carregarArquivosAPI();
    };

    window.deletarItemDireto = async function(fileId, ikFileId) {
      if (!confirm("Apagar?")) return;
      await fetch(window.WORKER_URL + '/api/workspace/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tokenid: currentToken, fileId, ikFileId })
      });
      carregarArquivosAPI();
    };

    window.renomearItem = async function() {
      const novo = prompt("Novo nome:", itemSelecionado.name);
      if (!novo) return;
      await fetch(window.WORKER_URL + '/api/workspace/rename', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tokenid: currentToken, id: itemSelecionado.id, type: itemSelecionado.isFolder ? 'folder' : 'file', newName: novo })
      });
      carregarArquivosAPI();
    };

    window.criarPasta = async function() {
      const nome = prompt("Nome da pasta:");
      if (!nome) return;
      await fetch(window.WORKER_URL + '/api/workspace/folder/create', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tokenid: currentToken, folderName: nome, parent: getPastaAtual() })
      });
      carregarArquivosAPI();
    };

    window.fazerUpload = function(input) { if (input.files.length > 0) uploadMultiplosArquivos(input.files); input.value = ''; };
    window.fecharModal = function(id) { document.getElementById(id).classList.remove('active'); };
  </script>
</body>
</html>
