<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CodeHUB · Workspace</title>
  <script src="/app-shell.js" defer></script>

  <style>
    :root, html[data-theme="dark"]{ --bg-1:#0a0e1a;--bg-2:#05070f;--surface:#101626;--surface-2:#151c30;--border:#1f2a44;--text:#e8eef8;--text-2:#8fa0bd;--accent:#4f8cff;--shadow:rgba(0,0,0,0.55); }
    *{margin:0;padding:0;box-sizing:border-box}
    body{ background:radial-gradient(circle at 30% 20%,var(--bg-1),var(--bg-2)); font-family:'Segoe UI',sans-serif; color:var(--text); min-height:100vh; display:flex; flex-direction:column; padding:20px; align-items:center; }
    .ws-container { width: 100%; max-width: 900px; margin-top: 20px; }
    
    .ws-header { display: flex; flex-direction: column; gap: 15px; background: var(--surface); padding: 20px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 8px 24px var(--shadow); margin-bottom: 24px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .ws-header h1 { font-size: 1.5rem; }
    
    .search-bar { width: 100%; position: relative; }
    .search-bar input { width: 100%; padding: 12px 16px 12px 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-1); color: var(--text); outline: none; }
    .search-bar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--text-2); fill: none; stroke-width: 2; }

    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-upload, .btn-folder { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .btn-folder { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
    .btn-upload svg, .btn-folder svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .file-card, .folder-card { background: var(--surface); border-radius: 12px; padding: 16px; border: 1px solid var(--border); text-align: center; position: relative; box-shadow: 0 4px 12px var(--shadow); transition: 0.2s; overflow: hidden; }
    .file-card:hover, .folder-card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .folder-card { cursor: pointer; }
    
    .file-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .icon-placeholder { width: 100%; height: 100px; background: var(--surface-2); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .icon-placeholder svg { width: 40px; height: 40px; stroke: var(--text-2); fill: none; stroke-width: 1.5; }
    .folder-card .icon-placeholder svg { stroke: var(--accent); width: 50px; height: 50px; }

    .file-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-date { font-size: 0.75rem; color: var(--text-2); margin-top: 4px; }
    
    .btn-delete-file { position: absolute; top: 8px; right: 8px; background: rgba(239, 68, 68, 0.9); color: white; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 10; padding: 0; }
    .btn-delete-file svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2; }
    .file-card:hover .btn-delete-file { display: flex; }
    #wsFileInput { display: none; }

    .context-menu { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 1000; display: none; min-width: 180px; }
    .context-menu.active { display: block; }
    .context-menu-item { padding: 10px 16px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
    .context-menu-item:hover { background: var(--accent); color: white; }
    .context-menu-item.danger { color: #ef4444; }
    .context-menu-item.danger:hover { background: #ef4444; color: white; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--surface); padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid var(--border); }
    .modal-box input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-1); color: var(--text); margin-bottom: 12px; }
    .modal-box button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    .modal-box button.secondary { background: transparent; color: var(--text-2); }
  </style>
</head>
<body>

  <div class="ws-container">
    <div class="ws-header">
      <div class="header-top">
        <div>
          <h1 id="folderTitle">Meus Arquivos</h1>
          <p id="folderPath" style="color: var(--text-2); font-size: 0.9rem;">/</p>
        </div>
        <div class="header-actions">
          <button class="btn-folder" onclick="criarPasta()">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
            Nova Pasta
          </button>
          <button class="btn-upload" onclick="document.getElementById('wsFileInput').click()">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload
          </button>
        </div>
      </div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Pesquisar por nome..." oninput="filtrarItens()">
      </div>
      <input type="file" id="wsFileInput" accept="image/*,video/*,application/pdf,text/plain" onchange="fazerUpload(this)">
    </div>

    <div id="filesGrid" class="files-grid">
      <p style="color: var(--text-2); grid-column: 1/-1; text-align: center;">Carregando...</p>
    </div>
  </div>

  <div class="context-menu" id="contextMenu">
    <div class="context-menu-item" id="ctxView" onclick="abrirVisualizador()">Visualizar</div>
    <div class="context-menu-item" id="ctxDownload" onclick="baixarArquivo()">Baixar</div>
    <div class="context-menu-item" id="ctxRename" onclick="renomearItem()">Renomear</div>
    <div class="context-menu-item" id="ctxShare" onclick="abrirModalCompartilhar()">Link Público</div>
    <div class="context-menu-item" id="ctxShareEmail" onclick="abrirModalEmail()">Compartilhar via E-mail</div>
    <div class="context-menu-item danger" id="ctxDelete" onclick="deletarItem()">Excluir</div>
  </div>

  <!-- Modal Link Público -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal-box">
      <h3>Link de Compartilhamento</h3>
      <p style="font-size:0.85rem; color:var(--text-2); margin-bottom:12px;">Qualquer pessoa com este link poderá ver o arquivo (somente leitura).</p>
      <input type="text" id="publicUrl" readonly style="font-size:12px;">
      <button onclick="copiarLink()">Copiar Link</button>
      <button class="secondary" onclick="fecharModal()">Fechar</button>
    </div>
  </div>

  <!-- Modal Email -->
  <div class="modal-overlay" id="shareEmailModal">
    <div class="modal-box">
      <h3>Compartilhar via E-mail</h3>
      <input type="email" id="shareEmail" placeholder="email@exemplo.com">
      <button onclick="compartilharPorEmail()">Enviar Convite</button>
      <button class="secondary" onclick="fecharEmailModal()">Cancelar</button>
    </div>
  </div>

  <script>window.WORKER_URL = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";</script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    const cfg = { apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo", authDomain: "html-15e80.firebaseapp.com", projectId: "html-15e80", appId: "1:1068148640439:web:1ac651348e624f6be41b32" };
    const app = initializeApp(cfg);
    const auth = getAuth(app);

    let currentToken = null;
    let itemSelecionado = null;
    const filesGrid = document.getElementById('filesGrid');

    if (typeof AppShell !== "undefined") { try { new AppShell().mount(); } catch (e) {} }

    const SVG_FOLDER = `<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
    const SVG_PDF = `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>`;
    const SVG_TRASH = `<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`;

    function getPastaAtual() { return window.location.hash.replace('#', '').replace('/', '') || "root"; }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentToken = await user.getIdToken();
        carregarArquivosAPI();
        window.addEventListener('hashchange', carregarArquivosAPI);
      } else {
        filesGrid.innerHTML = '<p style="color: var(--text-2); grid-column: 1/-1; text-align: center;">Faça login para ver seus arquivos.</p>';
      }
    });

    async function carregarArquivosAPI() {
      const pasta = getPastaAtual();
      document.getElementById('folderTitle').textContent = pasta === "root" ? "Meus Arquivos" : pasta;
      document.getElementById('folderPath').textContent = pasta === "root" ? "/" : `/${pasta}/`;
      filesGrid.innerHTML = '<p style="color: var(--text-2); grid-column: 1/-1; text-align: center;">Carregando...</p>';
      
      try {
        const res = await fetch(`${window.WORKER_URL}/api/workspace/list?tokenid=${encodeURIComponent(currentToken)}&folder=${encodeURIComponent(pasta)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        
        filesGrid.innerHTML = '';
        if (data.files.length === 0 && data.folders.length === 0) {
          filesGrid.innerHTML = '<p style="color: var(--text-2); grid-column: 1/-1; text-align: center;">Pasta vazia.</p>';
          return;
        }
        data.folders.forEach(f => renderizarPasta(f));
        data.files.forEach(f => renderizarArquivo(f));
      } catch (e) {
        filesGrid.innerHTML = `<p style="color: #ff4b4b; grid-column: 1/-1; text-align: center;">Erro: ${e.message}</p>`;
      }
    }

    function configurarCliqueDireito(el, item) {
      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        itemSelecionado = item;
        const menu = document.getElementById('contextMenu');
        menu.style.top = `${e.pageY}px`; menu.style.left = `${e.pageX}px`;
        menu.classList.add('active');
        
        // Mostra ou esconde opções com base no tipo
        document.getElementById('ctxView').style.display = item.isFolder ? 'none' : 'flex';
        document.getElementById('ctxDownload').style.display = item.isFolder ? 'none' : 'flex';
        document.getElementById('ctxShareEmail').style.display = item.isFolder ? 'none' : 'flex';
        document.getElementById('ctxShare').style.display = 'flex'; // Link público serve para os dois
      });
    }

    document.addEventListener('click', () => document.getElementById('contextMenu').classList.remove('active'));

    function renderizarPasta(folder) {
      const el = document.createElement('div');
      el.className = 'folder-card';
      el.id = `folder-${folder.id}`;
      el.ondblclick = () => { window.location.hash = `${folder.name}/`; };
      configurarCliqueDireito(el, { ...folder, isFolder: true });
      el.innerHTML = `<div class="icon-placeholder">${SVG_FOLDER}</div><div class="file-name">${folder.name}</div>`;
      filesGrid.prepend(el);
    }

    function renderizarArquivo(file) {
      const el = document.createElement('div');
      el.className = 'file-card';
      el.id = `file-${file.id}`;
      configurarCliqueDireito(el, { ...file, isFolder: false });

      const isImage = file.type && file.type.startsWith('image/');
      let innerVisual = isImage ? `<img src="${file.url}" style="${file.needsAccept ? 'filter: blur(4px);' : ''}">` : `<div class="icon-placeholder">${SVG_PDF}</div>`;

      const overlayAccept = file.needsAccept ? `<div style="position:absolute; inset:0; background:rgba(0,0,0,0.6); display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; z-index:2;"><p style="font-size:0.75rem; color:white;">Recebido</p><button onclick="event.stopPropagation(); aceitarCompartilhamento('${file.id}')" style="background:var(--accent); color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold;">Aceitar</button></div>` : '';
      const badge = file.isReceived && !file.needsAccept ? `<div style="position:absolute; top:8px; left:8px; background:var(--accent); color:white; font-size:0.65rem; font-weight:bold; padding:2px 6px; border-radius:4px; z-index:2;">Recebido</div>` : '';

      el.innerHTML = `
        <div style="position:relative;">${innerVisual}${overlayAccept}${badge}</div>
        <div class="file-name" title="${file.name}">${file.name}</div>
        <div class="file-date">${new Date(file.createdAt).toLocaleDateString('pt-BR')}</div>
        ${!file.isReceived ? `<button class="btn-delete-file" onclick="event.stopPropagation(); deletarItemDireto('${file.id}', '${file.ikFileId}')">${SVG_TRASH}</button>` : ''}
      `;
      filesGrid.prepend(el);
    }

    // ---- FUNÇÕES DE AÇÃO ----
    window.filtrarItens = function() {
      const termo = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.file-card, .folder-card').forEach(card => {
        const nome = card.querySelector('.file-name').textContent.toLowerCase();
        card.style.display = nome.includes(termo) ? 'block' : 'none';
      });
    };

    window.abrirVisualizador = function() { if (itemSelecionado) window.open(`/visualizar.html?id=${itemSelecionado.id}&token=${currentToken}`, '_blank'); };

    window.baixarArquivo = function() { 
      if (itemSelecionado) window.open(`${itemSelecionado.url}&download=true`, '_blank'); 
    };

    window.abrirModalCompartilhar = async function() {
      if (!itemSelecionado) return;
      try {
        const res = await fetch(window.WORKER_URL + '/api/workspace/public-share', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, itemId: itemSelecionado.id, type: itemSelecionado.isFolder ? 'folder' : 'file' })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        document.getElementById('publicUrl').value = data.shareUrl;
        document.getElementById('shareModal').classList.add('active');
      } catch (e) { alert("Erro: " + e.message); }
    };

    window.copiarLink = function() {
      const input = document.getElementById('publicUrl');
      input.select(); document.execCommand("copy");
      alert("Link copiado!");
    };

    window.abrirModalEmail = function() { document.getElementById('shareEmailModal').classList.add('active'); };
    window.fecharModal = function() { document.getElementById('shareModal').classList.remove('active'); };
    window.fecharEmailModal = function() { document.getElementById('shareEmailModal').classList.remove('active'); };

    window.compartilharPorEmail = async function() {
      const email = document.getElementById('shareEmail').value.trim();
      if (!itemSelecionado || !email) return;
      try {
        const res = await fetch(window.WORKER_URL + '/api/workspace/share', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, fileId: itemSelecionado.id, email })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        alert("Compartilhado com sucesso!"); fecharEmailModal();
      } catch (e) { alert("Erro: " + e.message); }
    };

    window.aceitarCompartilhamento = async function(fileId) {
      try {
        await fetch(window.WORKER_URL + '/api/workspace/share/accept', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, fileId })
        });
        carregarArquivosAPI();
      } catch (e) { alert("Erro ao aceitar."); }
    };

    window.renomearItem = async function() {
      const novoNome = prompt("Novo nome:", itemSelecionado.name);
      if (!novoNome || novoNome === itemSelecionado.name) return;
      try {
        await fetch(window.WORKER_URL + '/api/workspace/rename', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, id: itemSelecionado.id, type: itemSelecionado.isFolder ? 'folder' : 'file', newName: novoNome })
        });
        carregarArquivosAPI();
      } catch (e) { alert("Erro ao renomear."); }
    };

    window.deletarItem = function() { if (!itemSelecionado.isFolder) deletarItemDireto(itemSelecionado.id, itemSelecionado.ikFileId); };
    
    window.deletarItemDireto = async function(fileId, ikFileId) {
      if (!confirm("Apagar este item?")) return;
      try {
        await fetch(window.WORKER_URL + '/api/workspace/delete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, fileId: fileId, ikFileId: ikFileId })
        });
        carregarArquivosAPI();
      } catch (e) { alert("Erro ao deletar."); }
    };

    window.fazerUpload = async function(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0]; input.value = '';
      const formData = new FormData();
      formData.append('tokenid', currentToken); formData.append('file', file);
      formData.append('filename', file.name); formData.append('filetype', file.type); formData.append('folder', getPastaAtual());
      try {
        await fetch(window.WORKER_URL + '/api/workspace/upload', { method: 'POST', body: formData });
        carregarArquivosAPI();
      } catch (e) { alert("Erro no upload."); }
    };

    window.criarPasta = async function() {
      const nome = prompt("Nome da pasta:");
      if (!nome) return;
      try {
        await fetch(window.WORKER_URL + '/api/workspace/folder/create', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, folderName: nome, parent: getPastaAtual() })
        });
        carregarArquivosAPI();
      } catch (e) { alert("Erro ao criar pasta."); }
    };
  </script>
</body>
</html>
