<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CodeHUB · Workspace</title>

  <style>
    /* ... (Mantenha o CSS anterior igual) ... */
    /* Adicione o CSS do Menu de Contexto */
    .context-menu {
      position: absolute; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 1000; display: none; min-width: 180px;
    }
    .context-menu.active { display: block; }
    .context-menu-item {
      padding: 10px 16px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 10px;
      transition: 0.1s;
    }
    .context-menu-item:hover { background: var(--accent); color: white; }
    .context-menu-item.danger { color: #ef4444; }
    .context-menu-item.danger:hover { background: #ef4444; color: white; }
    
    /* Modal de Compartilhamento */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--surface); padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid var(--border); }
    .modal-box h3 { margin-bottom: 16px; }
    .modal-box input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-1); color: var(--text); margin-bottom: 12px; }
    .modal-box button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="ws-container">
    <!-- Header igual ao anterior -->
    <div class="ws-header">
      <div>
        <h1 id="folderTitle">Meus Arquivos</h1>
        <p style="color: var(--text-2); font-size: 0.9rem;" id="folderPath">/</p>
      </div>
      <div class="header-actions">
        <button class="btn-folder" onclick="criarPasta()">Nova Pasta</button>
        <button class="btn-upload" onclick="document.getElementById('wsFileInput').click()">Upload</button>
      </div>
      <input type="file" id="wsFileInput" accept="image/*,video/*,application/pdf,text/plain" onchange="fazerUpload(this)">
    </div>

    <div id="filesGrid" class="files-grid"></div>
  </div>

  <!-- MENU DE CONTEXTO (BOTÃO DIREITO) -->
  <div class="context-menu" id="contextMenu">
    <div class="context-menu-item" id="ctxView" onclick="abrirVisualizador()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Visualizar
    </div>
    <div class="context-menu-item" id="ctxRename" onclick="renomearItem()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Renomear
    </div>
    <div class="context-menu-item" id="ctxShare" onclick="abrirModalCompartilhar()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Compartilhar
    </div>
    <div class="context-menu-item danger" id="ctxDelete" onclick="deletarItem()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg> Excluir
    </div>
  </div>

  <!-- MODAL DE COMPARTILHAMENTO -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal-box">
      <h3>Compartilhar Arquivo</h3>
      <p style="color: var(--text-2); font-size: 0.8rem; margin-bottom: 16px;">Digite o e-mail de quem pode ver este arquivo.</p>
      <input type="email" id="shareEmail" placeholder="email@exemplo.com">
      <button onclick="compartilharArquivo()">Compartilhar</button>
      <button style="background: transparent; color: var(--text-2); margin-top: 8px;" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>

  <script>
    window.WORKER_URL = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";
  </script>

  <script type="module">
    // ... (Imports e config do Firebase iguais) ...

    let itemSelecionado = null; // Guarda qual item clicamos com o botão direito

    // Função para lidar com o Clique Direito
    function configurarCliqueDireito(el, item) {
      el.addEventListener('contextmenu', (e) => {
        e.preventDefault(); // Impede o menu padrão do navegador
        itemSelecionado = item; // Guarda o item
        
        const menu = document.getElementById('contextMenu');
        menu.style.top = `${e.pageY}px`;
        menu.style.left = `${e.pageX}px`;
        menu.classList.add('active');

        // Mostrar opções de acordo com o tipo
        document.getElementById('ctxView').style.display = item.isFolder ? 'none' : 'flex';
        document.getElementById('ctxShare').style.display = item.isFolder ? 'none' : 'flex';
      });
    }

    // Fecha o menu ao clicar em qualquer lugar
    document.addEventListener('click', () => {
      document.getElementById('contextMenu').classList.remove('active');
    });

    function renderizarPasta(folder) {
      // ...
      configurarCliqueDireito(el, { ...folder, isFolder: true });
      // ...
    }

    function renderizarArquivo(file) {
      // ...
      configurarCliqueDireito(el, { ...file, isFolder: false });
      // ...
    }

    // ---- Ações do Menu de Contexto ----

    window.abrirVisualizador = function() {
      if (!itemSelecionado) return;
      // Redireciona para a página de visualização passando o ID e o token
      window.open(`/visualizar.html?id=${itemSelecionado.id}&token=${currentToken}`, '_blank');
    };

    window.renomearItem = async function() {
      if (!itemSelecionado) return;
      const novoNome = prompt("Novo nome:", itemSelecionado.name);
      if (!novoNome || novoNome === itemSelecionado.name) return;

      try {
        const res = await fetch(WORKER_URL + '/api/workspace/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, id: itemSelecionado.id, type: itemSelecionado.isFolder ? 'folder' : 'file', newName: novoNome })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        
        // Atualiza a tela
        const el = document.getElementById(`${itemSelecionado.isFolder ? 'folder' : 'file'}-${itemSelecionado.id}`);
        if (el) el.querySelector('.file-name').textContent = novoNome;
        itemSelecionado.name = novoNome;
      } catch (e) { alert("Erro: " + e.message); }
    };

    window.deletarItem = async function() {
      if (!itemSelecionado) return;
      if (!confirm(`Tem certeza que deseja apagar ${itemSelecionado.name}?`)) return;

      if (itemSelecionado.isFolder) {
        alert("Deletar pastas ainda não implementado.");
        return;
      }

      try {
        const res = await fetch(WORKER_URL + '/api/workspace/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, fileId: itemSelecionado.id, ikFileId: itemSelecionado.ikFileId })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        
        const el = document.getElementById(`file-${itemSelecionado.id}`);
        if (el) el.remove();
      } catch (e) { alert("Erro: " + e.message); }
    };

    window.abrirModalCompartilhar = function() {
      document.getElementById('shareModal').classList.add('active');
    };

    window.fecharModal = function() {
      document.getElementById('shareModal').classList.remove('active');
    };

    window.compartilharArquivo = async function() {
      if (!itemSelecionado) return;
      const email = document.getElementById('shareEmail').value.trim();
      if (!email) return;

      try {
        const res = await fetch(WORKER_URL + '/api/workspace/share', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, fileId: itemSelecionado.id, email: email, action: 'add' })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);

        alert(`Arquivo compartilhado com ${email}!`);
        fecharModal();
      } catch (e) { alert("Erro: " + e.message); }
    };
  </script>
</body>
</html>
