<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CodeHUB · Workspace</title>

  <!-- Carrega o AppShell para manter o menu lateral -->
  <script src="/app-shell.js" defer></script>

  <style>
    :root, html[data-theme="dark"]{
      --bg-1:#0a0e1a;--bg-2:#05070f;--surface:#101626;--surface-2:#151c30;
      --border:#1f2a44;--text:#e8eef8;--text-2:#8fa0bd;--accent:#4f8cff;--shadow:rgba(0,0,0,0.55);
    }
    html[data-theme="light"]{
      --bg-1:#f7f9fc;--bg-2:#eef2f8;--surface:#ffffff;--surface-2:#f5f8fd;
      --border:#e2e8f2;--text:#0f172a;--text-2:#5b6b85;--accent:#2563eb;--shadow:rgba(15,23,42,0.08);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:radial-gradient(circle at 30% 20%,var(--bg-1),var(--bg-2));
      font-family:'Segoe UI',-apple-system,sans-serif; color:var(--text); min-height:100vh;
      display:flex; flex-direction:column; padding:20px; align-items:center;
    }
    
    .ws-container { width: 100%; max-width: 900px; margin-top: 20px; }
    
    .ws-header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface); padding: 20px; border-radius: 16px;
      border: 1px solid var(--border); box-shadow: 0 8px 24px var(--shadow); margin-bottom: 24px;
      flex-wrap: wrap; gap: 10px;
    }
    .ws-header h1 { font-size: 1.5rem; }
    .ws-header p { color: var(--text-2); font-size: 0.9rem; }
    
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-upload, .btn-folder {
      background: var(--accent); color: white; border: none; padding: 10px 20px;
      border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: 0.2s; font-family: inherit; font-size: 0.9rem;
    }
    .btn-folder { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
    .btn-folder:hover { border-color: var(--accent); color: var(--accent); }
    .btn-upload:hover { opacity: 0.9; }
    .btn-upload svg, .btn-folder svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    .files-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px;
    }
    
    .file-card, .folder-card {
      background: var(--surface); border-radius: 12px; padding: 16px;
      border: 1px solid var(--border); text-align: center; position: relative;
      box-shadow: 0 4px 12px var(--shadow); transition: 0.2s; overflow: hidden;
    }
    .file-card:hover, .folder-card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .folder-card { cursor: pointer; }
    
    .file-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .icon-placeholder { 
      width: 100%; height: 100px; background: var(--surface-2); border-radius: 8px; 
      display: flex; align-items: center; justify-content: center; margin-bottom: 10px; 
    }
    .icon-placeholder svg { width: 40px; height: 40px; stroke: var(--text-2); fill: none; stroke-width: 1.5; }
    .folder-card .icon-placeholder svg { stroke: var(--accent); width: 50px; height: 50px; }

    .file-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-date { font-size: 0.75rem; color: var(--text-2); margin-top: 4px; }
    
    .btn-delete-file {
      position: absolute; top: 8px; right: 8px; background: rgba(239, 68, 68, 0.9);
      color: white; border: none; width: 28px; height: 28px; border-radius: 50%;
      cursor: pointer; display: none; align-items: center; justify-content: center;
    }
    .btn-delete-file svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2; }
    .file-card:hover .btn-delete-file { display: flex; }
    
    #wsFileInput { display: none; }

    /* MENU DE CONTEXTO (Botão Direito) */
    .context-menu {
      position: absolute; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 1000; display: none; min-width: 160px;
    }
    .context-menu.active { display: block; }
    .context-menu-item {
      padding: 10px 16px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 10px;
    }
    .context-menu-item:hover { background: var(--accent); color: white; }
    .context-menu-item.danger { color: #ef4444; }
    .context-menu-item.danger:hover { background: #ef4444; color: white; }
    
    /* MODAL COMPARTILHAR */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--surface); padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid var(--border); }
    .modal-box h3 { margin-bottom: 16px; }
    .modal-box input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-1); color: var(--text); margin-bottom: 12px; }
    .modal-box button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="ws-container">
    <div class="ws-header">
      <div>
        <h1 id="folderTitle">Meus Arquivos</h1>
        <p id="folderPath">/</p>
      </div>
      
      <div class="header-actions">
        <button class="btn-folder" onclick="criarPasta()">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
          Nova Pasta
        </button>
        
        <button class="btn-upload" onclick="document.getElementById('wsFileInput').click()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload
        </button>
      </div>

      <input type="file" id="wsFileInput" accept="image/*,video/*,application/pdf,text/plain" onchange="fazerUpload(this)">
    </div>

    <div id="filesGrid" class="files-grid">
      <p style="color: var(--text-2); grid-column: 1/-1; text-align: center;">Carregando...</p>
    </div>
  </div>

  <!-- MENU DE CONTEXTO -->
  <div class="context-menu" id="contextMenu">
    <div class="context-menu-item" id="ctxView" onclick="abrirVisualizador()">Visualizar</div>
    <div class="context-menu-item" id="ctxRename" onclick="renomearItem()">Renomear</div>
    <div class="context-menu-item" id="ctxShare" onclick="abrirModalCompartilhar()">Compartilhar</div>
    <div class="context-menu-item danger" id="ctxDelete" onclick="deletarItem()">Excluir</div>
  </div>

  <!-- MODAL COMPARTILHAR -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal-box">
      <h3>Compartilhar Arquivo</h3>
      <input type="email" id="shareEmail" placeholder="email@exemplo.com">
      <button onclick="compartilharArquivo()">Compartilhar</button>
      <button style="background: transparent; color: var(--text-2); margin-top: 8px;" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>

  <script>
    window.WORKER_URL = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    const cfg = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:1ac651348e624f6be41b32"
    };

    const app = initializeApp(cfg);
    const auth = getAuth(app);

    let currentToken = null;
    let itemSelecionado = null; // Para o menu de botão direito
    const filesGrid = document.getElementById('filesGrid');
    const folderTitle = document.getElementById('folderTitle');
    const folderPath = document.getElementById('folderPath');

    const SVG_FOLDER = `<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
    const SVG_PDF = `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`;
    const SVG_TXT = `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`;
    const SVG_TRASH = `<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`;

    function getPastaAtual() {
      const hash = window.location.hash.replace('#', '').replace('/', '');
      return hash || "root";
    }

    // Inicializa o AppShell (menu lateral)
    if (typeof AppShell !== "undefined") {
      try { new AppShell().mount(); } catch (e) { console.error(e); }
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentToken = await user.getIdToken();
        carregarArquivosAPI();
        window.addEventListener('hashchange', carregarArquivosAPI);
      } else {
        filesGrid.innerHTML = '<p style="color: var(--text-2); grid-column: 1/-1; text-align: center;">Faça login para ver seus arquivos.</p>';
      }
    });

    async function carregarArquivosAPI() {
      const pasta = getPastaAtual();
      folderTitle.textContent = pasta === "root" ? "Meus Arquivos" : pasta;
      folderPath.textContent = pasta === "root" ? "/" : `/${pasta}/`;
      filesGrid.innerHTML = '<p style="color: var(--text-2); grid-column: 1/-1; text-align: center;">Carregando...</p>';
      
      try {
        const res = await fetch(`${window.WORKER_URL}/api/workspace/list?tokenid=${encodeURIComponent(currentToken)}&folder=${encodeURIComponent(pasta)}`);
        const data = await res.json();

        if (!data.ok) throw new Error(data.erro);
        filesGrid.innerHTML = '';
        
        if (data.files.length === 0 && data.folders.length === 0) {
          filesGrid.innerHTML = '<p style="color: var(--text-2); grid-column: 1/-1; text-align: center;">Pasta vazia.</p>';
          return;
        }

        data.folders.forEach(folder => renderizarPasta(folder));
        data.files.forEach(file => renderizarArquivo(file));

      } catch (e) {
        filesGrid.innerHTML = `<p style="color: #ff4b4b; grid-column: 1/-1; text-align: center;">Erro ao carregar: ${e.message}</p>`;
      }
    }

    function configurarCliqueDireito(el, item) {
      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        itemSelecionado = item;
        const menu = document.getElementById('contextMenu');
        menu.style.top = `${e.pageY}px`;
        menu.style.left = `${e.pageX}px`;
        menu.classList.add('active');

        document.getElementById('ctxView').style.display = item.isFolder ? 'none' : 'flex';
        document.getElementById('ctxShare').style.display = item.isFolder ? 'none' : 'flex';
      });
    }

    document.addEventListener('click', () => {
      document.getElementById('contextMenu').classList.remove('active');
    });

    function renderizarPasta(folder) {
      const el = document.createElement('div');
      el.className = 'folder-card';
      el.id = `folder-${folder.id}`;
      el.ondblclick = () => { window.location.hash = `${folder.name}/`; };
      configurarCliqueDireito(el, { ...folder, isFolder: true });

      el.innerHTML = `
        <div class="icon-placeholder">${SVG_FOLDER}</div>
        <div class="file-name" title="${folder.name}">${folder.name}</div>
        <div class="file-date">Pasta</div>
      `;
      filesGrid.prepend(el);
    }

    function renderizarArquivo(file) {
      const el = document.createElement('div');
      el.className = 'file-card';
      el.id = `file-${file.id}`;
      configurarCliqueDireito(el, { ...file, isFolder: false });

      const isImage = file.type && file.type.startsWith('image/');
      const isVideo = file.type && file.type.startsWith('video/');
      const isPdf = file.type && file.type.includes('pdf');
      
      let innerVisual = '';
      const protectedUrl = `${window.WORKER_URL}/api/workspace/view/${file.id}?tokenid=${encodeURIComponent(currentToken)}`;

      if (isImage) {
        innerVisual = `<img src="${protectedUrl}" alt="${file.name}">`;
      } else if (isVideo) {
        innerVisual = `<div class="icon-placeholder"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;
      } else if (isPdf) {
        innerVisual = `<div class="icon-placeholder">${SVG_PDF}</div>`;
      } else {
        innerVisual = `<div class="icon-placeholder">${SVG_TXT}</div>`;
      }

      el.innerHTML = `
        ${innerVisual}
        <div class="file-name" title="${file.name}">${file.name}</div>
        <div class="file-date">${new Date(file.createdAt).toLocaleDateString('pt-BR')}</div>
        <button class="btn-delete-file" onclick="event.stopPropagation(); deletarItemDireto('${file.id}', '${file.ikFileId}')" title="Apagar">
          ${SVG_TRASH}
        </button>
      `;
      filesGrid.prepend(el);
    }

    window.criarPasta = async function() {
      if (!currentToken) return;
      const nome = prompt("Digite o nome da nova pasta:");
      if (!nome || nome.trim() === "") return;

      const pastaAtual = getPastaAtual();
      try {
        const res = await fetch(window.WORKER_URL + '/api/workspace/folder/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, folderName: nome.trim(), parent: pastaAtual })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        renderizarPasta(data.folder);
      } catch (e) { alert("Erro ao criar pasta: " + e.message); }
    };

    window.fazerUpload = async function(input) {
      if (!input.files || input.files.length === 0) return;
      if (!currentToken) return alert("Faça login primeiro.");

      const file = input.files[0];
      input.value = '';
      const pastaAtual = getPastaAtual();

      const tempId = `temp_${Date.now()}`;
      const tempEl = document.createElement('div');
      tempEl.className = 'file-card';
      tempEl.id = `file-${tempId}`;
      tempEl.innerHTML = `<div class="icon-placeholder">⏳</div><div class="file-name">Enviando...</div>`;
      filesGrid.prepend(tempEl);

      const formData = new FormData();
      formData.append('tokenid', currentToken);
      formData.append('file', file);
      formData.append('filename', file.name);
      formData.append('filetype', file.type);
      formData.append('folder', pastaAtual);

      try {
        const res = await fetch(window.WORKER_URL + '/api/workspace/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        tempEl.remove();
        renderizarArquivo(data.file);
      } catch (e) {
        alert("Erro no upload: " + e.message);
        tempEl.remove();
      }
    };

    window.abrirVisualizador = function() {
      if (!itemSelecionado) return;
      window.open(`/visualizar.html?id=${itemSelecionado.id}&token=${currentToken}`, '_blank');
    };

    window.renomearItem = async function() {
      if (!itemSelecionado) return;
      const novoNome = prompt("Novo nome:", itemSelecionado.name);
      if (!novoNome || novoNome === itemSelecionado.name) return;

      try {
        const res = await fetch(window.WORKER_URL + '/api/workspace/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, id: itemSelecionado.id, type: itemSelecionado.isFolder ? 'folder' : 'file', newName: novoNome })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        
        const el = document.getElementById(`${itemSelecionado.isFolder ? 'folder' : 'file'}-${itemSelecionado.id}`);
        if (el) el.querySelector('.file-name').textContent = novoNome;
        itemSelecionado.name = novoNome;
      } catch (e) { alert("Erro: " + e.message); }
    };

    window.deletarItem = function() {
      if (!itemSelecionado) return;
      if (itemSelecionado.isFolder) return alert("Deletar pastas ainda não implementado.");
      deletarItemDireto(itemSelecionado.id, itemSelecionado.ikFileId);
    };

    window.deletarItemDireto = async function(fileId, ikFileId) {
      if (!confirm("Tem certeza que deseja apagar este arquivo?")) return;
      try {
        const res = await fetch(window.WORKER_URL + '/api/workspace/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, fileId: fileId, ikFileId: ikFileId })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        const el = document.getElementById(`file-${fileId}`);
        if (el) el.remove();
      } catch (e) { alert("Erro: " + e.message); }
    };

    window.abrirModalCompartilhar = function() {
      document.getElementById('shareModal').classList.add('active');
    };

    window.fecharModal = function() {
      document.getElementById('shareModal').classList.remove('active');
    };

    window.compartilharArquivo = async function() {
      if (!itemSelecionado) return;
      const email = document.getElementById('shareEmail').value.trim();
      if (!email) return;

      try {
        const res = await fetch(window.WORKER_URL + '/api/workspace/share', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenid: currentToken, fileId: itemSelecionado.id, email: email, action: 'add' })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.erro);
        alert(`Arquivo compartilhado com ${email}!`);
        fecharModal();
      } catch (e) { alert("Erro: " + e.message); }
    };
  </script>
</body>
</html>
