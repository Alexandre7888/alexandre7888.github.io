
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout Seguro</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #checkout-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #status {
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #555;
    }
  </style>
</head>

<body>

  <div id="status">Verificando autenticação...</div>

  <iframe
    id="checkout-frame"
    src="about:blank"
    allow="payment; fullscreen"
    sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-top-navigation"
    style="display:none"
  ></iframe>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:1ac651348e624f6be41b32"
    };

    const WORKER_URL =
      "https://proud-flower-677b.braatzjunioralexandre5.workers.dev/";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const iframe = document.getElementById("checkout-frame");
    const status = document.getElementById("status");

    const params = new URLSearchParams(location.search);
    const assinaturaId = params.get("id");

    if (!assinaturaId) {
      status.textContent = "ID da assinatura não informado na URL.";
      throw new Error("ID da assinatura ausente.");
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        status.textContent = "Você precisa entrar na sua conta para continuar.";
        iframe.style.display = "none";
        return;
      }

      try {
        status.textContent = "Gerando token de autenticação...";

        // Gera/renova o Firebase ID Token
        const tokenId = await user.getIdToken(true);

        // Monta a URL com o ID da assinatura e o token
        const checkoutUrl = new URL(WORKER_URL);

        checkoutUrl.searchParams.set("id", assinaturaId);
        checkoutUrl.searchParams.set("tokenid", tokenId);

        console.log("UID autenticado:", user.uid);
        console.log("ID da assinatura:", assinaturaId);

        iframe.src = checkoutUrl.toString();

        status.style.display = "none";
        iframe.style.display = "block";

      } catch (error) {
        console.error("Erro ao preparar checkout:", error);
        status.textContent = "Não foi possível autenticar para abrir o checkout.";
      }
    });

    window.addEventListener("message", (event) => {
      if (event.origin !== new URL(WORKER_URL).origin) return;

      const data = event.data;

      if (data?.type === "checkout_success" && data.redirectUrl) {
        window.location.href = data.redirectUrl;
      }

      if (data?.type === "checkout_error") {
        console.error("Erro no checkout:", data.message);
      }
    });
  </script>

</body>
</html>
