<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeHUB Workspace</title>
<script src="https://api.kloewa.ooguy.com/app-shell.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- APP -->
<section id="app" class="hidden">
  <header>
    <h2 id="title"></h2>
    <button class="btn" id="bNewFolder"></button>
    <button class="btn pri" id="bUpload"></button>
    <button class="ibtn" id="bNotif" aria-label="Notificações"><span class="badge hidden" id="badge">0</span></button>
  </header>
  <div class="bar"><div class="search" id="searchWrap"><input id="q" class="input" placeholder="Pesquisar por nome"></div></div>
  <main id="grid"></main>
  <input type="file" id="fileIn" multiple class="hidden">
</section>

<div id="ctx" class="hidden"></div>
<div id="toasts"></div>
<div id="dropOv" class="ov drop hidden">Solte os arquivos para enviar</div>

<script type="module" src="script.js"></script>
<script>
  if (typeof AppShell !== "undefined") {
    try { new AppShell().mount(); } catch (e) { console.error("Erro no AppShell:", e); }
  }
</script>
</body>
</html>
