<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação KYC</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #kyc-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe
    id="kyc-frame"
    src=""
    allow="camera; microphone; fullscreen"
    sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-top-navigation allow-camera allow-microphone"
  ></iframe>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // CONFIGURAÇÃO DO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:1ac651348e624f6be41b32"
    };

    // WORKER KYC
    const WORKER_URL =
      "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const iframe = document.getElementById("kyc-frame");

    // A URL DESTE HTML RECEBE SOMENTE ?id=
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    // TIPO OPCIONAL: ?id=123&tipo=face
    const tipo = params.get("tipo");

    // CARREGA O KYC COM ID E TOKEN DO FIREBASE
    function carregarKyc(token) {
      const url = new URL(WORKER_URL + "/kyc");

      url.searchParams.set("id", id);
      url.searchParams.set("tokenid", token);

      if (tipo) {
        url.searchParams.set("tipo", tipo);
      }

      iframe.src = url.toString();
    }

    // VERIFICA O ID E A AUTENTICAÇÃO
    if (!id) {
      document.body.innerHTML = `
        <div style="
          font-family: Arial, sans-serif;
          padding: 24px;
          text-align: center;
        ">
          <h3>Verificação indisponível</h3>
          <p>O parâmetro id não foi informado na URL.</p>
        </div>
      `;
    } else {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          console.warn("Usuário não está autenticado no Firebase.");
          return;
        }

        try {
          // O TOKEN É GERADO PELO FIREBASE, NÃO PELA URL
          const token = await user.getIdToken();

          // O WORKER RECEBE ?id=...&tokenid=...
          carregarKyc(token);

        } catch (error) {
          console.error(
            "Erro ao obter o token do Firebase:",
            error
          );
        }
      });
    }

    // ESCUTA AS MENSAGENS DO IFRAME
    window.addEventListener("message", (event) => {
      if (event.origin !== new URL(WORKER_URL).origin) {
        return;
      }

      const data = event.data;

      if (data && data.type === "kyc_result") {
        console.log("Resultado da verificação KYC:", data);
      }
    });
  </script>

</body>
</html>
