<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset de senha</title>

<style>
body {
    font-family: Arial;
    background:#111827;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card {
    background:#1f2937;
    padding:25px;
    border-radius:15px;
    width:300px;
    text-align:center;
}

input,button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:0;
}

button {
    background:#2563eb;
    color:white;
    cursor:pointer;
}

#msg {
    margin-top:15px;
}
</style>

</head>

<body>

<div class="card">

<h2>Nova senha</h2>

<input id="senha" type="password" placeholder="Digite a nova senha">

<button id="btn">
Alterar senha
</button>

<div id="msg"></div>

</div>


<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getAuth,
confirmPasswordReset
} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// SUAS CREDENCIAIS

const firebaseConfig = {
  apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
  authDomain: "html-15e80.firebaseapp.com",
  databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
  projectId: "html-15e80",
  storageBucket: "html-15e80.firebasestorage.app",
  messagingSenderId: "1068148640439",
  appId: "1:1068148640439:web:1ac651348e624f6be41b32",
  measurementId: "G-7E1VWN07GM"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


// PEGA O CÓDIGO DA URL

const urlParams = new URLSearchParams(
    window.location.search
);

const oobCode = urlParams.get("oobCode");


console.log("Código recebido:", oobCode);


document.getElementById("btn").onclick = async ()=>{

const senha =
document.getElementById("senha").value;

const msg =
document.getElementById("msg");


if(!oobCode){
    msg.innerHTML="Código não encontrado na URL";
    return;
}


try {

await confirmPasswordReset(
    auth,
    oobCode,
    senha
);


msg.innerHTML =
"✅ Senha alterada com sucesso!";

}
catch(error){

msg.innerHTML =
"❌ Erro: " + error.message;

}


};


</script>

</body>
</html>
