<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando...</title>
</head>
<body>
  <h1>Entrando no App</h1>
  <p id="status">Verificando autenticação...</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const statusEl = document.getElementById("status");
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect');

    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:1ac651348e624f6be41b32"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    statusEl.textContent = "Verificando sessão...";

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        statusEl.textContent = "Gerando Custom Token via Apps Script...";

        try {
          const uid = user.uid;

          // Chama o Apps Script passando o UID
          const response = await fetch(
            "https://script.google.com/macros/s/AKfycbyNCG_U-tbHVkGgrn7E87C0MaEiiDDsViXqL8Bhqc0NK9Hja8eGRA7AfTQ5aZKU-jItoA/exec?token=" + encodeURIComponent(uid)
          );

          if (!response.ok) {
            throw new Error("Falha na requisição ao Apps Script");
          }

          // Pega o JSON de resposta
          const data = await response.json();

          if (data.sucesso && data.customToken) {
            const customToken = data.customToken;

            // SALVA O CUSTOM TOKEN NO COOKIE COMPARTILHADO
            document.cookie =
              "firebaseToken=" + customToken +
              "; Domain=.codehub.site.je; Path=/; SameSite=Lax; Secure";

            console.log("✅ Custom Token recebido do Apps Script e salvo no cookie.");
            statusEl.textContent = "✅ Token salvo! Redirecionando...";

            if (redirectUrl) {
              window.location.href = codehub.site.je;
            } else {
              statusEl.textContent = "✅ Token salvo! (Nenhum redirect)";
            }

          } else {
            throw new Error("Resposta do Apps Script não contém customToken");
          }

        } catch (error) {
          console.error("❌ Erro:", error.message);
          statusEl.textContent = "❌ Erro ao gerar token via Apps Script.";
        }

      } else {
        statusEl.textContent = "❌ Usuário não autenticado.";
        console.log("❌ Usuário não autenticado.");
      }
    });
  </script>
</body>
</html>
