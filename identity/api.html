
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kloewa Identity</title>
<style>
html,body{margin:0;padding:0;background:white;font-family:Arial}
</style>
</head>
<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  set
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzRLpZJDMeFASIjje4SJBfTInIEO-GKVI",
  authDomain: "html-785e3.firebaseapp.com",
  databaseURL: "https://html-785e3-default-rtdb.firebaseio.com",
  projectId: "html-785e3",
  storageBucket: "html-785e3.firebasestorage.app",
  messagingSenderId: "389467952076",
  appId: "1:389467952076:web:fcad8e95181b9050494369",
  measurementId: "G-KEPDBKP6MJ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const STORAGE_KEY = "kloewa_identity_key";

let parentOrigin = null;

function send(type, data = {}) {
  if (!parentOrigin) return;

  window.parent.postMessage({
    source: "kloewa-identity",
    type,
    ...data
  }, parentOrigin);
}

window.addEventListener("message", async event => {
  if (event.source !== window.parent) return;

  const message = event.data;

  if (!message || typeof message !== "object") return;
  if (message.consent !== true) return;
  if (message.type !== "KLOEWA_INIT") return;

  // A origem é obtida da mensagem real do navegador.
  parentOrigin = event.origin;

  try {
    let identityKey = localStorage.getItem(STORAGE_KEY);

    if (!identityKey) {
      identityKey = crypto.randomUUID();
      localStorage.setItem(STORAGE_KEY, identityKey);
    }

    const identityRef = ref(db, "identities/" + identityKey);
    const snapshot = await get(identityRef);

    send("KLOEWA_READY", {
      exists: snapshot.exists(),
      identityKey
    });

  } catch (error) {
    send("KLOEWA_ERROR", {
      message: "Não foi possível consultar a identidade."
    });
  }
});

window.addEventListener("message", async event => {
  if (event.source !== window.parent) return;
  if (event.origin !== parentOrigin || !parentOrigin) return;

  const message = event.data;

  if (!message || message.consent !== true) return;

  try {
    const identityKey = localStorage.getItem(STORAGE_KEY);
    if (!identityKey) throw new Error("Identidade indisponível.");

    const identityRef = ref(db, "identities/" + identityKey);

    if (message.type === "KLOEWA_SAVE") {
      if (typeof message.text !== "string") return;
      if (message.text.length > 300) return;

      await set(identityRef, {
        text: message.text,
        updatedAt: Date.now()
      });

      send("KLOEWA_SAVED", { success: true });
    }

    if (message.type === "KLOEWA_GET") {
      const snapshot = await get(identityRef);

      send("KLOEWA_RESULT", {
        exists: snapshot.exists(),
        text: snapshot.exists()
          ? snapshot.val().text || ""
          : null
      });
    }

  } catch (error) {
    send("KLOEWA_ERROR", {
      message: "Não foi possível concluir a operação."
    });
  }
});
</script>

</body>
</html>
