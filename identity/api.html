
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kloewa Identity</title>
</head>
<body>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getDatabase, ref, get, set
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const app = initializeApp({
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
  projectId: "SEU_PROJETO",
  appId: "SEU_APP_ID"
});

const db = getDatabase(app);
let parentOrigin = null;

function send(type, data = {}) {
  if (parentOrigin) {
    parent.postMessage({
      source: "kloewa-identity",
      type,
      ...data
    }, parentOrigin);
  }
}

function getIdentity() {
  let id = sessionStorage.getItem("kloewa_shared_identity");

  if (!id) {
    id = crypto.randomUUID();
    sessionStorage.setItem("kloewa_shared_identity", id);
  }

  return id;
}

window.addEventListener("message", async event => {
  if (event.source !== parent) return;

  const data = event.data;
  if (!data || data.source !== "kloewa-partner") return;
  if (data.type !== "KLOEWA_INIT") return;
  if (data.consent !== true) return;

  parentOrigin = event.origin;

  try {
    const identity = getIdentity();

    if (data.action === "save") {
      const message = String(data.message || "").slice(0, 2000);

      await set(ref(db, "shared_messages/" + identity), {
        message,
        updatedAt: Date.now()
      });

      send("KLOEWA_SAVED", { success: true });
    }

    if (data.action === "read") {
      const snapshot = await get(
        ref(db, "shared_messages/" + identity)
      );

      send("KLOEWA_MESSAGE", {
        message: snapshot.exists() ? snapshot.val().message : null
      });
    }
  } catch (error) {
    send("KLOEWA_ERROR", {
      message: "Não foi possível acessar a mensagem."
    });
  }
});
</script>
</body>
</html>
