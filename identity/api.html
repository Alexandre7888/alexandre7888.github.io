
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Kloewa Identity</title>
</head>
<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getDatabase, ref, get, set
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyBzRLpZJDMeFASIjje4SJBfTInIEO-GKVI",
  authDomain: "html-785e3.firebaseapp.com",
  databaseURL: "https://html-785e3-default-rtdb.firebaseio.com",
  projectId: "html-785e3",
  storageBucket: "html-785e3.firebasestorage.app",
  messagingSenderId: "389467952076",
  appId: "1:389467952076:web:fcad8e95181b9050494369"
});

const db = getDatabase(app);
const ALLOWED_ORIGINS = new Set([
  "https://SEU-DOMINIO-PARCEIRO.com",
  "https://OUTRO-DOMINIO-PARCEIRO.com"
]);

let parentOrigin = null;
let identityToken = null;

function send(type, data = {}) {
  if (!parentOrigin) return;
  parent.postMessage({
    source: "kloewa-identity",
    type,
    ...data
  }, parentOrigin);
}

function browserData() {
  return {
    userAgent: navigator.userAgent,
    language: navigator.language,
    platform: navigator.platform,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen: `${screen.width}x${screen.height}`
  };
}

async function fingerprint() {
  const bytes = new TextEncoder().encode(
    JSON.stringify(browserData())
  );
  const hash = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(hash))
    .map(x => x.toString(16).padStart(2, "0"))
    .join("");
}

window.addEventListener("message", async event => {
  if (event.source !== parent) return;

  const m = event.data;
  if (!m || typeof m !== "object") return;

  if (m.type === "KLOEWA_INIT") {
    if (m.consent !== true) return;
    if (!ALLOWED_ORIGINS.has(event.origin)) return;

    parentOrigin = event.origin;

    send("KLOEWA_READY");

    try {
      const fp = await fingerprint();
      send("KLOEWA_FINGERPRINT", { fingerprint: fp });

      // A identidade é um código compartilhado autorizado,
      // fornecido pelo visitante, não um fingerprint.
    } catch {
      send("KLOEWA_ERROR", { message: "Erro ao analisar navegador." });
    }
    return;
  }

  if (event.origin !== parentOrigin || !parentOrigin) return;
  if (m.consent !== true) return;

  if (m.type === "KLOEWA_USE_TOKEN") {
    if (typeof m.token !== "string" ||
        !/^[a-f0-9-]{20,80}$/i.test(m.token)) return;

    identityToken = m.token;
    send("KLOEWA_IDENTITY_READY");
  }

  if (!identityToken) return;

  const record = ref(db, "shared_identities/" + identityToken);

  try {
    if (m.type === "KLOEWA_SAVE") {
      if (typeof m.text !== "string" || m.text.length > 300) return;

      await set(record, {
        text: m.text,
        updatedAt: Date.now()
      });

      send("KLOEWA_SAVED");
    }

    if (m.type === "KLOEWA_GET") {
      const snapshot = await get(record);

      send("KLOEWA_RESULT", {
        exists: snapshot.exists(),
        text: snapshot.exists() ? snapshot.val().text : null
      });
    }
  } catch {
    send("KLOEWA_ERROR", {
      message: "Erro ao acessar Firebase. Verifique a autenticação e as regras."
    });
  }
});
</script>

</body>
</html>
