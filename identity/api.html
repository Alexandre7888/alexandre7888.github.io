
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kloewa Identity</title>
<style>
html,body {
  margin: 0;
  padding: 0;
  background: white;
}
</style>
</head>
<body>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzRLpZJDMeFASIjje4SJBfTInIEO-GKVI",
  authDomain: "html-785e3.firebaseapp.com",
  databaseURL: "https://html-785e3-default-rtdb.firebaseio.com",
  projectId: "html-785e3",
  storageBucket: "html-785e3.firebasestorage.app",
  messagingSenderId: "389467952076",
  appId: "1:389467952076:web:fcad8e95181b9050494369",
  measurementId: "G-KEPDBKP6MJ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let parentOrigin = null;
let busy = false;

function send(type, data = {}) {
  if (!parentOrigin) return;

  window.parent.postMessage({
    source: "kloewa-ads",
    type,
    ...data
  }, parentOrigin);
}

async function hashFingerprint(data) {
  const encoded = new TextEncoder().encode(
    JSON.stringify(data)
  );

  const hash = await crypto.subtle.digest("SHA-256", encoded);

  return Array.from(new Uint8Array(hash))
    .map(byte => byte.toString(16).padStart(2, "0"))
    .join("");
}

function getBrowserData() {
  return {
    userAgent: navigator.userAgent,
    language: navigator.language,
    languages: navigator.languages,
    platform: navigator.platform,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen: {
      width: screen.width,
      height: screen.height,
      colorDepth: screen.colorDepth
    },
    hardwareConcurrency: navigator.hardwareConcurrency || null,
    deviceMemory: navigator.deviceMemory || null,
    touchPoints: navigator.maxTouchPoints,
    pixelRatio: devicePixelRatio
  };
}

async function processIdentity() {
  if (busy) return;
  busy = true;

  try {
    const browserData = getBrowserData();
    const fingerprint = await hashFingerprint(browserData);

    const record = push(ref(db, "browser_diagnostics"));

    await set(record, {
      fingerprint,
      browserData,
      createdAt: Date.now(),
      partnerOrigin: parentOrigin
    });

    send("KLOEWA_FINGERPRINT", {
      fingerprint,
      browserData,
      saved: true
    });

  } catch (error) {
    send("KLOEWA_ERROR", {
      message: "Não foi possível processar os dados."
    });
  } finally {
    busy = false;
  }
}

window.addEventListener("message", event => {
  if (event.source !== window.parent) return;

  const message = event.data;

  if (!message || message.type !== "KLOEWA_INIT") return;
  if (message.consent !== true) return;

  parentOrigin = event.origin;

  send("KLOEWA_READY");
  processIdentity();
});
</script>

</body>
</html>
