
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kloewa Identity</title>
</head>
<body>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getDatabase, ref, push, set, get
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyBzRLpZJDMeFASIjje4SJBfTInIEO-GKVI",
  authDomain: "html-785e3.firebaseapp.com",
  databaseURL: "https://html-785e3-default-rtdb.firebaseio.com",
  projectId: "html-785e3",
  storageBucket: "html-785e3.firebasestorage.app",
  messagingSenderId: "389467952076",
  appId: "1:389467952076:web:fcad8e95181b9050494369"
});

const db = getDatabase(app);

let parentOrigin = null;
let busy = false;

function send(type, data = {}) {
  if (!parentOrigin) return;

  parent.postMessage({
    source: "kloewa-identity",
    type,
    ...data
  }, parentOrigin);
}

function getBrowserData() {
  return {
    userAgent: navigator.userAgent,
    language: navigator.language,
    platform: navigator.platform,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen: {
      width: screen.width,
      height: screen.height,
      colorDepth: screen.colorDepth
    },
    cores: navigator.hardwareConcurrency || null,
    memory: navigator.deviceMemory || null,
    touchPoints: navigator.maxTouchPoints,
    pixelRatio: devicePixelRatio
  };
}

async function calculateFingerprint(data) {
  const input = new TextEncoder().encode(JSON.stringify(data));
  const digest = await crypto.subtle.digest("SHA-256", input);

  return Array.from(new Uint8Array(digest))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

async function initialize() {
  if (busy) return;
  busy = true;

  try {
    const browserData = getBrowserData();
    const fingerprint = await calculateFingerprint(browserData);

    const record = push(ref(db, "browser_diagnostics"));

    await set(record, {
      fingerprint,
      browserData,
      partnerOrigin: parentOrigin,
      createdAt: Date.now()
    });

    send("KLOEWA_FINGERPRINT", {
      fingerprint,
      saved: true
    });

  } catch (error) {
    console.error(error);
    send("KLOEWA_ERROR", {
      message: "Erro ao salvar diagnóstico no Firebase."
    });
  } finally {
    busy = false;
  }
}

window.addEventListener("message", event => {
  if (event.source !== window.parent) return;

  const message = event.data;

  if (!message || message.type !== "KLOEWA_INIT") return;
  if (message.consent !== true) return;

  parentOrigin = event.origin;

  send("KLOEWA_READY");
  initialize();
});
</script>
</body>
</html>
