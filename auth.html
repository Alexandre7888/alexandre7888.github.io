<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeHub - Autenticação</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI',sans-serif;
      background:linear-gradient(135deg,#0b1120,#1a1f35);
      display:flex;justify-content:center;align-items:center;
      min-height:100vh;padding:20px;
    }
    .auth-container{
      width:100%;max-width:480px;
      background:rgba(20,25,45,0.95);border-radius:20px;overflow:hidden;
      box-shadow:0 20px 40px rgba(0,0,0,0.4);
      border:1px solid rgba(67,97,238,0.2);animation:fadeIn 0.5s;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .auth-header{
      background:linear-gradient(135deg,#4361ee,#7c3aed);
      color:#fff;padding:25px;text-align:center;
    }
    .auth-header h1{font-size:24px;margin-bottom:5px}
    .auth-header p{font-size:13px;opacity:0.9}
    .account-indicator{
      background:rgba(0,0,0,0.2);padding:6px 14px;
      border-radius:20px;display:inline-block;margin-top:8px;font-size:12px;
    }
    .tabs{display:flex;background:rgba(0,0,0,0.3)}
    .tab{
      flex:1;text-align:center;padding:14px;cursor:pointer;
      font-weight:600;color:#a0b3c9;transition:0.3s;position:relative;
    }
    .tab.active{color:#fff;background:rgba(67,97,238,0.3)}
    .tab.active::after{
      content:'';position:absolute;bottom:0;left:0;
      width:100%;height:3px;background:#4361ee;
    }
    .tab-content{padding:25px;display:none}
    .tab-content.active{display:block}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;margin-bottom:6px;font-weight:600;color:#e2e9f0;font-size:13px}
    .form-control{
      width:100%;padding:11px 14px;background:rgba(0,0,0,0.3);
      border:2px solid rgba(67,97,238,0.3);border-radius:8px;
      font-size:14px;color:#fff;transition:0.3s;
    }
    .form-control:focus{border-color:#4895ef;outline:none;box-shadow:0 0 0 3px rgba(67,97,238,0.2);background:rgba(0,0,0,0.5)}
    .form-control::placeholder{color:#6b7280}
    .btn{
      width:100%;padding:13px;border:none;border-radius:10px;
      font-size:15px;font-weight:600;cursor:pointer;transition:0.3s;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-primary{
      background:linear-gradient(135deg,#4361ee,#7c3aed);color:#fff;
    }
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(67,97,238,0.3)}
    .btn-google{
      background:#fff;color:#212529;border:1px solid #dee2e6;
    }
    .btn-google:hover{background:#f8f9fa;transform:translateY(-2px)}
    .btn-back{
      background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);
      margin-top:10px;font-size:13px;
    }
    .btn-back:hover{background:rgba(255,255,255,0.2)}
    .divider{
      display:flex;align-items:center;margin:18px 0;
      color:#a0b3c9;font-size:13px;
    }
    .divider::before,.divider::after{
      content:'';flex:1;height:1px;background:rgba(255,255,255,0.2);margin:0 10px;
    }
    .error-message{
      color:#f72585;font-size:12px;margin-top:4px;display:none;
      background:rgba(247,37,133,0.1);padding:8px;border-radius:6px;margin-bottom:10px;
    }
    .error-message.show{display:block}
    .success-message{
      color:#4cc9f0;font-size:13px;margin-top:12px;text-align:center;
      font-weight:600;background:rgba(76,201,240,0.1);padding:8px;border-radius:6px;
    }
    .info-message{
      background:rgba(67,97,238,0.2);border-left:4px solid #4895ef;
      padding:10px 12px;margin:12px 0;border-radius:6px;font-size:13px;color:#e2e9f0;
    }
    .footer-text{text-align:center;margin-top:18px;font-size:13px;color:#a0b3c9}
    .footer-text a{color:#4361ee;text-decoration:none;font-weight:600;cursor:pointer}
    .header-actions{position:fixed;top:20px;right:20px;z-index:1000}
    .home-btn{
      background:rgba(255,255,255,0.1);color:#fff;border:none;
      padding:10px 20px;border-radius:20px;font-size:14px;
      cursor:pointer;transition:0.3s;backdrop-filter:blur(10px);
    }
    .home-btn:hover{background:rgba(255,255,255,0.2)}
    .user-type-selector{
      display:flex;gap:12px;margin-bottom:16px;padding:8px;
      background:rgba(0,0,0,0.3);border-radius:8px;
    }
    .user-type-option{
      flex:1;text-align:center;padding:8px;border:2px solid rgba(67,97,238,0.3);
      border-radius:8px;cursor:pointer;transition:0.3s;color:#fff;font-size:13px;
    }
    .user-type-option.selected{border-color:#4361ee;background:rgba(67,97,238,0.3)}
    .company-fields{display:none}
    .company-fields.show{display:block}
    .device-info{
      background:rgba(0,0,0,0.3);border-radius:8px;padding:8px;
      margin:15px;font-size:11px;color:#a0b3c9;text-align:center;
    }
    .loading-spinner{
      display:inline-block;width:14px;height:14px;
      border:2px solid transparent;border-top:2px solid #fff;
      border-radius:50%;animation:spin 0.8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:480px){
      .auth-container{border-radius:12px}
      .auth-header{padding:20px}
      .tab-content{padding:20px}
      .header-actions{top:10px;right:10px}
    }
  </style>
</head>
<body>
  <div class="header-actions">
    <button class="home-btn" onclick="goToIndex()">🏠 Voltar ao Início</button>
  </div>

  <div class="auth-container">
    <div class="auth-header">
      <h1>Bem-vindo ao CodeHub</h1>
      <p>Autenticação Multi-Conta</p>
      <div class="account-indicator">
        👤 Contas neste dispositivo: <span id="accountCountNumber">0</span>/5
      </div>
    </div>

    <!-- Aviso de já estar logado -->
    <div id="already-logged-info" class="info-message" style="display:none;">
      ⚠️ Você já está logado como <strong id="loggedAsName"></strong>.<br>
      <small>Você pode adicionar outra conta (até 5) ou voltar para a plataforma.</small>
    </div>

    <!-- Mensagens -->
    <div id="global-error" class="error-message"></div>
    <div id="global-success" class="success-message" style="display:none;"></div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Entrar</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Criar Conta</div>
    </div>

    <!-- Tab Login -->
    <div id="login-tab" class="tab-content active">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" class="form-control" placeholder="digite seu email">
      </div>
      <div class="form-group">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" class="form-control" placeholder="digite sua senha">
      </div>
      <div id="login-cnpj-group" class="form-group" style="display:none;">
        <label for="login-cnpj">CNPJ da Empresa</label>
        <input type="text" id="login-cnpj" class="form-control" placeholder="00.000.000/0000-00" oninput="formatCNPJ(this)">
      </div>

      <button class="btn btn-primary" id="login-btn" onclick="login()">🔐 Entrar</button>
      <div class="divider">ou</div>
      <button class="btn btn-google" onclick="loginWithGoogle()">🟢 Continuar com Google</button>
      <button class="btn btn-back" onclick="goToIndex()">🏠 Voltar para Plataforma</button>
      <div class="footer-text">
        Não tem uma conta? <a onclick="switchTab('register')">Cadastre-se</a>
      </div>
    </div>

    <!-- Tab Registro -->
    <div id="register-tab" class="tab-content">
      <div class="form-group">
        <label>Tipo de Conta</label>
        <div class="user-type-selector">
          <div class="user-type-option selected" data-type="normal" onclick="selectUserType('normal')">👤 Usuário Normal</div>
          <div class="user-type-option" data-type="entrepreneur" onclick="selectUserType('entrepreneur')">🏢 Empreendedor</div>
        </div>
      </div>
      <div class="form-group">
        <label for="register-username">Nome de Usuário</label>
        <input type="text" id="register-username" class="form-control" placeholder="ex: dev123">
      </div>
      <div class="form-group">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" class="form-control" placeholder="digite seu email">
      </div>
      <div class="form-group">
        <label for="register-password">Senha</label>
        <input type="password" id="register-password" class="form-control" placeholder="mín. 6 caracteres">
      </div>
      <div class="form-group">
        <label for="register-confirm-password">Confirmar Senha</label>
        <input type="password" id="register-confirm-password" class="form-control" placeholder="confirme sua senha">
      </div>
      <div id="company-fields" class="company-fields">
        <div class="form-group">
          <label for="register-company-name">Nome da Empresa</label>
          <input type="text" id="register-company-name" class="form-control" placeholder="Nome da sua empresa">
        </div>
        <div class="form-group">
          <label for="register-cnpj">CNPJ</label>
          <input type="text" id="register-cnpj" class="form-control" placeholder="00.000.000/0000-00" oninput="formatCNPJ(this)">
        </div>
      </div>

      <button class="btn btn-primary" id="register-btn" onclick="register()">✨ Criar Conta</button>
      <button class="btn btn-back" onclick="goToIndex()">🏠 Voltar para Plataforma</button>
      <div class="footer-text">
        Já tem uma conta? <a onclick="switchTab('login')">Faça login</a>
      </div>
    </div>

    <div class="device-info" id="deviceInfo"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js";
    import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      GoogleAuthProvider, signInWithPopup
    } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js";
    import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.firebasestorage.app",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:7cc5bde34f4c5a5ce41b32"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let selectedUserType = 'normal';
    const MAX_ACCOUNTS = 5;

    // ==================== DISPOSITIVO ====================
    function generateDeviceId() {
      let id = localStorage.getItem('codehub_deviceId');
      if (!id) {
        id = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('codehub_deviceId', id);
      }
      return id;
    }

    function generateUserKey(uid) {
      return `${uid}-${Date.now()}-${Math.random().toString(36).substr(2, 6)}`;
    }

    function generateAuthToken(userId, userEmail, username, userType, companyData = null) {
      const tokenData = {
        uid: userId, email: userEmail, username: username,
        userType: userType, companyData: companyData,
        createdAt: Date.now(), expiresAt: null,
        version: "1.0", isPermanent: true
      };
      return btoa(unescape(encodeURIComponent(JSON.stringify(tokenData))));
    }

    const deviceId = generateDeviceId();
    document.getElementById('deviceInfo').innerHTML = `📱 Device: ${deviceId.substring(0, 25)}...`;

    // ==================== INICIALIZAÇÃO ====================
    function init() {
      document.getElementById('accountCountNumber').textContent = getAccountCount();
      
      // Verificar se já está logado (mas NÃO redirecionar)
      const currentUserKey = localStorage.getItem('current_userKey');
      const authToken = localStorage.getItem('auth_token');
      
      if (currentUserKey && authToken) {
        // Mostrar aviso de que já está logado
        checkCurrentUser();
      }
    }

    async function checkCurrentUser() {
      try {
        const userKey = localStorage.getItem('current_userKey');
        if (userKey) {
          const snap = await get(ref(database, `userKeysData/${userKey}`));
          if (snap.exists()) {
            const d = snap.val();
            const u = d.authTokenDecoded || d;
            document.getElementById('already-logged-info').style.display = 'block';
            document.getElementById('loggedAsName').textContent = u.username || u.email;
          }
        }
      } catch(e) {}
    }

    function getAccountCount() {
      const accounts = JSON.parse(localStorage.getItem('codehub_deviceAccounts') || '[]');
      return accounts.length;
    }

    // ==================== UI ====================
    window.goToIndex = function() {
      window.location.href = 'index.html';
    };

    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      document.getElementById(`${tabId}-tab`).classList.add('active');
      hideMessages();
    };

    window.selectUserType = function(type) {
      selectedUserType = type;
      document.querySelectorAll('.user-type-option').forEach(o => o.classList.remove('selected'));
      document.querySelector(`.user-type-option[data-type="${type}"]`).classList.add('selected');
      document.getElementById('company-fields').classList.toggle('show', type === 'entrepreneur');
    };

    window.formatCNPJ = function(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 14) v = v.slice(0, 14);
      if (v.length > 12) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
      else if (v.length > 8) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})$/, '$1.$2.$3/$4');
      else if (v.length > 5) v = v.replace(/^(\d{2})(\d{3})(\d{3})$/, '$1.$2.$3');
      else if (v.length > 2) v = v.replace(/^(\d{2})(\d{3})$/, '$1.$2');
      input.value = v;
    };

    function showError(msg) {
      const el = document.getElementById('global-error');
      el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 5000);
    }

    function showSuccess(msg) {
      const el = document.getElementById('global-success');
      el.textContent = msg; el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    function hideMessages() {
      document.getElementById('global-error').classList.remove('show');
      document.getElementById('global-success').style.display = 'none';
    }

    function validateCNPJ(cnpj) {
      cnpj = cnpj.replace(/\D/g, '');
      if (cnpj.length !== 14 || /^(\d)\1+$/.test(cnpj)) return false;
      let sum = 0, weight = 5;
      for (let i = 0; i < 12; i++) { sum += parseInt(cnpj.charAt(i)) * weight; weight = weight === 2 ? 9 : weight - 1; }
      let digit = 11 - (sum % 11); digit = digit >= 10 ? 0 : digit;
      if (digit !== parseInt(cnpj.charAt(12))) return false;
      sum = 0; weight = 6;
      for (let i = 0; i < 13; i++) { sum += parseInt(cnpj.charAt(i)) * weight; weight = weight === 2 ? 9 : weight - 1; }
      digit = 11 - (sum % 11); digit = digit >= 10 ? 0 : digit;
      return digit === parseInt(cnpj.charAt(13));
    }

    async function saveAccountToDevice(userData) {
      let accounts = JSON.parse(localStorage.getItem('codehub_deviceAccounts') || '[]');
      const idx = accounts.findIndex(a => a.uid === userData.uid);
      if (idx >= 0) {
        accounts[idx] = { ...accounts[idx], ...userData, lastLogin: Date.now() };
      } else {
        if (accounts.length >= MAX_ACCOUNTS) throw new Error('Limite de 5 contas!');
        accounts.push({ ...userData, addedAt: Date.now(), lastLogin: Date.now() });
      }
      localStorage.setItem('codehub_deviceAccounts', JSON.stringify(accounts));
      
      // Firebase
      const obj = {};
      accounts.forEach(a => { obj[a.uid] = { ...a, deviceId }; });
      await set(ref(database, `dispositivos/${deviceId}/contas`), obj);
      await set(ref(database, `dispositivos/${deviceId}/info`), {
        deviceId, lastAccess: Date.now(), totalAccounts: accounts.length,
        userAgent: navigator.userAgent, platform: navigator.platform, language: navigator.language
      });
      
      document.getElementById('accountCountNumber').textContent = accounts.length;
      return accounts;
    }

    // ==================== REGISTRO ====================
    window.register = async () => {
      hideMessages();
      const username = document.getElementById('register-username').value.trim();
      const email = document.getElementById('register-email').value.trim();
      const password = document.getElementById('register-password').value;
      const confirm = document.getElementById('register-confirm-password').value;
      const userType = selectedUserType;
      let companyName = '', cnpj = '';

      if (userType === 'entrepreneur') {
        companyName = document.getElementById('register-company-name').value.trim();
        cnpj = document.getElementById('register-cnpj').value.trim();
        if (!companyName) { showError('Nome da empresa é obrigatório'); return; }
        if (!cnpj) { showError('CNPJ é obrigatório'); return; }
        if (!validateCNPJ(cnpj)) { showError('CNPJ inválido'); return; }
      }
      if (!username) { showError('Nome de usuário é obrigatório'); return; }
      if (!email) { showError('Email é obrigatório'); return; }
      if (!password) { showError('Senha é obrigatória'); return; }
      if (password.length < 6) { showError('Senha deve ter pelo menos 6 caracteres'); return; }
      if (password !== confirm) { showError('Senhas não coincidem'); return; }

      const accounts = JSON.parse(localStorage.getItem('codehub_deviceAccounts') || '[]');
      if (accounts.length >= MAX_ACCOUNTS) { showError('Limite de 5 contas!'); return; }

      const btn = document.getElementById('register-btn');
      btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Criando...';

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const userKey = generateUserKey(user.uid);
        const authToken = generateAuthToken(user.uid, email, username, userType,
          userType === 'entrepreneur' ? { companyName, cnpj } : null);

        const userData = {
          username, email, userType, userKey, uid: user.uid,
          createdAt: Date.now(), lastLogin: Date.now(), hasToken: true, deviceId
        };
        if (userType === 'entrepreneur') { userData.companyName = companyName; userData.cnpj = cnpj.replace(/\D/g, ''); }

        await set(ref(database, 'users/' + user.uid), userData);
        await set(ref(database, `userKeysData/${userKey}`), {
          authToken,
          authTokenDecoded: { createdAt: Date.now(), email, isPermanent: true, uid: user.uid, userType, username, version: "1.0" },
          criadoEm: Date.now(), email, hasAuthToken: true, isAnonymous: false, nome: username, uid: user.uid, deviceId
        });
        if (userType === 'entrepreneur') {
          await set(ref(database, 'entrepreneurs/' + user.uid), {
            companyName, cnpj: cnpj.replace(/\D/g, ''), ownerId: user.uid, ownerEmail: email, createdAt: Date.now()
          });
        }

        await saveAccountToDevice(userData);
        localStorage.setItem('auth_token', authToken);
        localStorage.setItem('token_user_id', user.uid);
        localStorage.setItem('current_userKey', userKey);

        showSuccess('✅ Conta criada! Você já pode usá-la.');
        
        // NÃO redireciona - apenas limpa o formulário
        document.getElementById('register-username').value = '';
        document.getElementById('register-email').value = '';
        document.getElementById('register-password').value = '';
        document.getElementById('register-confirm-password').value = '';
        if (userType === 'entrepreneur') {
          document.getElementById('register-company-name').value = '';
          document.getElementById('register-cnpj').value = '';
        }
        document.getElementById('already-logged-info').style.display = 'block';
        document.getElementById('loggedAsName').textContent = username;

      } catch(e) {
        showError(e.code === 'auth/email-already-in-use' ? 'Email já em uso' : 'Erro ao criar conta');
      }
      btn.disabled = false; btn.innerHTML = '✨ Criar Conta';
    };

    // ==================== LOGIN ====================
    window.login = async () => {
      hideMessages();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email) { showError('Email é obrigatório'); return; }
      if (!password) { showError('Senha é obrigatória'); return; }

      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> Entrando...';

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const userSnap = await get(ref(database, 'users/' + user.uid));
        if (!userSnap.exists()) { showError('Dados não encontrados'); btn.disabled = false; btn.innerHTML = '🔐 Entrar'; return; }

        const userData = userSnap.val();
        if (userData.userType === 'entrepreneur') {
          const cnpjInput = document.getElementById('login-cnpj').value.trim();
          document.getElementById('login-cnpj-group').style.display = 'block';
          if (!cnpjInput || cnpjInput.replace(/\D/g, '') !== userData.cnpj) {
            showError('CNPJ inválido'); btn.disabled = false; btn.innerHTML = '🔐 Entrar'; return;
          }
        }

        let userKey = userData.userKey || generateUserKey(user.uid);
        if (!userData.userKey) await update(ref(database, 'users/' + user.uid), { userKey });
        
        const authToken = generateAuthToken(user.uid, email, userData.username, userData.userType || 'normal',
          userData.userType === 'entrepreneur' ? { companyName: userData.companyName, cnpj: userData.cnpj } : null);

        await set(ref(database, `userKeysData/${userKey}`), {
          authToken,
          authTokenDecoded: { createdAt: Date.now(), email, isPermanent: true, uid: user.uid, userType: userData.userType || 'normal', username: userData.username, version: "1.0" },
          criadoEm: Date.now(), email, hasAuthToken: true, isAnonymous: false, nome: userData.username, uid: user.uid, deviceId
        });
        await update(ref(database, 'users/' + user.uid), { lastLogin: Date.now() });

        const accountData = {
          uid: user.uid, email, username: userData.username,
          userType: userData.userType || 'normal', userKey, lastLogin: Date.now()
        };
        await saveAccountToDevice(accountData);
        localStorage.setItem('auth_token', authToken);
        localStorage.setItem('token_user_id', user.uid);
        localStorage.setItem('current_userKey', userKey);

        showSuccess('✅ Login realizado! Você já está logado.');
        document.getElementById('already-logged-info').style.display = 'block';
        document.getElementById('loggedAsName').textContent = userData.username;
        
        // Limpar campos
        document.getElementById('login-email').value = '';
        document.getElementById('login-password').value = '';
        document.getElementById('login-cnpj').value = '';
        document.getElementById('login-cnpj-group').style.display = 'none';

      } catch(e) {
        const msgs = {
          'auth/user-not-found': 'Usuário não encontrado',
          'auth/wrong-password': 'Senha incorreta',
          'auth/invalid-email': 'Email inválido',
          'auth/too-many-requests': 'Muitas tentativas. Aguarde.'
        };
        showError(msgs[e.code] || 'Erro ao fazer login');
      }
      btn.disabled = false; btn.innerHTML = '🔐 Entrar';
    };

    // ==================== LOGIN GOOGLE ====================
    window.loginWithGoogle = async () => {
      hideMessages();
      const accounts = JSON.parse(localStorage.getItem('codehub_deviceAccounts') || '[]');
      if (accounts.length >= MAX_ACCOUNTS) { showError('Limite de 5 contas!'); return; }

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const username = user.displayName || user.email.split('@')[0];
        const userSnap = await get(ref(database, 'users/' + user.uid));
        let userType = 'normal', userKey;

        if (!userSnap.exists()) {
          userKey = generateUserKey(user.uid);
          await set(ref(database, 'users/' + user.uid), {
            username, email: user.email, userType: 'normal', userKey, uid: user.uid,
            createdAt: Date.now(), lastLogin: Date.now(), provider: 'google', hasToken: true, deviceId
          });
        } else {
          userType = userSnap.val().userType || 'normal';
          userKey = userSnap.val().userKey || generateUserKey(user.uid);
        }

        const authToken = generateAuthToken(user.uid, user.email, username, userType, null);
        await set(ref(database, `userKeysData/${userKey}`), {
          authToken,
          authTokenDecoded: { createdAt: Date.now(), email: user.email, isPermanent: true, uid: user.uid, userType, username, version: "1.0" },
          criadoEm: Date.now(), email: user.email, hasAuthToken: true, isAnonymous: false, nome: username, uid: user.uid, deviceId
        });

        const accountData = { uid: user.uid, email: user.email, username, userType, userKey, lastLogin: Date.now() };
        await saveAccountToDevice(accountData);
        localStorage.setItem('auth_token', authToken);
        localStorage.setItem('token_user_id', user.uid);
        localStorage.setItem('current_userKey', userKey);

        showSuccess('✅ Login Google realizado!');
        document.getElementById('already-logged-info').style.display = 'block';
        document.getElementById('loggedAsName').textContent = username;

      } catch(e) {
        if (e.code !== 'auth/popup-closed-by-user') showError('Erro ao fazer login com Google');
      }
    };

    init();
  </script>
