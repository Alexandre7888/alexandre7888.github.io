<script>
  const WORKER_URL = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";
  const MAX_TOKENS = 10;

  let userUID = null;
  let userToken = null;
  let currentEditToken = null;
  let allTokens = [];
  let sse = null;

  const tokenList = document.getElementById('tokenList');
  const tokenCount = document.getElementById('tokenCount');
  const editModal = document.getElementById('editModal');
  const editDomains = document.getElementById('editDomains');
  const editIPs = document.getElementById('editIPs');
  const editAppName = document.getElementById('editAppName');
  const editDescription = document.getElementById('editDescription');
  const editPhotoUrl = document.getElementById('editPhotoUrl');
  const editExpiry = document.getElementById('editExpiry');
  const expiryInfo = document.getElementById('expiryInfo');
  const modalTitle = document.getElementById('modalTitle');
  const scopeAppAuthCreateToken = document.getElementById('scopeAppAuthCreateToken');

  const ICONS = {
    success: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
    error: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    app: '<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>',
    users: '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
    inbox: '<svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>',
    eye: '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
  };

  function showToast(message, type = 'success') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = ICONS[type] + '<span>' + message + '</span>';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4500);
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function apiPost(path, body) {
    const r = await fetch(WORKER_URL + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    return await r.json();
  }

  function renderTokens(tokens) {
    allTokens = tokens || [];
    tokenCount.textContent = allTokens.length;

    if (allTokens.length === 0) {
      tokenList.innerHTML = `<div class="empty-state">${ICONS.inbox}<h3>Nenhum token criado</h3></div>`;
      return;
    }

    tokenList.innerHTML = '';

    allTokens.forEach(({ token, val }) => {
      const div = document.createElement('div');
      div.className = 'token-item';

      const accounts = val.tokenAccounts || {};
      const accountIds = Object.keys(accounts);
      const accountCount = accountIds.length;

      const appInitial = (val.appName || '?').charAt(0).toUpperCase();
      const appLogoHTML = val.photoUrl ? `<img src="${escapeHtml(val.photoUrl)}" alt="">` : appInitial;

      let expiryBadge = '';
      if (val.expiresAt) {
        const data = new Date(val.expiresAt);
        const dStr = data.toLocaleDateString('pt-BR') + ' ' + data.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        expiryBadge = `<div style="font-size:11px;color:#f8961e;margin-top:4px;">⏱ Expira: ${escapeHtml(dStr)}</div>`;
      }

      let accountsHtml = '';
      if (accountCount === 0) {
        accountsHtml = `<div class="acc-empty">Ninguém logou com este token ainda.</div>`;
      } else {
        accountIds.forEach(accId => {
          const acc = accounts[accId] || {};
          const initial = (acc.nome || acc.email || '?').charAt(0).toUpperCase();
          const avatarHTML = acc.photoUrl ? `<img src="${escapeHtml(acc.photoUrl)}" alt="">` : `<div class="acc-avatar">${initial}</div>`;
          accountsHtml += `
            <div class="account-row">
              ${avatarHTML}
              <div class="acc-info">
                <div class="acc-nome">${escapeHtml(acc.nome || 'Sem nome')}</div>
                <div class="acc-email">${escapeHtml(acc.email || 'sem email')}</div>
                <div class="acc-ip">${escapeHtml(acc.ip || '')}</div>
              </div>
            </div>
          `;
        });
      }

      div.innerHTML = `
        <div class="token-header">
          <div class="token-main">
            <div class="token-logo">${appLogoHTML}</div>
            <div class="token-text">
              <div class="token-name">${ICONS.app}<span>${escapeHtml(val.appName)}</span></div>
              <div class="token-domain">${escapeHtml(val.description || 'Sem descrição')}</div>
              ${expiryBadge}
            </div>
          </div>
          <div class="token-accounts" data-action="toggle-accounts" data-token="${token}">
            ${ICONS.users}<span>${accountCount}</span>
          </div>
        </div>
        <div class="token-actions">
          <button class="btn btn-info btn-sm" data-action="toggle-accounts" data-token="${token}">${ICONS.eye} Ver contas (${accountCount})</button>
          <button class="btn btn-warning btn-sm" data-action="edit" data-token="${token}">${ICONS.settings}</button>
        </div>
        <div class="accounts-list" id="accounts-${token}">
          ${accountsHtml}
        </div>
      `;

      tokenList.appendChild(div);
    });
  }

  function conectarSSE() {
    if (sse) sse.close();

    sse = new EventSource(WORKER_URL + "/api/tokens/stream?tokenid=" + encodeURIComponent(userToken));

    sse.addEventListener("connected", () => {
      console.log("[SSE] conectado");
    });

    sse.addEventListener("tokens", (e) => {
      try {
        const data = JSON.parse(e.data);
        console.log("[SSE] tokens atualizados:", data.total);
        renderTokens(data.tokens);
        if (data.apagados > 0) {
          showToast(`${data.apagados} token(s) expirado(s) apagado(s)`, "info");
        }
      } catch (err) { console.error("[SSE] erro:", err); }
    });

    sse.addEventListener("ping", () => { /* mantém conexão viva */ });

    sse.addEventListener("error", (e) => {
      try {
        const data = JSON.parse(e.data);
        showToast("Erro na stream: " + data.erro, "error");
      } catch {}
    });

    sse.addEventListener("timeout", () => {
      console.log("[SSE] timeout, reconectando...");
      sse.close();
      setTimeout(conectarSSE, 1000);
    });

    sse.onerror = () => {
      console.warn("[SSE] conexão perdida, tentando reconectar...");
      sse.close();
      setTimeout(conectarSSE, 3000);
    };
  }

  tokenList.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action], .token-accounts');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'edit') window.openEdit(btn.dataset.token);
    else if (action === 'toggle-accounts') window.toggleAccounts(btn.dataset.token);
  });

  window.toggleAccounts = function(token) {
    const el = document.getElementById(`accounts-${token}`);
    if (!el) return;
    el.classList.toggle('show');
  };

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(`.tab-content[data-content="${target}"]`).classList.add('active');
    });
  });

  function tsParaInputLocal(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function inputLocalParaTs(valor) {
    if (!valor) return null;
    const d = new Date(valor);
    if (isNaN(d.getTime())) return null;
    return d.getTime();
  }

  window.openEdit = function(token) {
    currentEditToken = token;
    const item = allTokens.find(t => t.token === token);
    if (!item) return;

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.tab[data-tab="info"]').classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector('.tab-content[data-content="info"]').classList.add('active');

    editAppName.value = item.val.appName || '';
    editDescription.value = item.val.description || '';
    editPhotoUrl.value = item.val.photoUrl || '';

    const domains = item.val.domains || [];
    editDomains.value = domains.map(d => {
      const limpo = String(d).replace(/^https?:\/\//i, '');
      return "https://" + limpo;
    }).join(', ');

    editIPs.value = (item.val.blockedIPs || []).join(', ');
    editExpiry.value = tsParaInputLocal(item.val.expiresAt);

    const scopes = item.val.scopes || {};
    scopeAppAuthCreateToken.checked = scopes.AppAuthCreateToken === true;

    if (item.val.expiresAt) {
      const data = new Date(item.val.expiresAt);
      expiryInfo.innerHTML = `⏱ <b>Expira em:</b> ${data.toLocaleString('pt-BR')}`;
    } else {
      expiryInfo.textContent = "Nenhuma data de validade definida.";
    }

    modalTitle.textContent = 'Configurar: ' + (item.val.appName || '');
    editModal.classList.add('active');
  };

  window.saveEdit = async function() {
    if (!currentEditToken) return;

    const appName = editAppName.value.trim();
    const description = editDescription.value.trim();
    const photoUrl = editPhotoUrl.value.trim();
    const ips = editIPs.value.split(',').map(s => s.trim()).filter(s => s);
    const domainsInput = editDomains.value.trim();

    if (!appName) return showToast('Nome do app obrigatório', 'error');

    if (photoUrl) {
      try {
        const u = new URL(photoUrl);
        if (u.protocol !== "http:" && u.protocol !== "https:") {
          return showToast('URL da foto precisa ser http:// ou https://', 'error');
        }
      } catch { return showToast('URL da foto inválida', 'error'); }
    }

    const expiresAt = inputLocalParaTs(editExpiry.value);
    const scopes = { AppAuthCreateToken: scopeAppAuthCreateToken.checked };

    try {
      const data = await apiPost("/api/tokens/update", {
        tokenid: userToken,
        tokenId: currentEditToken,
        appName, description, photoUrl,
        domainsInput,
        blockedIPs: ips,
        expiresAt,
        scopes
      });

      if (!data.ok) return showToast('Erro: ' + (data.erro || 'falha'), 'error');

      showToast('Configurações salvas', 'success');
      closeModal();
      // SSE vai atualizar automaticamente
    } catch (e) {
      showToast('Erro: ' + e.message, 'error');
    }
  };

  window.closeModal = function() {
    editModal.classList.remove('active');
    currentEditToken = null;
  };

  window.confirmarDeleteToken = async function() {
    if (!currentEditToken) return;
    if (!confirm('⚠️ Tem certeza que quer apagar esse token? Essa ação é permanente.')) return;

    try {
      const data = await apiPost("/api/tokens/delete", {
        tokenid: userToken,
        tokenId: currentEditToken
      });

      if (!data.ok) return showToast('Erro: ' + (data.erro || 'falha'), 'error');

      showToast('Token apagado', 'success');
      closeModal();
      // SSE vai atualizar automaticamente
    } catch (e) {
      showToast('Erro: ' + e.message, 'error');
    }
  };

  document.getElementById('createTokenForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!userUID) return showToast('Faça login primeiro', 'error');

    const name = document.getElementById('appName').value.trim();
    const size = parseInt(document.getElementById('tokenSize').value);

    if (!name) return showToast('Digite um nome', 'error');
    if (size < 20 || size > 200) return showToast('Tamanho entre 20 e 200', 'error');

    try {
      const data = await apiPost("/api/tokens/create", {
        tokenid: userToken,
        appName: name,
        size
      });

      if (!data.ok) return showToast('Erro: ' + (data.erro || 'falha'), 'error');

      showToast('Token criado com sucesso', 'success');
      document.getElementById('appName').value = '';
      // SSE vai atualizar automaticamente
    } catch (e) {
      showToast('Erro: ' + e.message, 'error');
    }
  });

  editModal.addEventListener('click', (e) => {
    if (e.target === editModal) closeModal();
  });

  (async () => {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js");
    const { getAuth, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js");

    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.appspot.com",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:7cc5bde34f4c5a5ce41b32"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'https://alexandre7888.github.io/CodeHUB/auth';
        return;
      }
      userUID = user.uid;
      userToken = await user.getIdToken();
      conectarSSE();
    });
  })();
</script>
