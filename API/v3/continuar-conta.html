<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Continuar Login v3</title>
  <style>
    :root { --primary-color: #4361ee; --secondary-color: #3f37c9; --danger-color: #f72585; --gray-color: #6c757d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .auth-container { width: 100%; max-width: 480px; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.2); animation: fadeIn 0.5s; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .auth-header { background: linear-gradient(to right, var(--primary-color), var(--secondary-color)); color: white; padding: 25px; text-align: center; }
    .auth-header h1 { font-size: 24px; }
    .auth-content { padding: 30px; text-align: center; }
    #status { margin: 15px 0; font-weight: bold; color: #212529; }
    .login-redirect { background: #f8f9fa; border-radius: 8px; padding: 15px; border-left: 4px solid var(--primary-color); }
    .login-link { display: inline-block; padding: 10px 20px; background: var(--primary-color); color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
    .account-list { margin-top: 20px; text-align: left; }
    .account-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 10px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; background: #f8f9fa; margin-bottom: 10px; }
    .account-item:hover { border-color: var(--primary-color); }
    .account-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 20px; flex-shrink: 0; text-transform: uppercase; }
    .account-info { flex:1; min-width:0; }
    .account-name { font-weight: 600; color: #212529; font-size: 16px; }
    .account-email { color: var(--gray-color); font-size: 13px; }
    .btn { padding: 12px; border-radius: 8px; border: none; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 8px; }
    .btn-primary { background: var(--primary-color); color: white; }
    .btn-primary:hover { background: var(--secondary-color); }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1 id="appTitle">Continuar Login</h1>
      <p id="appSubtitle">Selecione uma conta</p>
    </div>
    <div class="auth-content">
      <div id="status">Verificando...</div>
      <div id="account-selection" style="display:none;">
        <div id="account-list-container" class="account-list"></div>
        <button id="confirmAccountBtn" class="btn btn-primary">Continuar</button>
      </div>
      <div id="login-redirect" class="login-redirect" style="display:none;">
        <p>Você precisa fazer login</p>
        <a id="loginLink" href="#" class="login-link">Fazer Login</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.appspot.com",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:7cc5bde34f4c5a5ce41b32"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const appToken = urlParams.get('token');
    const redirectUrlParam = urlParams.get('redirecturl');

    let currentUser = null;
    let tokenData = null;
    let clientIP = '';

    async function getClientIP() {
      try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); return d.ip; } catch { return 'N/A'; }
    }

    function generateAccountId() {
      return 'acc_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    }

    async function loadTokenData(token) {
      let snap = await get(ref(db, `tokens/${token}`));
      if (!snap.exists()) snap = await get(ref(db, `tokens/token/${token}`));
      if (snap.exists()) return snap.val();
      throw new Error('Token inválido.');
    }

    async function saveCapturedAccount(uid, email, nome, ip, token) {
      const accountId = generateAccountId();
      const accountData = { id: accountId, nome: nome || 'Usuário', email: email || '', ip: ip || 'N/A', capturedAt: new Date().toISOString() };
      await set(ref(db, `tokens/${token}/accounts/${accountId}`), accountData);
      await set(ref(db, `tokens/token/${token}/accounts/${accountId}`), accountData);
    }

    function redirectToLogin() {
      window.location.href = appToken ? `https://alexandre7888.github.io/auth.html?token=${appToken}` : 'https://alexandre7888.github.io/auth.html';
    }

    async function init() {
      clientIP = await getClientIP();
      if (!appToken) return window.location.href = 'https://alexandre7888.github.io/auth.html';
      
      try {
        tokenData = await loadTokenData(appToken);
        document.getElementById('appTitle').textContent = tokenData.appName || 'Continuar Login';
        document.getElementById('appSubtitle').textContent = tokenData.domains?.[0] || 'App';
        
        if (tokenData.blockedIPs && tokenData.blockedIPs.includes(clientIP)) {
          document.getElementById('status').textContent = '🚫 Acesso Negado';
          return;
        }

        onAuthStateChanged(auth, async (user) => {
          if (!user) {
            document.getElementById('status').textContent = 'Não autenticado';
            document.getElementById('login-redirect').style.display = 'block';
            return;
          }
          currentUser = user;
          document.getElementById('login-redirect').style.display = 'none';
          document.getElementById('account-selection').style.display = 'block';
          document.getElementById('status').textContent = 'Carregando contas...';

          let masterKey = localStorage.getItem('codehub_masterKey');
          if (!masterKey) {
            const snap = await get(ref(db, `userKeysData/${user.uid}`));
            if (snap.exists()) masterKey = snap.val().masterKey || null;
          }
          if (!masterKey) {
            masterKey = 'master_' + Date.now() + '_' + Math.random().toString(36).substr(2,12);
            await set(ref(db, `userKeysData/${user.uid}/masterKey`), masterKey);
            localStorage.setItem('codehub_masterKey', masterKey);
          }

          const contasSnap = await get(ref(db, `contas/${masterKey}`));
          const accounts = contasSnap.exists() ? Object.values(contasSnap.val()) : [];
          const container = document.getElementById('account-list-container');
          container.innerHTML = '';
          
          accounts.forEach(acc => {
            const div = document.createElement('div');
            div.className = 'account-item';
            const initial = (acc.username || acc.email || '?').charAt(0).toUpperCase();
            div.innerHTML = `
              <div class="account-avatar" style="background:#4361ee;">${initial}</div>
              <div class="account-info">
                <div class="account-name">${acc.username || 'Usuário'}</div>
                <div class="account-email">${acc.email || ''}</div>
              </div>
            `;
            div.addEventListener('click', () => {
              document.querySelectorAll('.account-item').forEach(el => el.style.borderColor = 'transparent');
              div.style.borderColor = '#4361ee';
              document.getElementById('confirmAccountBtn').onclick = () => proceedWithAccount(acc.uid);
            });
            container.appendChild(div);
          });
          document.getElementById('status').textContent = `Selecione uma conta (${accounts.length} disponíveis)`;
        });
      } catch (e) {
        document.getElementById('status').textContent = '❌ Erro: ' + e.message;
      }
    }

    async function proceedWithAccount(uid) {
      document.getElementById('status').textContent = 'Preparando...';
      const userDataRef = ref(db, `userKeysData/${uid}`);
      const snap = await get(userDataRef);
      const userData = snap.exists() ? snap.val() : null;
      const nome = userData?.nome || userData?.username || currentUser?.displayName || 'Usuário';
      const email = userData?.email || currentUser?.email || '';
      
      await saveCapturedAccount(uid, email, nome, clientIP, appToken);
      
      const customDomain = tokenData.domains?.[0];
      if (!customDomain) return alert('Erro: Nenhum domínio configurado.');
      
      let finalUrl = redirectUrlParam || `https://${customDomain}/index.html`;
      const sep = finalUrl.includes('?') ? '&' : '?';
      window.location.href = finalUrl + sep + `userKey=${encodeURIComponent(uid)}`;
    }

    document.getElementById('loginLink').addEventListener('click', (e) => {
      e.preventDefault();
      redirectToLogin();
    });

    init();
  </script>
</body>
</html>
