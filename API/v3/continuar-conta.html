<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Continuar Login v3</title>
  <style>
    :root { --primary-color: #4361ee; --secondary-color: #3f37c9; --gray-color: #6c757d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .auth-container { width: 100%; max-width: 480px; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.2); animation: fadeIn 0.5s; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .auth-header { background: linear-gradient(to right, var(--primary-color), var(--secondary-color)); color: white; padding: 25px; text-align: center; }
    .auth-header h1 { font-size: 24px; }
    .auth-content { padding: 30px; text-align: center; }
    #status { margin: 15px 0; font-weight: bold; color: #212529; }
    .login-redirect { background: #f8f9fa; border-radius: 8px; padding: 15px; border-left: 4px solid var(--primary-color); }
    .login-link { display: inline-block; padding: 10px 20px; background: var(--primary-color); color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
    .account-list { margin-top: 20px; text-align: left; }
    .account-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 10px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; background: #f8f9fa; margin-bottom: 10px; }
    .account-item:hover { border-color: var(--primary-color); }
    .account-item.selected { border-color: #4361ee; }
    .account-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 20px; flex-shrink: 0; text-transform: uppercase; overflow: hidden; }
    .account-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .account-info { flex:1; min-width:0; }
    .account-name { font-weight: 600; color: #212529; font-size: 16px; }
    .account-email { color: var(--gray-color); font-size: 13px; }
    .btn { padding: 12px; border-radius: 8px; border: none; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 8px; }
    .btn-primary { background: var(--primary-color); color: white; }
    .btn-primary:hover { background: var(--secondary-color); }
    .debug { margin-top: 20px; text-align: left; background:#0f172a; color:#e2e8f0; padding:14px; border-radius:10px; font-family: monospace; font-size: 11px; display:none; }
    .debug pre { white-space: pre-wrap; word-break: break-all; margin-top: 4px; max-height: 140px; overflow: auto; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1 id="appTitle">Continuar Login</h1>
      <p id="appSubtitle">Selecione uma conta</p>
    </div>
    <div class="auth-content">
      <div id="status">Verificando...</div>
      <div id="account-selection" style="display:none;">
        <div id="account-list-container" class="account-list"></div>
        <button id="confirmAccountBtn" class="btn btn-primary">Continuar</button>
      </div>
      <div id="login-redirect" class="login-redirect" style="display:none;">
        <p>Você precisa fazer login</p>
        <a id="loginLink" href="#" class="login-link">Fazer Login</a>
      </div>

      <div class="debug" id="debugPanel">
        <div><b>authid:</b> <span id="dbgAuthId">—</span></div>
        <div><b>firebaseIdToken (início):</b></div>
        <pre id="dbgIdToken">—</pre>
        <div><b>Resposta do Worker:</b></div>
        <pre id="dbgResp">—</pre>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    // ⚙️ CONFIG
    const WORKER = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";

    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.appspot.com",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:7cc5bde34f4c5a5ce41b32"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getDatabase(app);

    const urlParams        = new URLSearchParams(window.location.search);
    const appToken         = urlParams.get('token');
    const authId           = urlParams.get('authid');    // OBRIGATÓRIO
    const redirectUrlParam = urlParams.get('redirecturl');

    let currentUser = null;
    let clientIP = '';
    let contaSelecionada = null;

    // ===== Helpers de debug =====
    function setDbg(k, v) {
      const panel = document.getElementById('debugPanel');
      if (panel) panel.style.display = 'block';
      if (k === 'authid') document.getElementById('dbgAuthId').textContent = v;
      if (k === 'token')  document.getElementById('dbgIdToken').textContent = v ? (v.slice(0,120) + '...') : '—';
      if (k === 'resp')   document.getElementById('dbgResp').textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    }

    async function getClientIP() {
      try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); return d.ip; } catch { return 'N/A'; }
    }

    function generateAccountId() {
      return 'acc_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    }

    async function saveCapturedAccount(uid, email, nome, ip, token) {
      const accountId = generateAccountId();
      const accountData = { id: accountId, uid, nome: nome || 'Usuário', email: email || '', ip: ip || 'N/A', capturedAt: new Date().toISOString() };
      await set(ref(db, `tokens/${token}/accounts/${accountId}`), accountData);
      await set(ref(db, `tokens/token/${token}/accounts/${accountId}`), accountData);
    }

    function redirectToLogin() {
      const base = 'https://alexandre7888.github.io/auth.html';
      const params = new URLSearchParams();
      if (appToken) params.set('token', appToken);
      if (authId)   params.set('authid', authId);
      window.location.href = params.toString() ? `${base}?${params}` : base;
    }

    // Monta a conta a partir do próprio user logado no Firebase Auth
    function buildContaFromUser(user) {
      return {
        uid: user.uid,
        username: user.displayName || (user.email ? user.email.split('@')[0] : 'Usuário'),
        nome: user.displayName || (user.email ? user.email.split('@')[0] : 'Usuário'),
        email: user.email || '',
        photoURL: user.photoURL || null
      };
    }

    // Renderiza a conta do user logado
    function renderizarConta(conta) {
      const container = document.getElementById('account-list-container');
      container.innerHTML = '';

      const div = document.createElement('div');
      div.className = 'account-item selected';

      const initial = (conta.username || conta.email || '?').charAt(0).toUpperCase();
      const avatarHTML = conta.photoURL
        ? `<img src="${conta.photoURL}" alt="">`
        : initial;

      div.innerHTML = `
        <div class="account-avatar" style="background:#4361ee;">${avatarHTML}</div>
        <div class="account-info">
          <div class="account-name">${conta.username || 'Usuário'}</div>
          <div class="account-email">${conta.email || ''}</div>
        </div>
      `;

      div.addEventListener('click', () => {
        document.querySelectorAll('.account-item').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        contaSelecionada = conta;
      });

      container.appendChild(div);
      contaSelecionada = conta;
    }

    // Envia authId + firebaseIdToken pro Worker
    async function enviarTokenParaWorker(authIdVal, firebaseIdToken) {
      const r = await fetch(`${WORKER}/ConfirmarAuth`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          authId: authIdVal,
          firebaseIdToken: firebaseIdToken
        })
      });
      const txt = await r.text();
      let body;
      try { body = JSON.parse(txt); } catch { body = txt; }
      return { status: r.status, body };
    }

    function fecharPopup() {
      document.getElementById('status').textContent = '✅ Autenticado! Fechando...';
      setTimeout(() => {
        try { window.close(); } catch {}
      }, 900);
    }

    async function init() {
      clientIP = await getClientIP();

      if (!authId) {
        document.getElementById('status').textContent = '❌ Falta ?authid= na URL';
        setDbg('authid', '(nenhum)');
        return;
      }

      setDbg('authid', authId);
      document.getElementById('appSubtitle').textContent = 'Aguardando conta';

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          document.getElementById('status').textContent = 'Não autenticado';
          document.getElementById('login-redirect').style.display = 'block';
          return;
        }

        currentUser = user;

        document.getElementById('login-redirect').style.display = 'none';
        document.getElementById('account-selection').style.display = 'block';

        // 🆕 Conta vem direto do Firebase Auth (sem masterKey)
        const conta = buildContaFromUser(user);
        renderizarConta(conta);

        document.getElementById('status').textContent = 'Conta carregada. Clique em Continuar.';
        document.getElementById('confirmAccountBtn').onclick = () => proceedWithAccount();
      });
    }

    async function proceedWithAccount() {
      if (!contaSelecionada || !currentUser) {
        document.getElementById('status').textContent = '⚠️ Selecione uma conta';
        return;
      }

      document.getElementById('status').textContent = 'Preparando...';

      const uid   = contaSelecionada.uid;
      const nome  = contaSelecionada.nome || contaSelecionada.username || 'Usuário';
      const email = contaSelecionada.email || '';

      // Salva captura (só se tiver token do app)
      if (appToken) {
        try { await saveCapturedAccount(uid, email, nome, clientIP, appToken); } catch {}
      }

      // 🔑 Pega o Firebase ID token (JWT)
      let firebaseIdToken = null;
      try {
        firebaseIdToken = await currentUser.getIdToken(true);
        setDbg('token', firebaseIdToken);
      } catch (e) {
        document.getElementById('status').textContent = '❌ Erro ao pegar token: ' + e.message;
        return;
      }

      // 📤 Envia pro Worker (authId + firebaseIdToken)
      document.getElementById('status').textContent = 'Enviando autenticação...';
      try {
        const resp = await enviarTokenParaWorker(authId, firebaseIdToken);
        setDbg('resp', resp.body);

        if (resp.status === 200 && resp.body?.ok) {
          fecharPopup();
        } else {
          document.getElementById('status').textContent = '⚠️ Worker respondeu ' + resp.status;
        }
      } catch (e) {
        setDbg('resp', 'ERRO: ' + e.message);
        document.getElementById('status').textContent = '❌ Erro ao contatar servidor: ' + e.message;
      }
    }

    document.getElementById('loginLink').addEventListener('click', (e) => {
      e.preventDefault();
      redirectToLogin();
    });

    init();
  </script>
</body>
</html>
