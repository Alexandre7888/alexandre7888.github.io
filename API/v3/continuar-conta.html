<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Continuar Login v3</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root, html[data-theme="dark"]{
      --bg-1:#0a0e1a;--bg-2:#05070f;--canvas-bg:#0f1424;
      --surface:#101626;--surface-2:#151c30;
      --border:#1f2a44;--border-strong:#2d3b5c;
      --text:#e8eef8;--text-2:#8fa0bd;
      --accent:#4f8cff;--accent-2:#7aa8ff;
      --accent-glow:rgba(79,140,255,0.35);
      --accent-soft:rgba(79,140,255,0.1);
      --shadow:rgba(0,0,0,0.55);
      --menu-bg:rgba(10,15,28,0.9);
      --menu-hover:rgba(79,140,255,0.1);
      --toggle-bg:#151c30;--toggle-border:#2d3b5c;
    }

    html[data-theme="light"]{
      --bg-1:#f7f9fc;--bg-2:#eef2f8;--canvas-bg:#ffffff;
      --surface:#ffffff;--surface-2:#f5f8fd;
      --border:#e2e8f2;--border-strong:#c8d3e5;
      --text:#0f172a;--text-2:#5b6b85;
      --accent:#2563eb;--accent-2:#3b82f6;
      --accent-glow:rgba(37,99,235,0.25);
      --accent-soft:rgba(37,99,235,0.07);
      --shadow:rgba(15,23,42,0.08);
      --menu-bg:rgba(255,255,255,0.92);
      --menu-hover:rgba(37,99,235,0.08);
      --toggle-bg:#f1f5fb;--toggle-border:#d6e0ee;
    }

    body{
      background:radial-gradient(circle at 30% 20%,var(--bg-1),var(--bg-2));
      font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
      color:var(--text);min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:20px;
      transition:background .4s ease,color .3s ease;
      gap:22px;
    }

    /* ===== FOTO DO APP (fora do card) ===== */
    .app-avatar-wrap{
      width:88px;height:88px;
      border-radius:50%;
      position:relative;
      display:flex;align-items:center;justify-content:center;
      animation:fadeIn .6s;
      flex-shrink:0;
    }
    .app-avatar-wrap::before{
      content:'';
      position:absolute;inset:-6px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      opacity:.35;
      filter:blur(14px);
      z-index:0;
    }
    .app-avatar{
      width:88px;height:88px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:800;font-size:34px;
      text-transform:uppercase;
      overflow:hidden;
      border:3px solid var(--surface);
      box-shadow:0 12px 30px var(--accent-glow);
      position:relative;
      z-index:1;
    }
    .app-avatar img{width:100%;height:100%;object-fit:cover}

    .auth-container{
      width:100%;max-width:480px;
      background:var(--surface);
      border-radius:32px;overflow:hidden;
      box-shadow:0 20px 45px -10px var(--shadow),0 0 0 1px var(--border) inset;
      position:relative;
      animation:fadeIn .5s;
    }
    .auth-container::before{
      content:'';position:absolute;top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    .auth-header{
      background:linear-gradient(to right,var(--accent),var(--accent-2));
      color:#fff;padding:28px 24px;text-align:center;
    }
    .auth-header h1{font-size:1.45rem;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;justify-content:center;gap:10px}
    .auth-header h1::before{content:'';width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}
    .auth-header p{font-size:.8rem;opacity:.85;margin-top:6px;letter-spacing:.3px}

    .auth-content{padding:30px 28px;text-align:center}

    #status{
      margin:6px 0 18px;
      font-weight:600;color:var(--text);
      font-size:.95rem;
      min-height:22px;
    }

    .login-redirect{
      background:var(--surface-2);
      border:1px solid var(--border);
      border-left:4px solid var(--accent);
      border-radius:16px;padding:18px;
      margin-top:10px;
    }
    .login-redirect p{color:var(--text-2);font-size:.9rem;margin-bottom:10px}
    .login-link{
      display:inline-block;padding:11px 22px;
      background:var(--accent);color:#fff;
      text-decoration:none;border-radius:12px;
      font-weight:600;font-size:.9rem;
      transition:.25s;box-shadow:0 0 12px var(--accent-glow);
    }
    .login-link:hover{background:var(--accent-2);transform:scale(1.03)}

    .account-list{margin-top:6px;text-align:left}

    .account-item{
      display:flex;align-items:center;gap:14px;
      padding:14px 16px;border-radius:16px;
      cursor:pointer;transition:.2s;
      border:2px solid transparent;
      background:var(--surface-2);
      margin-bottom:10px;
    }
    .account-item:hover{
      border-color:var(--accent);
      box-shadow:0 0 15px var(--accent-glow);
    }
    .account-item.selected{
      border-color:var(--accent);
      background:var(--accent-soft);
    }
    .account-avatar{
      width:46px;height:46px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:700;font-size:20px;
      flex-shrink:0;text-transform:uppercase;overflow:hidden;
      background:var(--accent);
    }
    .account-avatar img{width:100%;height:100%;object-fit:cover}
    .account-info{flex:1;min-width:0}
    .account-name{font-weight:600;color:var(--text);font-size:15px}
    .account-email{color:var(--text-2);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .btn{
      padding:13px;border-radius:14px;border:none;
      font-weight:600;font-size:.95rem;cursor:pointer;
      transition:.25s;width:100%;margin-top:10px;
      font-family:inherit;
    }
    .btn-primary{
      background:var(--accent);color:#fff;
      box-shadow:0 6px 20px var(--accent-glow);
    }
    .btn-primary:hover{background:var(--accent-2);transform:translateY(-1px);box-shadow:0 8px 24px var(--accent-glow)}
    .btn-primary:active{transform:translateY(0) scale(.98)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .theme-panel{
      position:fixed;bottom:24px;right:24px;z-index:1050;
      background:var(--menu-bg);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-radius:48px;padding:6px;display:flex;gap:6px;
      border:1px solid var(--border);
      box-shadow:0 8px 20px var(--shadow);
    }
    .theme-btn{
      background:transparent;border:none;border-radius:40px;
      padding:8px 14px;font-size:.8rem;font-weight:600;
      cursor:pointer;color:var(--text-2);
      display:flex;align-items:center;gap:6px;
      transition:.2s;font-family:inherit;
    }
    .theme-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
    .theme-btn:hover{color:var(--text);background:var(--accent-soft)}
    .theme-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent-glow)}
    .theme-btn.active svg{stroke:#fff}

    @media(max-width:550px){
      .theme-btn{font-size:.7rem;padding:6px 10px}
      .theme-btn svg{width:14px;height:14px}
      .auth-content{padding:24px 20px}
      .auth-header{padding:24px 18px}
      .app-avatar-wrap, .app-avatar{width:72px;height:72px}
      .app-avatar{font-size:28px}
    }
  </style>
</head>
<body>

  <!-- FOTO DO APP (acima do card, fora dele) -->
  <div class="app-avatar-wrap" id="appAvatarWrap" style="display:none;">
    <div class="app-avatar" id="appAvatar">?</div>
  </div>

  <div class="auth-container">
    <div class="auth-header">
      <h1 id="appTitle">Continuar Login</h1>
      <p id="appSubtitle">Selecione uma conta</p>
    </div>
    <div class="auth-content">
      <div id="status">Verificando...</div>

      <div id="account-selection" style="display:none;">
        <div id="account-list-container" class="account-list"></div>
        <button id="confirmAccountBtn" class="btn btn-primary">Continuar</button>
      </div>

      <div id="login-redirect" class="login-redirect" style="display:none;">
        <p>Você precisa fazer login</p>
        <a id="loginLink" href="#" class="login-link">Fazer Login</a>
      </div>
    </div>
  </div>

  <div class="theme-panel">
    <button class="theme-btn active" id="themeDark">
      <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <span>Escuro</span>
    </button>
    <button class="theme-btn" id="themeLight">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <span>Claro</span>
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const WORKER = "https://proud-flower-677b.braatzjunioralexandre5.workers.dev";

    const firebaseConfig = {
      apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
      authDomain: "html-15e80.firebaseapp.com",
      databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
      projectId: "html-15e80",
      storageBucket: "html-15e80.appspot.com",
      messagingSenderId: "1068148640439",
      appId: "1:1068148640439:web:7cc5bde34f4c5a5ce41b32"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const appToken         = urlParams.get('token');
    const authId           = urlParams.get('authid');
    const redirectUrlParam = urlParams.get('redirecturl');

    let currentUser = null;
    let clientIP = '';
    let contaSelecionada = null;
    let tokenData = null;

    // ===== TEMA =====
    function aplicarTema(tema) {
      document.documentElement.setAttribute('data-theme', tema);
      localStorage.setItem('theme', tema);
      document.getElementById('themeDark').classList.toggle('active', tema === 'dark');
      document.getElementById('themeLight').classList.toggle('active', tema === 'light');
    }
    aplicarTema(localStorage.getItem('theme') || 'dark');
    document.getElementById('themeDark').addEventListener('click', () => aplicarTema('dark'));
    document.getElementById('themeLight').addEventListener('click', () => aplicarTema('light'));

    function setStatus(txt) {
      document.getElementById('status').textContent = txt;
    }

    async function getClientIP() {
      try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); return d.ip; } catch { return 'N/A'; }
    }

    function generateAccountId() {
      return 'acc_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    }

    // ===== carrega dados do token via WORKER (backend) =====
    async function loadTokenData(token) {
      const r = await fetch(`${WORKER}/TokenData?token=${encodeURIComponent(token)}`);
      const d = await r.json();
      if (!d.ok || !d.data) throw new Error(d.erro || 'Token inválido.');
      return d.data;
    }

    function redirectToLogin() {
      const base = 'https://alexandre7888.github.io/auth.html';
      const params = new URLSearchParams();
      if (appToken) params.set('token', appToken);
      if (authId)   params.set('authid', authId);
      if (redirectUrlParam) params.set('redirecturl', redirectUrlParam);
      window.location.href = params.toString() ? `${base}?${params}` : base;
    }

    // ============================================
    // VALIDAR DOMÍNIO — SÓ HTTPS
    // ============================================
    function validarDominio(tokenData, redirectUrl) {
      let lista = [];
      const raw = tokenData.domains;

      if (Array.isArray(raw)) lista = raw;
      else if (raw && typeof raw === "object") lista = Object.values(raw);
      else if (typeof raw === "string") lista = [raw];

      lista = lista
        .map(d => String(d || "").trim().toLowerCase())
        .map(d => d.replace(/^https?:\/\//, "").replace(/\/+$/, "").split("/")[0])
        .filter(Boolean);

      if (lista.length === 0) return { ok: false, erro: "Este token não tem domínios configurados." };
      if (!redirectUrl) return { ok: false, erro: "redirecturl não informado." };

      const urlLower = redirectUrl.toLowerCase();

      if (urlLower.startsWith("http://")) return { ok: false, erro: "Apenas HTTPS é permitido. Use https://" };
      if (urlLower.startsWith("file://") || urlLower.startsWith("about:") || urlLower.startsWith("data:") || urlLower.startsWith("blob:") || urlLower.startsWith("javascript:")) {
        return { ok: false, erro: "URL inválida: use https://" };
      }

      let parsed;
      try { parsed = new URL(redirectUrl); }
      catch (e) { return { ok: false, erro: "URL de redirecionamento inválida." }; }

      if (parsed.protocol !== "https:") return { ok: false, erro: "Apenas HTTPS é permitido. Protocolo atual: " + parsed.protocol };

      const host = parsed.hostname.toLowerCase();
      if (!host || host === "about" || host === "null") return { ok: false, erro: "Hostname inválido na URL de redirecionamento." };

      const autorizado = lista.some(d => host === d || host.endsWith("." + d));
      if (!autorizado) return { ok: false, erro: `Domínio não autorizado: ${host}` };

      return { ok: true, host };
    }

    // ============================================
    // CAPTURAR CONTA
    // ============================================
    async function capturarConta(token, accountData) {
      try {
        await set(ref(db, `tokens/${token}/tokenAccounts/${accountData.id}`), accountData);
        return { ok: true };
      } catch (e) {
        return { ok: false, erro: "Falha ao gravar conta: " + e.message };
      }
    }

    async function confirmarNoWorker(authIdVal, firebaseIdToken, uid) {
      const r = await fetch(`${WORKER}/ConfirmarAuth`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ authId: authIdVal, firebaseIdToken, uid })
      });
      const txt = await r.text();
      let body;
      try { body = JSON.parse(txt); } catch { body = txt; }
      return { status: r.status, body };
    }

    function voltarParaRedirect() {
      setTimeout(() => {
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.location.href = redirectUrlParam;
            window.close();
            return;
          } catch (e) {
            try {
              window.opener.postMessage({ type: 'AUTH_DONE', url: redirectUrlParam }, '*');
              setTimeout(() => { try { window.close(); } catch {} }, 300);
              return;
            } catch {}
          }
        }
        window.location.href = redirectUrlParam;
      }, 700);
    }

    function buildContaFromUser(user) {
      return {
        uid: user.uid,
        username: user.displayName || (user.email ? user.email.split('@')[0] : 'Usuário'),
        nome: user.displayName || (user.email ? user.email.split('@')[0] : 'Usuário'),
        email: user.email || '',
        photoURL: user.photoURL || null
      };
    }

    function renderizarConta(conta) {
      const container = document.getElementById('account-list-container');
      container.innerHTML = '';

      const div = document.createElement('div');
      div.className = 'account-item selected';

      const initial = (conta.username || conta.email || '?').charAt(0).toUpperCase();
      const avatarHTML = conta.photoURL
        ? `<img src="${conta.photoURL}" alt="">`
        : initial;

      div.innerHTML = `
        <div class="account-avatar">${avatarHTML}</div>
        <div class="account-info">
          <div class="account-name">${conta.username || 'Usuário'}</div>
          <div class="account-email">${conta.email || ''}</div>
        </div>
      `;

      div.addEventListener('click', () => {
        document.querySelectorAll('.account-item').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        contaSelecionada = conta;
      });

      container.appendChild(div);
      contaSelecionada = conta;
    }

    // ===== aplica foto do app como favicon + avatar =====
    function aplicarFotoDoApp(photoUrl, appName) {
      const wrap = document.getElementById('appAvatarWrap');
      const avatarEl = document.getElementById('appAvatar');

      if (photoUrl) {
        avatarEl.innerHTML = `<img src="${photoUrl}" alt="">`;
        wrap.style.display = 'flex';

        // favicon
        const link = document.querySelector('link[rel="icon"]') || document.createElement('link');
        link.rel = 'icon';
        link.href = photoUrl;
        document.head.appendChild(link);
      } else {
        // sem foto, usa inicial do nome
        const initial = (appName || '?').charAt(0).toUpperCase();
        avatarEl.textContent = initial;
        wrap.style.display = 'flex';
      }
    }

    async function init() {
      clientIP = await getClientIP();

      if (!redirectUrlParam) { setStatus('❌ Falta ?redirecturl= na URL'); return; }
      if (!authId) { setStatus('❌ Falta ?authid= na URL'); return; }
      if (!appToken) { setStatus('❌ Falta ?token= na URL'); return; }

      try {
        // 🔥 carrega token via WORKER (não direto do Firebase)
        tokenData = await loadTokenData(appToken);

        document.getElementById('appTitle').textContent = tokenData.appName || 'Continuar Login';

        // mostra foto ou inicial do app
        aplicarFotoDoApp(tokenData.photoUrl, tokenData.appName);

        // subtítulo com o domínio
        document.getElementById('appSubtitle').textContent =
          (tokenData.domains && Object.values(tokenData.domains)[0]) || 'App';

        // ===== valida IP via campo dentro do token =====
        if (tokenData.blockedIPs && Array.isArray(tokenData.blockedIPs) && tokenData.blockedIPs.includes(clientIP)) {
          setStatus('🚫 Acesso Negado');
          return;
        }

        // ===== valida expiração =====
        if (tokenData.expiresAt && Date.now() > tokenData.expiresAt) {
          setStatus('🚫 Token expirado');
          return;
        }

        // ===== valida domínio =====
        const check = validarDominio(tokenData, redirectUrlParam);
        if (!check.ok) {
          setStatus('🚫 ' + check.erro);
          return;
        }

        setStatus('Verificando autenticação...');

        onAuthStateChanged(auth, async (user) => {
          if (!user) {
            setStatus('Não autenticado');
            document.getElementById('login-redirect').style.display = 'block';
            return;
          }

          currentUser = user;

          document.getElementById('login-redirect').style.display = 'none';
          document.getElementById('account-selection').style.display = 'block';

          const conta = buildContaFromUser(user);
          renderizarConta(conta);

          setStatus('Conta carregada. Clique em Continuar.');
          document.getElementById('confirmAccountBtn').onclick = () => proceedWithAccount();
        });

      } catch (e) {
        setStatus('❌ Erro: ' + e.message);
      }
    }

    async function proceedWithAccount() {
      if (!contaSelecionada || !currentUser) {
        setStatus('⚠️ Selecione uma conta');
        return;
      }

      const btn = document.getElementById('confirmAccountBtn');
      btn.disabled = true;
      setStatus('Preparando...');

      const uid   = contaSelecionada.uid;
      const nome  = contaSelecionada.nome || contaSelecionada.username || 'Usuário';
      const email = contaSelecionada.email || '';
      const photoUrl = contaSelecionada.photoURL || null;

      const accountData = {
        id: generateAccountId(),
        uid,
        nome,
        email,
        photoUrl,
        ip: clientIP || 'N/A',
        capturedAt: new Date().toISOString()
      };

      setStatus('Gravando conta...');
      const resp = await capturarConta(appToken, accountData);

      if (!resp.ok) {
        setStatus('❌ ' + resp.erro);
        btn.disabled = false;
        return;
      }

      setStatus('Confirmando autenticação...');
      let firebaseIdToken = null;
      try {
        firebaseIdToken = await currentUser.getIdToken(true);
      } catch (e) {
        setStatus('❌ Erro ao pegar token: ' + e.message);
        btn.disabled = false;
        return;
      }

      if (!firebaseIdToken) {
        setStatus('❌ firebaseIdToken vazio');
        btn.disabled = false;
        return;
      }

      try {
        await confirmarNoWorker(authId, firebaseIdToken, uid);
      } catch (e) {
        console.warn("Falha ao confirmar no Worker:", e);
      }

      setStatus('✅ Autenticado! Voltando...');
      voltarParaRedirect();
    }

    document.getElementById('loginLink').addEventListener('click', (e) => {
      e.preventDefault();
      redirectToLogin();
    });

    init();
  </script>
</body>
</html>
