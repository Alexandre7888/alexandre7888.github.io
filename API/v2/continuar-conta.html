<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Continuar Login com Usuário v2</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --danger-color: #f72585;
            --success-color: #4cc9f0;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --gray-color: #6c757d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 25px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .auth-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .auth-content {
            padding: 30px;
            text-align: center;
        }

        #status {
            margin: 20px 0;
            font-weight: bold;
            color: var(--dark-color);
            font-size: 16px;
        }

        #username {
            font-size: 1.2rem;
            margin: 15px 0;
            color: var(--dark-color);
        }

        #continueBtn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        #continueBtn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        #continueBtn:disabled {
            background-color: var(--gray-color);
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: var(--danger-color);
            font-size: 13px;
            margin-top: 15px;
        }

        .login-redirect {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .login-redirect p {
            margin-bottom: 10px;
            color: var(--dark-color);
        }

        .login-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .login-link:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .header-actions {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .home-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .home-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .token-info {
            background: #e7f3ff;
            border-left: 4px solid var(--primary-color);
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            font-size: 12px;
            word-break: break-all;
            text-align: left;
        }

        /* Estilos para a lista de contas (seletor) */
        .account-list {
            margin-top: 20px;
            text-align: left;
        }

        .account-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            border: 2px solid transparent;
            background: #f8f9fa;
            margin-bottom: 10px;
        }

        .account-item:hover {
            background: #e9ecef;
            border-color: var(--accent-color);
        }

        .account-item.selected {
            border-color: var(--primary-color);
            background: #e7f3ff;
        }

        .account-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .account-info {
            flex: 1;
            min-width: 0;
        }

        .account-name {
            font-weight: 600;
            color: var(--dark-color);
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-email {
            color: var(--gray-color);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-check {
            color: var(--primary-color);
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .account-item.selected .account-check {
            opacity: 1;
        }

        .account-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .account-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--gray-color);
            color: var(--gray-color);
        }

        .btn-outline:hover {
            background: #f1f3f5;
        }

        @media (max-width: 480px) {
            .auth-container {
                border-radius: 12px;
            }

            .auth-header {
                padding: 20px;
            }

            .auth-content {
                padding: 20px;
            }

            .header-actions {
                top: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header-actions">
        <button class="home-btn" onclick="goToIndex()">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 16px; height: 16px;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            Início
        </button>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <h1>Continuar Login</h1>
            <p>Complete o processo de autenticação</p>
        </div>

        <div class="auth-content">
            <p id="status">Verificando autenticação...</p>
            <p id="username"></p>
            <div id="user-info"></div>
            <div id="auth-token-display" class="token-info" style="display: none;"></div>
            <!-- Área para a lista de contas -->
            <div id="account-selection" style="display: none;">
                <div style="margin-bottom: 12px; font-size: 14px; color: var(--dark-color); font-weight: 500;">
                    Selecione uma conta para continuar
                </div>
                <div id="account-list-container" class="account-list"></div>
                <div class="account-actions">
                    <button id="confirmAccountBtn" class="btn-primary">Continuar com esta conta</button>
                    <button id="cancelSelectionBtn" class="btn-outline">Cancelar</button>
                </div>
            </div>
            <button id="continueBtn" style="display: none;">Continuar</button>
            <div id="login-redirect" class="login-redirect" style="display: none;">
                <p>Você precisa fazer login para continuar</p>
                <a id="loginLink" href="#" class="login-link">Fazer Login</a>
            </div>
            <p id="error" class="error-message"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDon4WbCbe4kCkUq-OdLBRhzhMaUObbAfo",
            authDomain: "html-15e80.firebaseapp.com",
            databaseURL: "https://html-15e80-default-rtdb.firebaseio.com",
            projectId: "html-15e80",
            storageBucket: "html-15e80.appspot.com",
            messagingSenderId: "1068148640439",
            appId: "1:1068148640439:web:7cc5bde34f4c5a5ce41b32",
            measurementId: "G-V57KRZ02HJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const statusEl = document.getElementById('status');
        const usernameEl = document.getElementById('username');
        const userInfoEl = document.getElementById('user-info');
        const continueBtn = document.getElementById('continueBtn');
        const errorEl = document.getElementById('error');
        const loginRedirectEl = document.getElementById('login-redirect');
        const loginLinkEl = document.getElementById('loginLink');
        const authTokenDisplay = document.getElementById('auth-token-display');
        const accountSelectionDiv = document.getElementById('account-selection');
        const accountListContainer = document.getElementById('account-list-container');
        const confirmAccountBtn = document.getElementById('confirmAccountBtn');
        const cancelSelectionBtn = document.getElementById('cancelSelectionBtn');

        // Pega token da URL
        const urlParams = new URLSearchParams(window.location.search);
        const appToken = urlParams.get('token');

        // Variáveis de estado
        let currentUser = null;
        let accountsList = [];
        let selectedAccountUid = null;

        // Função para decodificar token base64
        function decodeAuthToken(token) {
            try {
                const jsonString = decodeURIComponent(escape(atob(token)));
                return JSON.parse(jsonString);
            } catch (error) {
                console.error("Erro ao decodificar token:", error);
                return null;
            }
        }

        // Busca token do usuário no Firebase
        async function fetchUserAuthTokenFromFirebase(userId) {
            try {
                const tokenRef = ref(db, `tokens/${userId}`);
                const snapshot = await get(tokenRef);
                if (snapshot.exists()) {
                    const tokenData = snapshot.val();
                    if (tokenData.token) {
                        return tokenData.token;
                    }
                }
                return null;
            } catch (error) {
                console.error("Erro ao buscar token do Firebase:", error);
                return null;
            }
        }

        // Busca token do localStorage
        function getLocalAuthToken() {
            try {
                const localToken = localStorage.getItem('auth_token');
                if (localToken) {
                    return localToken;
                }
                return null;
            } catch (error) {
                console.error("Erro ao ler localStorage:", error);
                return null;
            }
        }

        // Função para obter o token de autenticação do usuário
        async function getUserAuthToken(userId) {
            let authToken = await fetchUserAuthTokenFromFirebase(userId);
            if (!authToken) {
                authToken = getLocalAuthToken();
            }
            return authToken;
        }

        // Função para ir para index.html
        window.goToIndex = function() {
            window.location.href = 'https://alexandre7888.github.io/auth.html';
        };

        function disableContinue() {
            continueBtn.disabled = true;
            errorEl.textContent = 'Não é possível continuar no momento.';
        }

        function redirectToLogin() {
            if (appToken) {
                window.location.href = `https://alexandre7888.github.io/auth.html?token=${appToken}`;
            } else {
                window.location.href = 'https://alexandre7888.github.io/auth.html';
            }
        }

        // Configura o link de login
        loginLinkEl.addEventListener('click', (e) => {
            e.preventDefault();
            redirectToLogin();
        });

        // Cancelar seleção
        cancelSelectionBtn.addEventListener('click', () => {
            // Volta para a tela de login
            redirectToLogin();
        });

        // Confirmar seleção
        confirmAccountBtn.addEventListener('click', () => {
            if (!selectedAccountUid) {
                errorEl.textContent = 'Selecione uma conta primeiro.';
                return;
            }

            // Redirecionar com a conta selecionada
            proceedWithAccount(selectedAccountUid);
        });

        // Função para prosseguir com uma conta específica
        async function proceedWithAccount(uid) {
            try {
                statusEl.textContent = 'Preparando sua sessão...';

                // Buscar dados do usuário selecionado para garantir que temos tudo
                const userDataRef = ref(db, `userKeysData/${uid}`);
                const snap = await get(userDataRef);
                let userData = snap.exists() ? snap.val() : null;

                if (!userData) {
                    // Se não existir, criar dados básicos
                    userData = {
                        uid: uid,
                        userKey: uid,
                        email: 'usuario@email.com',
                        nome: 'Usuário',
                        criadoEm: Date.now()
                    };
                    await set(userDataRef, userData);
                }

                // Salvar no localStorage o userKey selecionado
                localStorage.setItem('current_userKey', uid);

                // Buscar o token de autenticação (opcional)
                const userAuthToken = await getUserAuthToken(uid);

                // Salvar/atualizar no Firebase o último uso
                await set(ref(db, `userKeysData/${uid}/lastLogin`), Date.now());

                // Pegar redirectURL do token da aplicação
                const tokenRef = ref(db, `tokens/${appToken}`);
                const tokenSnap = await get(tokenRef);
                if (!tokenSnap.exists()) {
                    throw new Error('Token da aplicação inválido');
                }
                const tokenData = tokenSnap.val();
                const redirectURL = tokenData.redirectURL;

                if (!redirectURL) {
                    throw new Error('URL de redirecionamento não encontrada');
                }

                statusEl.textContent = 'Redirecionando...';

                // Redireciona com o userKey da conta selecionada
                const sep = redirectURL.includes('?') ? '&' : '?';
                const urlFinal = redirectURL + sep + `userKey=${encodeURIComponent(uid)}`;

                window.location.href = urlFinal;

            } catch (err) {
                statusEl.textContent = 'Erro ao preparar sua sessão';
                errorEl.textContent = err.message || 'Erro desconhecido';
                console.error(err);
            }
        }

        // Função para carregar contas da Master Key
        async function loadAccountsFromMasterKey(masterKey) {
            try {
                const contasRef = ref(db, `contas/${masterKey}`);
                const snap = await get(contasRef);
                if (snap.exists()) {
                    const data = snap.val();
                    // Transforma em array
                    const accounts = Object.values(data);
                    return accounts;
                }
                return [];
            } catch (error) {
                console.error('Erro ao carregar contas da Master Key:', error);
                return [];
            }
        }

        // Função para exibir a lista de contas
        function renderAccountList(accounts) {
            accountListContainer.innerHTML = '';
            if (accounts.length === 0) {
                accountListContainer.innerHTML = `
                    <div style="text-align: center; color: var(--gray-color); padding: 20px;">
                        <p>Nenhuma conta encontrada para esta Master Key.</p>
                        <p style="font-size: 13px;">Você pode adicionar contas na página de autenticação.</p>
                    </div>
                `;
                confirmAccountBtn.disabled = true;
                return;
            }

            confirmAccountBtn.disabled = false;
            selectedAccountUid = null; // reset

            accounts.forEach(acc => {
                const item = document.createElement('div');
                item.className = 'account-item';
                // Se for a conta atual (do Firebase Auth), marcar como selecionada
                if (currentUser && acc.uid === currentUser.uid) {
                    item.classList.add('selected');
                    selectedAccountUid = acc.uid;
                }

                const avatar = document.createElement('div');
                avatar.className = 'account-avatar';
                const initial = (acc.username || acc.email || '?').charAt(0).toUpperCase();
                avatar.textContent = initial;
                // Cor do avatar baseada no nome
                const colors = ['#4361ee','#f72585','#4cc9f0','#7209b7','#f8961e','#43aa8b','#e63946','#277da1'];
                let hash = 0;
                const name = acc.username || acc.email || '?';
                for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
                avatar.style.background = colors[Math.abs(hash) % colors.length];

                const info = document.createElement('div');
                info.className = 'account-info';
                const nameDiv = document.createElement('div');
                nameDiv.className = 'account-name';
                nameDiv.textContent = acc.username || acc.email || 'Usuário';
                const emailDiv = document.createElement('div');
                emailDiv.className = 'account-email';
                emailDiv.textContent = acc.email || '';

                info.appendChild(nameDiv);
                info.appendChild(emailDiv);

                const check = document.createElement('div');
                check.className = 'account-check';
                check.textContent = '✓';

                item.appendChild(avatar);
                item.appendChild(info);
                item.appendChild(check);

                // Clique para selecionar
                item.addEventListener('click', () => {
                    document.querySelectorAll('.account-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedAccountUid = acc.uid;
                });

                accountListContainer.appendChild(item);
            });
        }

        // Se não houver token, redirecionar para auth
        if (!appToken) {
            statusEl.textContent = 'Token não encontrado. Redirecionando para login...';
            setTimeout(() => {
                window.location.href = 'https://alexandre7888.github.io/auth.html';
            }, 2000);
        }

        // Monitora o estado de autenticação
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Usuário NÃO está logado
                statusEl.textContent = 'Você não está autenticado';
                usernameEl.textContent = '';
                userInfoEl.innerHTML = '';
                continueBtn.style.display = 'none';
                loginRedirectEl.style.display = 'block';
                authTokenDisplay.style.display = 'none';
                accountSelectionDiv.style.display = 'none';
                return;
            }

            // Usuário ESTÁ logado
            currentUser = user;
            loginRedirectEl.style.display = 'none';
            continueBtn.style.display = 'none'; // Não usaremos mais o botão único
            accountSelectionDiv.style.display = 'block';

            // Verificar token da aplicação
            if (!appToken) {
                statusEl.textContent = 'Token da aplicação não informado. Redirecionando...';
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 2000);
                return;
            }

            // Buscar token da aplicação para obter redirectURL
            const tokenRef = ref(db, `tokens/${appToken}`);
            try {
                const tokenSnap = await get(tokenRef);
                if (!tokenSnap.exists()) {
                    statusEl.textContent = 'Token da aplicação inválido.';
                    errorEl.textContent = 'Token não encontrado no Firebase.';
                    return;
                }
                const tokenData = tokenSnap.val();
                const redirectURL = tokenData.redirectURL;
                if (!redirectURL) {
                    statusEl.textContent = 'Link de redirecionamento não encontrado.';
                    errorEl.textContent = 'URL de redirecionamento ausente.';
                    return;
                }

                // 1. Buscar a Master Key do usuário atual
                // Primeiro, verificar no localStorage
                let masterKey = localStorage.getItem('codehub_masterKey');

                // Se não tiver, buscar no Firebase (userKeysData do usuário atual)
                if (!masterKey) {
                    const userDataRef = ref(db, `userKeysData/${user.uid}`);
                    const snap = await get(userDataRef);
                    if (snap.exists()) {
                        const data = snap.val();
                        masterKey = data.masterKey || null;
                    }
                }

                // Se ainda não tiver, talvez esteja em userKeys (caminho antigo) ou users
                if (!masterKey) {
                    const userDataRef = ref(db, `users/${user.uid}`);
                    const snap = await get(userDataRef);
                    if (snap.exists()) {
                        const data = snap.val();
                        masterKey = data.masterKey || null;
                    }
                }

                // Se não tiver, cria uma nova Master Key
                if (!masterKey) {
                    masterKey = 'master_' + Date.now() + '_' + Math.random().toString(36).substr(2, 12);
                    // Salvar no usuário atual
                    await set(ref(db, `userKeysData/${user.uid}/masterKey`), masterKey);
                    localStorage.setItem('codehub_masterKey', masterKey);
                } else {
                    localStorage.setItem('codehub_masterKey', masterKey);
                }

                // 2. Carregar contas da Master Key
                const accounts = await loadAccountsFromMasterKey(masterKey);
                accountsList = accounts;

                // 3. Exibir a lista de contas
                renderAccountList(accounts);

                // Atualizar status
                statusEl.textContent = 'Selecione uma conta para continuar';
                usernameEl.textContent = ''; // limpa
                userInfoEl.innerHTML = ''; // limpa
                authTokenDisplay.style.display = 'none';

                // Se houver apenas uma conta, selecionar automaticamente?
                if (accounts.length === 1) {
                    selectedAccountUid = accounts[0].uid;
                    document.querySelector('.account-item')?.classList.add('selected');
                }

                // Botão de logout continua disponível (será adicionado depois)
                // Adicionar botão de logout (já existe no final)

            } catch (error) {
                statusEl.textContent = 'Erro ao carregar contas';
                errorEl.textContent = error.message;
                console.error(error);
            }
        });

        // Adicionar botão de logout
        const logoutBtn = document.createElement('button');
        logoutBtn.textContent = 'Trocar Usuário';
        logoutBtn.style.cssText = `
            margin-top: 10px;
            padding: 8px 15px;
            background-color: var(--gray-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        `;
        logoutBtn.onclick = async () => {
            try {
                await signOut(auth);
                statusEl.textContent = 'Sessão encerrada. Redirecionando para login...';
                setTimeout(() => {
                    redirectToLogin();
                }, 1500);
            } catch (error) {
                console.error('Erro ao fazer logout:', error);
            }
        };

        document.querySelector('.auth-content').appendChild(logoutBtn);
    </script>
</body>
</html>
